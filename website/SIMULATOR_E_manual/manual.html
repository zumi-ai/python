<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robolink Simulator Guide</title>
<style>
:root{--blue:#1f5fe0;--navy:#10244d;--mut:#5d6b82;--line:#d5dce7;--bg:#e8eef8;--r:1.1;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--navy)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
[hidden]{display:none!important}

/* ===== 위쪽 바 ===== */
#viewer{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.bar h2{flex:1;min-width:0;margin:0 4px;font-size:17px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn,#ind{flex-shrink:0;white-space:nowrap}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;flex-shrink:0}
.seg .btn:first-child{border-radius:10px 0 0 10px}
.seg .btn:last-child{border-radius:0 10px 10px 0;margin-left:-1.5px}
#ind{min-width:80px;text-align:center;font-size:15px;color:var(--mut)}
#pgIn{width:3.4em;font:inherit;text-align:center;color:var(--navy);font-weight:700;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:4px 2px;-moz-appearance:textfield}
#pgIn::-webkit-outer-spin-button,#pgIn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#pgIn:hover,#pgIn:focus{border-color:var(--blue);outline:none}
.short{display:none}
#copy.ok span{display:none}
#copy.ok::after{content:"복사됨!"}
@media(max-width:640px){
  .bar{gap:6px;padding:8px 10px}
  .bar h2{display:none}
  #toc{margin-right:auto}
  .btn{padding:7px 9px;font-size:13px}
  .long{display:none}.short{display:inline}
  #ind{min-width:0;font-size:12px}
  #pgIn{padding:3px 1px}
}

/* ===== 무대 ===== */
.stage{flex:1;min-height:0;position:relative}
#bookWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
.nv{position:absolute;top:50%;transform:translateY(-50%);z-index:500;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.92);font-size:26px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.nv:disabled{opacity:.25;cursor:default}
#pv{left:10px}#nx{right:10px}

/* 책 (펼침면) */
.book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2600px}
.base{position:absolute;top:0;width:var(--pw);height:var(--ph);overflow:hidden;box-shadow:0 6px 24px rgba(16,36,77,.22)}
.base.l{left:0;border-radius:8px 2px 2px 8px}
.base.r{left:50%;border-radius:2px 8px 8px 2px}
.leaf{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,0,.2,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face.front{border-radius:2px 8px 8px 2px}
.face.back{border-radius:8px 2px 2px 8px}
.base::after,.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.base.r::after,.face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.14),transparent 6%)}
.base.l::after,.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.14),transparent 6%)}

/* 한 쪽씩 보기 (좁은 화면) */
#single .sheet{width:var(--pw);box-shadow:0 6px 24px rgba(16,36,77,.22);border-radius:8px}
.inN{animation:inN .45s ease}.inP{animation:inP .45s ease}
@keyframes inN{from{transform:translateX(40px) rotateY(-14deg);opacity:0}}
@keyframes inP{from{transform:translateX(-40px) rotateY(14deg);opacity:0}}

/* 스크롤 보기 */
#scroll{position:absolute;inset:0;overflow-y:auto;padding:18px 12px 60px;-webkit-overflow-scrolling:touch}
#scroll::after{content:"";display:block;height:70vh}
#scroll .sheet{width:min(100%,760px);margin:0 auto 18px;box-shadow:0 4px 18px rgba(16,36,77,.15);border-radius:8px}

/* ===== 페이지 공통 (cqw = 페이지 너비 기준 비율) ===== */
.sheet{container-type:inline-size;width:100%;aspect-ratio:1/var(--r);background:#fff;overflow:hidden;position:relative}
.pg{position:absolute;inset:0;padding:5.5cqw 6cqw 4.5cqw;display:flex;flex-direction:column;font-size:2.9cqw;line-height:1.55;color:var(--navy);overflow:hidden;--c:var(--blue);--cs:#eaf1fd;--cm:#dce7fa;--cl:#8fb0f0;--cd:#1745a8;background:linear-gradient(165deg,#fff 0%,var(--cs) 100%) center/cover}
.pg h3{margin:0;font-size:4.8cqw;line-height:1.2;letter-spacing:-.02em;font-weight:800}
.pg small{display:block;font-size:2.6cqw;color:var(--mut);line-height:1.5}
.hd{display:flex;align-items:center;gap:2.2cqw}
.hd .tag{margin-left:auto;text-align:right;font-size:2.3cqw;line-height:1.35;font-weight:600;color:#26407a}
.n{display:inline-flex;align-items:center;justify-content:center;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:800;font-size:2cqw;line-height:1;flex:none}
.hd .n{width:4.4cqw;height:4.4cqw;font-size:2.4cqw}
.fr{border-radius:3cqw;overflow:hidden;background:linear-gradient(135deg,var(--cm),var(--cs));display:flex;align-items:center;justify-content:center;color:#7a8db0;font-size:2.6cqw}
.fr img,.th img,.ci img,.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.go{display:inline-block;border:0;border-radius:4cqw;background:var(--c);color:#fff;font-weight:800;font-size:2.7cqw;padding:1.6cqw 3.6cqw;text-decoration:none;white-space:nowrap;box-shadow:0 .6cqw 1.6cqw rgba(16,36,77,.25)}
.go.big{font-size:3.6cqw;padding:2.2cqw 10cqw}
.ft{display:flex;align-items:center;justify-content:center;gap:3cqw;margin-top:2.5cqw;height:6.5cqw;flex:none}
.ft span{font-size:2.8cqw;font-weight:700;white-space:nowrap;color:var(--c)}

/* 표지 */
.pg.cover{background:linear-gradient(180deg,#cfe6ff 0%,#9cc7f7 45%,#2f74e6 100%) center/cover}
.cover .ctop{display:flex;align-items:center;justify-content:flex-end}
.logo{position:absolute;top:5.5cqw;left:6cqw;height:auto;pointer-events:none}
.brand{margin-right:auto;font-size:3.6cqw;color:var(--blue);font-weight:900;letter-spacing:.02em}
.badge{background:#3b82f6;color:#fff;border-radius:3cqw;padding:1cqw 2.6cqw;font-size:2.5cqw;font-weight:700}
.cover h2{margin:9cqw 0 2.4cqw;font-size:7.6cqw;line-height:1.2;font-weight:900;letter-spacing:-.02em}
.cover h2 em{display:block;font-style:normal;color:var(--blue)}
.cover p{margin:0;font-size:3.4cqw;line-height:1.55;font-weight:600}
.flt{position:absolute;top:12cqw;right:5cqw;height:auto;pointer-events:none;filter:drop-shadow(0 2.2cqw 1.6cqw rgba(16,36,77,.28));animation:flt 3.4s ease-in-out infinite alternate}
@keyframes flt{from{transform:translate(0,0) rotate(-3deg)}to{transform:translate(-1cqw,-2.4cqw) rotate(3deg)}}
.cover .cft{margin-top:auto;display:flex;justify-content:space-between;color:#fff;font-size:2.4cqw;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.35)}

/* 목차 */
.contents h3{font-size:7cqw;color:var(--blue);font-weight:900}
.contents .sub{margin:1.2cqw 0 3cqw;font-size:3cqw;font-weight:700}
.list{flex:1;min-height:0;display:flex;flex-direction:column}
.ci2{display:flex;align-items:center;gap:3cqw;width:100%;flex:1;min-height:0;border:0;border-bottom:.3cqw solid #d5e0f5;background:transparent;padding:2.4cqw 0;text-align:left}
.ci2:last-child{border-bottom:0}
.ci2 .th{flex:0 0 45%;height:100%;max-height:22cqw;border-radius:1.2cqw;overflow:hidden;background:linear-gradient(135deg,var(--cm),var(--cs));display:flex;align-items:center;justify-content:center;font-size:2.4cqw;color:#7a8db0}
.ci2 .tx{flex:1}
.ci2 b{display:flex;gap:1.4cqw;align-items:flex-start;font-size:3.2cqw;line-height:1.3}
.ci2 .n{width:3.8cqw;height:3.8cqw;font-size:2.3cqw;margin-top:.2cqw}
.ci2 small{margin:.8cqw 0 0 5.2cqw}
.ar{width:6cqw;height:6cqw;border-radius:50%;background:#fff;color:var(--c);box-shadow:0 .4cqw 1.4cqw rgba(16,36,77,.2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:3.6cqw;flex:none}

/* 시작 전 확인 */
.check .list{gap:2.6cqw;margin:3.5cqw 0}
.check .row{display:flex;align-items:center;gap:3cqw;background:var(--cm);border-radius:3cqw;padding:3cqw 3.4cqw;flex:1;min-height:0}
.ck{width:5.6cqw;height:5.6cqw;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:3.2cqw;flex:none}
.row b{display:block;font-size:3.4cqw}
.rimg{margin-left:auto;width:22cqw;height:100%;max-height:16cqw;border-radius:2cqw;overflow:hidden;flex:none}
.cta{text-align:center}

/* 시뮬레이터 소개 */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:4cqw;align-items:center;margin:3cqw 0;flex:none}
.hero .fr{aspect-ratio:16/10}
.hero .fr img{object-fit:contain}
.hx{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2.2cqw}
.hero p{margin:0;font-weight:600;line-height:1.65;font-size:2.7cqw}
.dbtn{margin:0 0 2cqw}
.prog{flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.75);border-radius:3cqw;padding:2.6cqw 3cqw;box-shadow:0 .4cqw 2cqw rgba(30,70,160,.08)}
.prog h4{margin:0 0 2cqw;font-size:3cqw}
.prog h4::first-letter{color:var(--c)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:1fr;gap:2cqw}
.cd{display:flex;flex-direction:column;min-height:0;gap:.8cqw}
.ci{position:relative;flex:1;min-height:0;border-radius:2cqw;overflow:hidden;background:linear-gradient(135deg,var(--cm),var(--cs));display:flex;align-items:center;justify-content:center;color:#7a8db0;font-size:2.2cqw}
.ct{font-size:2.3cqw;font-weight:700;display:flex;align-items:center;gap:1cqw;line-height:1.3;white-space:nowrap}
.ci .n{position:absolute;top:.9cqw;left:.9cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.3)}
.cd.ico{background:var(--cm);border-radius:2.4cqw;align-items:center;justify-content:center;padding:2cqw;text-align:center}
.ico .ci{flex:none;width:11cqw;height:11cqw;border-radius:50%;background:#fff}
.ico .ci span{font-size:6cqw}
.ico .ct{justify-content:center;text-align:center;white-space:normal;font-size:2.5cqw}

/* 세부 페이지 */
.detail .fr{flex:1;min-height:0;margin:2.5cqw 0}
.detail .fr img{object-fit:contain}
.crumb{font-size:2.3cqw;font-weight:700;color:var(--c);margin:0 0 1cqw}
.drow{display:flex;align-items:center;justify-content:space-between;gap:2cqw;margin:0 0 2cqw}
.tags{display:flex;flex-wrap:wrap;gap:1cqw}
.tags span{background:var(--cs);border:.25cqw solid var(--cm);color:var(--cd);border-radius:2cqw;padding:.6cqw 1.8cqw;font-size:2.2cqw;font-weight:700}
.cd[data-go]{cursor:pointer}
.detail .dt{margin:0 0 1.5cqw;font-weight:600;line-height:1.7}
.detail ul{margin:0 0 1cqw;padding-left:4cqw}

/* 미션 구성 페이지 */
.mlist{flex:1;min-height:0;display:flex;flex-direction:column;gap:2cqw;margin:3cqw 0 0}
.mi{flex:1;min-height:0;max-height:24cqw;display:flex;align-items:center;gap:3cqw;background:rgba(255,255,255,.85);border:.3cqw solid var(--cm);border-radius:3cqw;padding:1.6cqw 3.2cqw}
.mic{flex:none;width:9cqw;height:9cqw;border-radius:50%;background:var(--cm);display:flex;align-items:center;justify-content:center;font-size:5cqw}
.mi b{display:block;font-size:3.3cqw;line-height:1.3;margin-bottom:.6cqw}
.mi small{color:var(--navy);font-weight:500;font-size:2.7cqw}
.mi.fin{background:var(--c);border-color:var(--c);color:#fff}
.mi.fin small{color:#fff}.mi.fin .mic{background:rgba(255,255,255,.25)}

/* 조작 방법 페이지 */
.cdia{margin:2.4cqw 0 1.6cqw;background:#fff;border:.3cqw solid var(--cm);border-radius:3cqw;padding:1.6cqw 4cqw}
.cdia svg{display:block;width:100%;height:auto;max-height:38cqw}
.pc{fill:var(--c)}
.controls .ft{margin-top:auto}
.cnote{margin:1.2cqw 0 .4cqw;font-size:2.4cqw;font-weight:600;color:var(--mut)}
.chd,.cr{display:grid;grid-template-columns:31% 28% 1fr;gap:2cqw;align-items:center}
.chd{margin-top:.8cqw;padding:0 2.6cqw;font-size:2.4cqw;font-weight:800;color:var(--cd)}
.cgh{margin:.9cqw 0 .6cqw;font-size:2.7cqw;font-weight:800;color:var(--c)}
.cr{background:rgba(255,255,255,.88);border:.25cqw solid var(--cm);border-radius:2cqw;padding:.5cqw 2.6cqw;margin-bottom:.5cqw;font-size:2.6cqw;font-weight:600;line-height:1.3}
.cr b{font-size:2.8cqw}
kbd{display:inline-block;min-width:4.6cqw;padding:.4cqw 1.4cqw;margin:.2cqw .5cqw .2cqw 0;text-align:center;font:inherit;font-weight:800;color:var(--navy);background:#fff;border:.3cqw solid #9aa8c4;border-bottom-width:.7cqw;border-radius:1.1cqw}
.pd{display:inline-block;padding:.4cqw 1.8cqw;margin-right:.7cqw;border-radius:2cqw;background:var(--c);color:#fff;font-style:normal;font-weight:800}

/* 이렇게 시작해요 (howto) */
.howto .steps{display:flex;align-items:stretch;gap:1cqw;margin:3cqw 0 2.4cqw;flex:none}
.howto .st{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.8cqw;background:#fff;border-radius:3cqw;padding:2.4cqw 1.4cqw;box-shadow:0 .4cqw 1.6cqw rgba(30,70,160,.1)}
.howto .st i{display:flex;align-items:center;justify-content:center;width:6.4cqw;height:6.4cqw;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:900;font-size:3.6cqw}
.howto{word-break:keep-all}
.howto .st b{font-size:2.7cqw}
.howto .st small{font-size:2.3cqw;line-height:1.45}
.howto .sa{align-self:center;font-size:4cqw;font-weight:900;color:var(--cl)}
.howto .ht{margin:0 0 1.6cqw;font-size:3cqw;font-weight:800}
.hcols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2.2cqw}
.hc{display:flex;flex-direction:column;min-height:0;background:#fff;border-radius:3cqw;overflow:hidden;border:.3cqw solid var(--cm)}
.hc .top{background:var(--c);color:#fff;text-align:center;padding:2cqw 1cqw;font-weight:800;font-size:3cqw;line-height:1.3}
.hc .top span{display:block;font-size:6cqw;line-height:1.2}
.hc ul{list-style:none;margin:0;padding:2cqw 1.8cqw;display:flex;flex-direction:column;gap:1.2cqw;font-size:2.4cqw;font-weight:600;line-height:1.4}
.hc li{display:flex;gap:1cqw;align-items:flex-start}
.hc li::before{content:"●";color:var(--c);font-size:1.8cqw;line-height:2.1}

/* 뒷표지 */
.pg.endp{align-items:center;justify-content:center}
.pg.endp h3{color:var(--navy);font-size:6cqw;letter-spacing:.12em}
.elogo{width:46cqw;height:auto;display:block}


/* 사용 방법 설명 페이지 (manual) */
.manual .hd h3{font-size:3.5cqw;color:var(--mut);font-weight:800;letter-spacing:-.01em}
.manual .ml{margin:1.2cqw 0 0;font-weight:600;font-size:2.7cqw}
.manual .mf{flex:none;height:auto!important;width:72cqw;aspect-ratio:1920/900;align-self:center;margin:1.6cqw 0 .5cqw;background:none;border-radius:2cqw;box-shadow:0 .5cqw 1.6cqw rgba(16,36,77,.18)}
.manual .mf img{object-fit:cover}
.mc{text-align:center;font-size:2.2cqw;color:var(--mut);font-weight:600;margin:0 0 1.6cqw}
.stp{display:flex;gap:2.2cqw;align-items:flex-start;background:rgba(255,255,255,.88);border:.25cqw solid var(--cm);border-radius:2.4cqw;padding:.8cqw 2.2cqw;margin-bottom:.8cqw}
.stp .n{width:4cqw;height:4cqw;font-size:2.3cqw;margin-top:.3cqw}
.stp b{display:block;font-size:2.7cqw;line-height:1.4}
.stp small{font-size:2.4cqw;line-height:1.45;color:var(--navy);font-weight:500}
.mr{display:grid;grid-template-columns:var(--g);gap:2cqw;align-items:center;background:rgba(255,255,255,.88);border:.25cqw solid var(--cm);border-radius:2cqw;padding:.6cqw 2.4cqw;margin-bottom:.6cqw;font-size:2.5cqw;font-weight:600;line-height:1.35}
.mr.mh{background:transparent;border:0;padding:0 2.4cqw;font-weight:800;color:var(--cd);margin-bottom:.4cqw}
.mtip{margin-top:.6cqw;background:var(--c);color:#fff;border-radius:2.4cqw;padding:1.2cqw 2.6cqw;font-weight:700;font-size:2.5cqw;line-height:1.45}
.manual .ft{margin-top:auto}

/* 주미 AI 소개·세부 페이지: 이미지 틀을 1920x900 비율로 */
.detail[style*="#2563eb"] .fr{flex:none;width:100%;aspect-ratio:1920/900;margin:2.5cqw 0 2cqw;background:none}
.detail[style*="#2563eb"] .fr img{object-fit:cover}
.sim[style*="#2563eb"] .hero{grid-template-columns:1fr 1fr}
.sim[style*="#2563eb"] .grid{grid-auto-rows:auto;align-content:start}
.sim[style*="#2563eb"] .prog{flex:none}
.sim[style*="#2563eb"] .ci{flex:none;aspect-ratio:1920/900}
.sim[style*="#2563eb"] .ci img{object-fit:cover}
.sim[style*="#2563eb"] .hero .fr{aspect-ratio:1920/900;background:none}
.sim[style*="#2563eb"] .hero .fr img{object-fit:cover}

/* 주미 AI 소개 페이지(25페이지) 이미지 및 여백 축소 */
.sim[style*="#2563eb"] .hero {
  margin: 1.5cqw 0;
}

.sim[style*="#2563eb"] .hero .fr {
  aspect-ratio: 2.5 / 1;
}

.sim[style*="#2563eb"] .ci {
  aspect-ratio: 2.5 / 1;
}

.sim[style*="#2563eb"] .prog {
  padding: 1.8cqw 2.4cqw;
}

.mr .fa-solid {
  margin-right: 1.2cqw;
  color: var(--c);
}

/* 책 바깥(무대) 배경: 보고 있는 시뮬레이터 색을 따라 옅은 색 + 패턴 */
.stage.th{background:
 radial-gradient(circle at 18% 22%,color-mix(in srgb,var(--sc) 16%,transparent),transparent 34%),
 radial-gradient(circle at 82% 78%,color-mix(in srgb,var(--sc) 14%,transparent),transparent 38%),
 radial-gradient(circle at 78% 12%,color-mix(in srgb,var(--sc) 9%,transparent),transparent 26%),
 radial-gradient(circle,color-mix(in srgb,var(--sc) 15%,transparent) 1.5px,transparent 2px) 7px 11px/53px 47px,

   ↑ 여기까지가 고치는 부분입니다. 아래는 건드리지 않아도 됩니다.
   ================================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const mixw = (hex, a) => { const n = parseInt(hex.slice(1), 16), f = v => Math.round(255 - (255 - v) * a).toString(16).padStart(2, '0'); return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255); };
const mixb = (hex, a) => { const n = parseInt(hex.slice(1), 16), f = v => Math.round(v * a).toString(16).padStart(2, '0'); return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255); };
const thm = k => { const c = THEMES[k] || k; return /^#[0-9a-f]{6}$/i.test(c) ? `--c:${c};--cs:${mixw(c,.1)};--cm:${mixw(c,.2)};--cl:${mixw(c,.62)};--cd:${mixb(c,.7)};` : ''; };
const R = SITE.ratio;
document.documentElement.style.setProperty('--r', R);
const pst = document.createElement('style');
pst.textContent = `@page{size:210mm ${(210 * R).toFixed(1)}mm;margin:0}`;
document.head.appendChild(pst);
document.title = SITE.title; $('vt').textContent = SITE.title;

const pages = PAGES.slice();
if (pages.length % 2) {                       /* 쪽수를 짝수로 맞춤 (뒷표지는 항상 마지막) */
  if (pages[pages.length - 1].type === 'back') pages.splice(pages.length - 1, 0, { type:'blank' });
  else pages.push({ type:'back', logo:LOGO });
}
const pageNo = x => /^\d+$/.test(String(x)) ? +x : (pages.findIndex(p => p.id === x) + 1 || 1);
const N = pages.length, S = N / 2;
const setInd = n => { $('pgIn').value = n; };
$('pgN').textContent = N;

/* 페이지 만들기 */
const ph = (src, alt) => src ? `<img src="${esc(src)}" alt="${esc(alt)}">` : '이미지';
const btn = (b, big) => !b ? '' : (b.url
  ? `<a class="go${big?' big':''}" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label || '시작하기')} ›</a>`
  : `<button class="go${big?' big':''}" data-go="${pageNo(b.go)}">${esc(b.label || '다음 페이지')} ›</button>`);
const foot = i => `<div class="ft"><span class="pgn">${i+1}</span></div>`;

const PAD = `<svg viewBox="0 0 600 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="조종기 그림" font-family="Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle">
<rect x="30" y="70" width="540" height="200" rx="70" fill="#3a4152"/>
<rect class="pc" x="60" y="6" width="130" height="26" rx="8"/><text x="125" y="25" fill="#fff" font-size="17">L1</text>
<rect class="pc" x="60" y="37" width="130" height="26" rx="8"/><text x="125" y="56" fill="#fff" font-size="17">L2</text>
<rect class="pc" x="410" y="6" width="130" height="26" rx="8"/><text x="475" y="25" fill="#fff" font-size="17">R1</text>
<rect class="pc" x="410" y="37" width="130" height="26" rx="8"/><text x="475" y="56" fill="#fff" font-size="17">R2</text>
<text x="300" y="40" fill="#5d6b82" font-size="13">▲ 조종기 뒤쪽 윗부분 버튼 ▲</text>
<circle cx="150" cy="160" r="54" fill="#232834"/><circle cx="150" cy="160" r="33" fill="#4a5266" stroke="#8d97ad" stroke-width="3"/>
<circle cx="450" cy="160" r="54" fill="#232834"/><circle cx="450" cy="160" r="33" fill="#4a5266" stroke="#8d97ad" stroke-width="3"/>
<text x="150" y="238" fill="#fff" font-size="14">왼쪽 스틱</text><text x="150" y="256" fill="#cfd6e6" font-size="12">고도 · 회전</text>
<text x="450" y="238" fill="#fff" font-size="14">오른쪽 스틱</text><text x="450" y="256" fill="#cfd6e6" font-size="12">이동</text>
<rect x="235" y="92" width="130" height="62" rx="6" fill="#dfe8f3"/><text x="300" y="130" fill="#5d6b82" font-size="16">화면</text>
<rect class="pc" x="288" y="162" width="24" height="20" rx="5"/><text x="300" y="177" fill="#fff" font-size="12">▲</text>
<rect class="pc" x="288" y="228" width="24" height="20" rx="5"/><text x="300" y="243" fill="#fff" font-size="12">▼</text>
<rect class="pc" x="256" y="194" width="28" height="22" rx="5"/><text x="270" y="210" fill="#fff" font-size="12">◀</text>
<rect class="pc" x="316" y="194" width="28" height="22" rx="5"/><text x="330" y="210" fill="#fff" font-size="12">▶</text>
<circle cx="300" cy="205" r="9" fill="#232834"/>
<text x="300" y="264" fill="#cfd6e6" font-size="12">가운데 버튼</text>
</svg>`;
const kk = s => esc(s).replace(/:(fa-[a-z-]+):/g, '<i class="fa-solid $1"></i>').replace(/\{([^}]+)\}/g, '<i class="pd">$1</i>').replace(/\n/g, '<br>');
const T = {
  cover: p => { const t = p.showText !== false; return `<div class="pg cover"${p.img ? ` style="background-image:url('${esc(p.img)}')"` : ''}>
    ${t ? `<div class="ctop">${p.logoImg ? '' : `<b class="brand">${esc(p.brand)}</b>`}<span class="badge">📖 ${esc(p.badge)}</span></div>
    <h2>${nl(p.title)}<em>${esc(p.highlight)}</em></h2><p>${nl(p.sub)}</p>
    <div class="cft"><span>🖥 ${esc(p.footer)}</span><span>${esc(p.tagline)}</span></div>` : ''}
    ${p.logoImg ? `<img class="logo" src="${esc(p.logoImg)}" alt="${esc(p.brand)}" style="width:${+p.logoSize || 18}cqw">` : ''}
    ${p.floatImg ? `<img class="flt" src="${esc(p.floatImg)}" alt="" style="width:${+p.floatSize || 22}cqw">` : ''}</div>`; },
  contents: p => `<div class="pg contents"><h3>${esc(p.title)}</h3><div class="sub">${esc(p.sub)}</div>
    <div class="list">${p.items.map((it, k) => `<button class="ci2" data-go="${pageNo(it.go)}" style="${thm(it.theme)}">
      <span class="th">${ph(it.img, it.t)}</span>
      <span class="tx"><b><i class="n">${k+1}</i>${esc(it.t)}</b><small>${nl(it.d)}</small></span><span class="ar">›</span></button>`).join('')}</div></div>`,
  check: p => `<div class="pg check"><div class="hd"><h3>💡 ${esc(p.title)}</h3><span class="tag">${nl(p.side)}</span></div>
    <div class="list">${p.items.map(it => `<div class="row"><span class="ck">✓</span><div><b>${esc(it.t)}</b><small>${nl(it.d)}</small></div>${it.img ? `<span class="rimg">${ph(it.img, it.t)}</span>` : ''}</div>`).join('')}</div>
    ${p.button ? `<div class="cta">${btn(p.button, true)}</div>` : ''}</div>`,
  sim: (p, i) => `<div class="pg sim" style="${thm(p.theme)}"><div class="hd">${p.no ? `<i class="n">${esc(p.no)}</i>` : ''}<h3>${esc(p.title)}</h3><span class="tag">${nl(p.tag)}</span></div>
    <div class="hero"><div class="fr">${ph(p.img, p.title)}</div><div class="hx">${btn(p.button)}<p>${nl(p.text)}</p></div></div>
    <div class="prog"><h4>★ ${esc(p.section)}</h4><div class="grid" style="--cols:${p.cols || 4}">${(p.cards || []).map((c, k) =>
      `<div class="cd${c.icon ? ' ico' : ''}"${c.go ? ` data-go="${pageNo(c.go)}"` : ''}><div class="ci">${c.icon ? `<span>${esc(c.icon)}</span>` : ph(c.img, c.t)}${p.numbered ? `<i class="n">${k+1}</i>` : ''}</div><div class="ct">${nl(c.t)}</div></div>`).join('')}</div></div>${foot(i)}</div>`,
  detail: (p, i) => `<div class="pg detail" style="${thm(p.theme)}">
    ${p.crumb ? `<div class="crumb">${esc(p.crumb)}</div>` : ''}
    <div class="hd">${p.no ? `<i class="n">${esc(p.no)}</i>` : ''}<h3>${esc(p.title)}</h3></div>
    <div class="fr">${ph(p.img, p.title)}</div>
    <div class="drow"><div class="tags">${(p.tags || []).map(x => `<span>${esc(x)}</span>`).join('')}</div>${btn(p.button)}</div>
    <p class="dt">${nl(p.text)}</p>
    ${p.points ? `<ul>${p.points.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${foot(i)}</div>`,
  controls: (p, i) => `<div class="pg controls" style="${thm(p.theme)}">
    ${p.crumb ? `<div class="crumb">${esc(p.crumb)}</div>` : ''}
    <div class="hd"><h3>${esc(p.title)}</h3></div>
    ${p.diagram ? `<div class="cdia">${PAD}</div>` : ''}
    ${p.note ? `<p class="cnote">${nl(p.note)}</p>` : ''}
    <div class="chd"><span>동작</span><span>⌨ 키보드</span><span>🎮 조이스틱</span></div>
    ${p.groups.map(g => `<div class="cgh">${esc(g.h)}</div>${g.rows.map(r => `<div class="cr"><b>${nl(r[0])}</b><span>${kk(r[1])}</span><span>${kk(r[2])}</span></div>`).join('')}`).join('')}
    ${foot(i)}</div>`,
  manual: (p, i) => `<div class="pg manual" style="${thm(p.theme)}">
    ${p.crumb ? `<div class="crumb">${esc(p.crumb)}</div>` : ''}
    <div class="hd"><h3>${esc(p.title)}</h3></div>
    ${p.lead ? `<p class="ml">${kk(p.lead)}</p>` : ''}
    ${p.img ? `<div class="fr mf" style="width:${p.iw || 72}cqw">${ph(p.img, p.title)}</div>${p.cap ? `<div class="mc">${esc(p.cap)}</div>` : ''}` : ''}
    ${(p.steps || []).map((s, k) => `<div class="stp"><i class="n">${k+1}</i><div><b>${kk(s[0])}</b><small>${kk(s[1])}</small></div></div>`).join('')}
    ${p.rows ? `<div class="mr mh" style="--g:${p.g}">${p.head.map(h => `<span>${esc(h)}</span>`).join('')}</div>${p.rows.map(r => `<div class="mr" style="--g:${p.g}">${r.map((c, k) => k ? `<span>${kk(c)}</span>` : `<b>${kk(c)}</b>`).join('')}</div>`).join('')}` : ''}
    ${p.tip ? `<div class="mtip"><b>※ 팁 (Tip) : </b> ${kk(p.tip)}</div>` : ''}${foot(i)}</div>`,
  howto: (p, i) => `<div class="pg howto"><div class="hd"><h3>${esc(p.title)}</h3><span class="tag">${nl(p.side)}</span></div>
    <div class="steps">${p.steps.map((x, k) => `${k ? '<span class="sa">›</span>' : ''}<div class="st"><i>${k+1}</i><b>${esc(x.t)}</b><small>${nl(x.d)}</small></div>`).join('')}</div>
    <h4 class="ht">★ ${esc(p.colsTitle)}</h4>
    <div class="hcols">${p.cols.map(c => `<div class="hc" style="${thm(c.theme)}"><div class="top"><span>${esc(c.icon)}</span>${esc(c.t)}</div><ul>${c.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}</div>
    ${foot(i)}</div>`,
  missions: (p, i) => `<div class="pg missions" style="${thm(p.theme)}">
    ${p.crumb ? `<div class="crumb">${esc(p.crumb)}</div>` : ''}
    <div class="hd">${p.no ? `<i class="n">${esc(p.no)}</i>` : ''}<h3>${esc(p.title)}</h3></div>
    <div class="mlist">${p.items.map((m, k) => `<div class="mi${m[0] === '🏆' ? ' fin' : ''}"><span class="mic">${esc(m[0])}</span><div><b>${k+1}. ${esc(m[1])}</b><small>${nl(m[2])}</small></div></div>`).join('')}</div>${foot(i)}</div>`,
  back: p => `<div class="pg endp">${p.logo ? `<img class="elogo" src="${esc(p.logo)}" alt="ROBOLINK" onerror="this.outerHTML='<h3>ROBOLINK</h3>'">` : '<h3>ROBOLINK</h3>'}</div>`,
  blank: () => `<div class="pg"></div>`
};
const H = pages.map((p, i) => (T[p.type] || T.detail)(p, i));
const sheet = h => `<div class="sheet">${h}</div>`;

$('print').innerHTML = H.map(sheet).join('');
$('scroll').innerHTML = H.map(sheet).join('');
let lv = `<div class="base l">${sheet(H[0])}</div><div class="base r">${sheet(H[N-1])}</div>`;
for (let k = 0; k < S - 1; k++)
  lv += `<div class="leaf" data-k="${k}"><div class="face front">${sheet(H[2*k+1])}</div><div class="face back">${sheet(H[2*k+2])}</div></div>`;
$('book').innerHTML = lv;

/* 상태 */
let mode = 'book', s = 0, cur = 1, single = false;
function sync(){
  const a = pages[cur-1], b = (mode === 'book' && !single) ? pages[cur] : null;
  const t = (a && a.theme) || (b && b.theme), st = document.querySelector('.stage');
  if (t && THEMES[t]) { st.style.setProperty('--sc', THEMES[t]); st.classList.add('th'); } else st.classList.remove('th');
  try { history.replaceState(null, '', '#' + mode + '/' + cur); } catch (e) {} }

function size(){
  const w = $('bookWrap').clientWidth - 32, h = $('bookWrap').clientHeight - 32;
  single = innerWidth < 700;
  const pw = Math.max(120, single ? Math.min(w, h / R, 640) : Math.min(w / 2, h / R, 620));
  $('bookWrap').style.setProperty('--pw', pw + 'px');
  $('bookWrap').style.setProperty('--ph', pw * R + 'px');
  $('book').hidden = single; $('single').hidden = !single;
}

let tmr;
const leaves = () => document.querySelectorAll('.leaf');
function layout(){
  leaves().forEach(l => {
    const k = +l.dataset.k, fl = k < s;
    l.classList.toggle('flipped', fl);
    l.style.zIndex = fl ? k + 1 : S - k;
  });
}
function updUI(){
  cur = 2 * s + 1;
  setInd(2*s+1);
  $('pv').disabled = s === 0; $('nx').disabled = s === S - 1;
  sync();
}
/* 펼침면 이동: 움직이는 한 장만 맨 위에서 넘어가고, 나머지는 즉시 정리 */
function setSpread(t, anim){
  clearTimeout(tmr);
  const L = [...leaves()], old = s, bk = $('book');
  L.forEach(l => l.style.transition = 'none');   /* 진행 중이던 애니메이션은 끝난 상태로 고정 */
  layout(); void bk.offsetWidth;
  if (t === old || !anim) {
    s = t; layout(); void bk.offsetWidth;
    L.forEach(l => l.style.transition = '');
    updUI(); return;
  }
  const lo = Math.min(old, t), hi = Math.max(old, t), a = t > old ? hi - 1 : lo;
  s = t;
  L.forEach(l => {
    const k = +l.dataset.k, fl = k < s;
    l.style.transition = k === a ? '' : 'none';
    l.classList.toggle('flipped', fl);
    l.style.zIndex = k === a ? 100 : (fl ? k + 1 : S - k);
  });
  updUI();
  tmr = setTimeout(layout, 850);
}
function showSingle(n, dir){
  cur = n;
  $('single').innerHTML = sheet(H[n-1]);
  if (dir) $('single').firstChild.classList.add(dir > 0 ? 'inN' : 'inP');
  setInd(n);
  $('pv').disabled = n === 1; $('nx').disabled = n === N;
  sync();
}
function onScroll(){
  const sc = $('scroll'), sh = sc.querySelector('.sheet'); if (!sh) return;
  const i = Math.min(N, Math.round(sc.scrollTop / (sh.offsetHeight + 18)) + 1);
  setInd(i);
  if (mode === 'scroll') { cur = i; sync(); }
}
function goScroll(n){
  const sc = $('scroll'), el = sc.querySelectorAll('.sheet')[n-1];
  sc.scrollTop = el ? el.offsetTop - 18 : 0;
  cur = n; onScroll();
}
function setMode(m, n){
  if (n === undefined) n = cur;
  mode = m;
  const b = m === 'book';
  $('bookWrap').hidden = !b; $('scroll').hidden = b;
  $('mBook').classList.toggle('on', b); $('mScroll').classList.toggle('on', !b);
  if (b) { size(); if (single) showSingle(n, 0); else setSpread((n - 1) >> 1, false); }
  else goScroll(n);
}
function step(d){
  if (mode !== 'book') return;
  if (single) { const n = cur + d; if (n >= 1 && n <= N) showSingle(n, d); return; }
  const n = s + d; if (n < 0 || n > S - 1) return;
  setSpread(n, true);
}
function go(n){
  n = Math.min(Math.max(n, 1), N);
  if (mode === 'scroll') goScroll(n);
  else if (single) showSingle(n, n > cur ? 1 : -1);
  else setSpread((n - 1) >> 1, true);
}

/* 버튼 / 키보드 / 밀기 */
$('mBook').onclick = () => setMode('book');
$('mScroll').onclick = () => setMode('scroll');
$('toc').onclick = () => go(1);
$('pv').onclick = () => step(-1); $('nx').onclick = () => step(1);
$('pdf').onclick = () => window.print();
$('scroll').addEventListener('scroll', onScroll);
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) go(+g.dataset.go); });
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1);
});
/* 오른쪽 위 "11 / 40"의 앞 숫자를 고치고 Enter 를 누르면 그 페이지로 이동 */
const pgIn = $('pgIn');
function jump(){ const v = parseInt(pgIn.value, 10); if (v >= 1) go(Math.min(v, N)); pgIn.blur(); }
pgIn.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') jump(); });  /* 입력 중에는 방향키로 책이 넘어가지 않음 */
pgIn.addEventListener('focus', () => pgIn.select());
pgIn.addEventListener('blur', () => setInd(cur));
let tx = null;
$('bookWrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
$('bookWrap').addEventListener('touchend', e => {
  if (tx == null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
});
addEventListener('resize', () => {
  if (mode !== 'book') return;
  const was = single; size();
  if (was !== single) { if (single) showSingle(cur, 0); else setSpread((cur - 1) >> 1, false); }
});

/* 이미지를 누르면 크게 보기 (페이지 이동보다 먼저 처리) */
const lb = $('lb');
const lbClose = () => { lb.hidden = true; };
document.addEventListener('click', e => {
  if (!lb.hidden) { lbClose(); e.stopPropagation(); return; }
  const im = e.target.closest('img');
  if (im && im.closest('.fr,.ci,.rimg') && im.getAttribute('src')) {
    e.stopPropagation(); e.preventDefault();
    lb.querySelector('img').src = im.src; lb.querySelector('img').alt = im.alt; lb.hidden = false;
  }
}, true);
addEventListener('keydown', e => { if (!lb.hidden) { e.stopPropagation(); if (e.key === 'Escape') lbClose(); } }, true);

/* 링크 복사: 주소#읽기방식/페이지  예) robolink-manual.html#scroll/4 */
$('copy').onclick = () => {
  const url = location.href.split('#')[0] + '#' + mode + '/' + cur;
  const done = () => { $('copy').classList.add('ok'); setTimeout(() => $('copy').classList.remove('ok'), 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => prompt('링크를 복사하세요', url));
  else prompt('링크를 복사하세요', url);
};

/* 링크로 들어왔을 때 해당 페이지·읽기방식으로 바로 열기 (없으면 표지 펼침면) */
function route(){
  const parts = location.hash.slice(1).split('/');
  const m = parts.find(x => x === 'book' || x === 'scroll');
  const n = parts.find(x => /^\d+$/.test(x));
  setMode(m || 'book', Math.min(Math.max(parseInt(n) || 1, 1), N));
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>

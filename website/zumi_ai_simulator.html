            renderer.setSize(cw, ch);
            if (typeof resizeZumiCam === 'function') resizeZumiCam();
        }

        // ===== 조종 모드 =====
        const keys = new Set();
        const KEYMAP = {
            ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
            ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right'
        };
        let driveSpeedCm = 30;
        let driveVel = 0;            // 현재 속도 (units/s, 앞쪽이 +)
        let driveBusy = false;
        let pendingDriveReset = false;
        let lastBlockMsg = 0;
        let lastFrameTime = performance.now();
        const DRIVE_TURN_RATE = 110 * Math.PI / 180;  // 초당 회전각
        const ROBOT_R = 0.8;                          // 충돌 원 반지름
        const ROBOT_OFFSETS = [-0.25, 0.25];          // 몸통 앞/뒤 충돌 원 위치
        const WORLD_LIMIT = 47;

        function setKey(k, down) {
            if (down) keys.add(k); else keys.delete(k);
            document.querySelectorAll(`[data-key="${k}"]`).forEach(b => b.classList.toggle('active', down));
            document.body.classList.toggle('driving-now', keys.size > 0);
        }
        function releaseAllKeys() {
            ['up', 'down', 'left', 'right'].forEach(k => setKey(k, false));
        }

        function robotCollides(x, z, yaw) {
            const sn = Math.sin(yaw), cs = Math.cos(yaw);
            for (const lz of ROBOT_OFFSETS) {
                const cx = x + lz * sn, cz = z + lz * cs;
                if (Math.abs(cx) > WORLD_LIMIT || Math.abs(cz) > WORLD_LIMIT) return true;
                for (const o of obstacles) {
                    if (circleHitsObstacle(cx, cz, ROBOT_R, o)) return true;
                }
            }
            return false;
        }

        function updateDrive(dt) {
            driveBusy = false;
            blockedNow = false;
            if ((mode !== 'drive' && mode !== 'learn') || !zumiGroup || isExecuting || sequenceRunning) { driveVel = 0; return; }
            if (pendingDriveReset) { placeAtOrigin(); pendingDriveReset = false; }

            let move = (keys.has('up') ? 1 : 0) - (keys.has('down') ? 1 : 0);
            let turn = (keys.has('left') ? 1 : 0) - (keys.has('right') ? 1 : 0);

            // AI 자율주행: 방향키를 누르면 사람이 다시 운전
            if (autopilot) {
                if (keys.size > 0) stopAutopilot('사람이 운전을 이어받았어요!');
                else { const o = autopilot(dt) || { move: 0, turn: 0 }; move = o.move; turn = o.turn; }
            }
            // 긴급제동 AI: 앞 센서가 가까우면 멈춤
            if (brakeAssist.on && move > 0 && frontMinDist < brakeAssist.thr) {
                if (!brakeAssist.active) { brakeAssist.active = true; brakeAssist.triggered++; showSpeech('🛑 긴급제동! 앞이 너무 가까워요.'); }
                move = 0;
                driveVel *= Math.max(0, 1 - dt * 20);
            } else brakeAssist.active = false;

            // 부드러운 가속/감속
            const targetVel = move * driveSpeedCm * CM_TO_UNITS;
            driveVel += (targetVel - driveVel) * Math.min(1, dt * 9);
            if (move === 0 && Math.abs(driveVel) < 0.02) driveVel = 0;

            let px = zumiGroup.position.x, pz = zumiGroup.position.z, yaw = zumiGroup.rotation.y;
            let dyaw = 0, travel = 0, blocked = false;

            if (turn !== 0) {
                const ny = yaw + turn * DRIVE_TURN_RATE * dt;
                if (!robotCollides(px, pz, ny)) { dyaw = ny - yaw; yaw = ny; }
                else blocked = true;
            }

            if (driveVel !== 0) {
                const dist = driveVel * dt;
                const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
                const nx = px + fx * dist, nz = pz + fz * dist;
                if (!robotCollides(nx, nz, yaw)) {
                    px = nx; pz = nz; travel = dist;
                } else if (!robotCollides(nx, pz, yaw)) {          // 벽을 따라 미끄러지기
                    travel = (nx - px) * fx; px = nx;
                } else if (!robotCollides(px, nz, yaw)) {
                    travel = (nz - pz) * fz; pz = nz;
                } else {
                    driveVel = 0;
                }
                if (Math.abs(travel) < Math.abs(dist) * 0.5) blocked = true;
            }

            zumiGroup.position.set(px, 0, pz);
            zumiGroup.rotation.y = yaw;
            wheelLeft.rotation.x += (-travel + dyaw * WHEEL_TRACK) / WHEEL_RADIUS;
            wheelRight.rotation.x += (-travel - dyaw * WHEEL_TRACK) / WHEEL_RADIUS;

            blockedNow = blocked && (move !== 0 || turn !== 0);
            if (typeof slamOdometry === 'function') slamOdometry(travel, dyaw);

            driveBusy = keys.size > 0 || driveVel !== 0 || !!autopilot;

            if (blocked && (move !== 0 || turn !== 0)) {
                const now = performance.now();
                if (now - lastBlockMsg > 1500) {
                    lastBlockMsg = now;
                    showSpeech('장애물이 있어서 지나갈 수 없어요! 🚧');
                }
            }
        }

        function initDriveControls() {
            window.addEventListener('keydown', (e) => {
                if (mode !== 'drive' && mode !== 'learn') return;
                if (!document.getElementById('landingModal').classList.contains('opacity-0')) return;
                if (e.target && (e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && (e.target.type === 'text' || e.target.type === 'number')))) return;
                const k = KEYMAP[e.code];
                if (!k) return;
                e.preventDefault();
                setKey(k, true);
            });
            window.addEventListener('keyup', (e) => {
                const k = KEYMAP[e.code];
                if (k) setKey(k, false);
            });
            window.addEventListener('blur', releaseAllKeys);

            document.querySelectorAll('[data-key]').forEach(btn => {
                const k = btn.dataset.key;
                btn.addEventListener('pointerdown', (e) => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (err) {} setKey(k, true); });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, () => setKey(k, false)));
            });

            document.querySelectorAll('[data-key]').forEach(b => b.addEventListener('contextmenu', (e) => e.preventDefault()));
            const slider = document.getElementById('driveSpeed');
            const label = document.getElementById('driveSpeedLabel');
            const applySpeed = (v) => {
                driveSpeedCm = parseInt(v, 10);
                slider.value = driveSpeedCm;
                label.textContent = `${driveSpeedCm} cm/s`;
            };
            slider.addEventListener('input', () => applySpeed(slider.value));
            document.querySelectorAll('[data-speed]').forEach(b => b.addEventListener('click', () => applySpeed(b.dataset.speed)));

            // ===== 가상 조이스틱 (터치 기기) =====
            const joy = document.getElementById('joystick'), knob = document.getElementById('joyKnob');
            if (joy) {
                let joyId = null;
                const cur = { up: false, down: false, left: false, right: false };
                const apply = (nx, ny) => {
                    const mag = Math.hypot(nx, ny);
                    const want = { up: false, down: false, left: false, right: false };
                    if (mag > 0.3) {
                        // 8방향: 기울어진 쪽 축만 켜고, 대각선이면 두 축 모두 켬
                        if (ny < -0.38) want.up = true;
                        if (ny > 0.38) want.down = true;

        function stopAutopilot(msg) {

        // ============================================================
        //  1) 센서 인식
        // ============================================================
        const SENSOR_ANGLES = [-60, -45, -30, -15, 0, 15, 30, 45, 60].map(d => d * Math.PI / 180);   // +가 왼쪽
        const SENSOR_MAX = 10;
        let sensorReadings = SENSOR_ANGLES.map(() => SENSOR_MAX);
        let sensorLines = null;
        let exploreTurnDir = 0, exploreBackT = 0, exploreStuck = 0, exploreTime = 0;

        function readFrontSensors() {
            const p = zumiGroup.position, yaw = zumiGroup.rotation.y;
            const ox = p.x - Math.sin(yaw) * 1.05, oz = p.z - Math.cos(yaw) * 1.05;
            for (let i = 0; i < SENSOR_ANGLES.length; i++) {
                const a = yaw + SENSOR_ANGLES[i];
                sensorReadings[i] = castRay(ox, oz, -Math.sin(a), -Math.cos(a), SENSOR_MAX).d;
            }
            frontMinDist = Math.min(sensorReadings[2], sensorReadings[3], sensorReadings[4], sensorReadings[5], sensorReadings[6]);
            return { ox, oz, yaw };
        }
        function ensureSensorLines() {
            if (sensorLines) return;
            const n = SENSOR_ANGLES.length;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
            geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 6), 3));
            sensorLines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors: true }));
            sensorLines.frustumCulled = false;
            sensorLines.visible = false;
            scene.add(sensorLines);
        }
        function updateSensorLines(o) {
            const pos = sensorLines.geometry.attributes.position, col = sensorLines.geometry.attributes.color;
            const thr = brakeAssist.thr;
            for (let i = 0; i < SENSOR_ANGLES.length; i++) {
                const a = o.yaw + SENSOR_ANGLES[i], d = sensorReadings[i];
                pos.setXYZ(i * 2, o.ox, 0.74, o.oz);
                pos.setXYZ(i * 2 + 1, o.ox - Math.sin(a) * d, 0.74, o.oz - Math.cos(a) * d);
                const c = d < thr ? [1, 0.2, 0.2] : d < thr * 2 ? [1, 0.85, 0.2] : [0.2, 1, 0.5];
                col.setXYZ(i * 2, c[0], c[1], c[2]); col.setXYZ(i * 2 + 1, c[0], c[1], c[2]);
            }
            pos.needsUpdate = true; col.needsUpdate = true;
        }
        function sensorSetThr(v) {
            brakeAssist.thr = parseInt(v, 10) * CM_TO_UNITS;
            const l = lg('sensorThrLabel'); if (l) l.textContent = `${v} cm`;
        }
        function sensorToggleBrake(on) {
            brakeAssist.on = on;
            showSpeech(on ? '🛑 긴급제동 AI 켜짐! 앞이 가까우면 스스로 멈춰요.' : '긴급제동 AI 꺼짐. 조심해서 운전하세요!');
        }
        function sensorToggleExplore(on) {
            if (on) { stopAutopilot(); autopilot = exploreAutopilot; showSpeech('🤖 자율 탐험 시작! 센서만 보고 스스로 운전해요. (방향키를 누르면 멈춰요)'); exploreTime = 0; }
            else stopAutopilot('자율 탐험을 멈췄어요.');
        }
        function exploreAutopilot(dt) {
            const r = sensorReadings, thr = Math.max(brakeAssist.thr, 3);
            const front = Math.min(r[2], r[3], r[4], r[5], r[6]);
            const speedK = Math.min(1, 40 / driveSpeedCm);
            if (blockedNow) exploreStuck += dt; else exploreStuck = Math.max(0, exploreStuck - dt);
            if (exploreBackT > 0) { exploreBackT -= dt; return { move: -0.6 * speedK, turn: exploreTurnDir || 1 }; }
            if (exploreStuck > 0.35) {
                exploreBackT = 0.7; exploreStuck = 0;
                if (!exploreTurnDir) exploreTurnDir = Math.random() < 0.5 ? 1 : -1;
                return { move: -0.6 * speedK, turn: exploreTurnDir };
            }
            const left = r[5] + r[6] + r[7] + r[8], right = r[0] + r[1] + r[2] + r[3];
            if (exploreTurnDir !== 0) {
                if (front > thr + 3) exploreTurnDir = 0;
                else return { move: 0.12 * speedK, turn: exploreTurnDir };
            }
            if (front < thr + 1.5) {
                exploreTurnDir = left >= right ? 1 : -1;
                return { move: 0.12 * speedK, turn: exploreTurnDir };
            }
            // 옆이 너무 가까우면 살짝 비켜가기
            let turn = 0;
            if (Math.min(r[0], r[1]) < thr) turn += 0.6;     // 오른쪽이 가까움 → 왼쪽으로
            if (Math.min(r[7], r[8]) < thr) turn -= 0.6;
            return { move: speedK, turn: lclamp(turn, -1, 1) };
        }
        function drawRadar() {
            const c = lg('sensorRadar'); if (!c) return;
            const g = c.getContext('2d'), W = c.width, H = c.height;
            g.clearRect(0, 0, W, H);
            const ox = W / 2, oy = H - 10, sc = (H - 22) / SENSOR_MAX;
            g.strokeStyle = 'rgba(148,163,184,0.18)'; g.lineWidth = 1;
            for (let r = 2; r <= SENSOR_MAX; r += 2) { g.beginPath(); g.arc(ox, oy, r * sc, Math.PI, 2 * Math.PI); g.stroke(); }
            const thr = brakeAssist.thr, half = 7.5 * Math.PI / 180;
            SENSOR_ANGLES.forEach((a, i) => {
                const d = sensorReadings[i];
                const col = d < thr ? '239,68,68' : d < thr * 2 ? '250,204,21' : '52,211,153';
                g.fillStyle = `rgba(${col},0.55)`; g.strokeStyle = `rgba(${col},1)`;
                g.beginPath(); g.moveTo(ox, oy);
                const a1 = -Math.PI / 2 - a - half, a2 = -Math.PI / 2 - a + half;
                g.arc(ox, oy, d * sc, a1, a2); g.closePath(); g.fill(); g.stroke();
            });
            g.setLineDash([4, 3]); g.strokeStyle = 'rgba(251,191,36,0.9)';
            g.beginPath(); g.arc(ox, oy, thr * sc, Math.PI, 2 * Math.PI); g.stroke(); g.setLineDash([]);
            g.fillStyle = '#38bdf8'; g.fillRect(ox - 8, oy - 4, 16, 12);
        }
        function sensorUi() {
            drawRadar();
            const t = lg('sensorFrontText');
            if (t) {
                const cm = Math.round(frontMinDist / CM_TO_UNITS);
                t.textContent = frontMinDist >= SENSOR_MAX - 0.01 ? '10m 이상 (멀어요)' : `${cm} cm`;
                t.className = 'font-black ' + (frontMinDist < brakeAssist.thr ? 'text-rose-400' : frontMinDist < brakeAssist.thr * 2 ? 'text-amber-300' : 'text-emerald-300');
            }
            const a = lg('sensorBrakeCnt'), b = lg('sensorColCnt');
            if (a) a.textContent = brakeAssist.triggered;
            if (b) b.textContent = learnCollisions;
        }
        function sensorTick(dt) {
            const o = readFrontSensors();
            updateSensorLines(o);
            if (Math.min(...sensorReadings) <= 4) completeMission('sensor', 'near');
            if (brakeAssist.triggered > 0) completeMission('sensor', 'brake');
            if (autopilot === exploreAutopilot) {
                if (blockedNow) exploreTime = 0; else exploreTime += dt;
                if (exploreTime >= 10) completeMission('sensor', 'explore');
            }
        }

        // ============================================================
        //  2) AI 비전 (물체 인식)
        // ============================================================
        const VIS = { thr: 0.5, truth: false, dets: [], seenWrong: false };
        const KIND = {
            tree: ['나무', '🌲'], bush: ['덤불', '🌿'], rock: ['바위', '🪨'], log: ['통나무', '🪵'], pond: ['연못', '💧'],
            lamp: ['가로등', '💡'], streettree: ['가로수', '🌳'], trafficlight: ['신호등', '🚦'], building: ['건물', '🏢']
        };
        const CONFUSE = { tree: 'bush', bush: 'rock', rock: 'bush', log: 'rock', lamp: 'trafficlight', trafficlight: 'lamp', streettree: 'bush' };
        const RES_FACTOR = { 32: 0.55, 64: 0.8, 128: 0.93, 0: 1 };

        function visSetRes(v, silent) {
            camRes = v;
            resizeZumiCam();
            document.querySelectorAll('[data-res]').forEach(b => {
                const on = parseInt(b.dataset.res, 10) === v;
                b.className = `py-1.5 rounded-lg border ${on ? 'bg-sky-500 text-white border-sky-300' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`;
            });
            if (!silent && v > 0 && v <= 64) completeMission('vision', 'res');
            if (!silent) showSpeech(v === 0 ? '원본 해상도예요.' : `AI의 눈이 ${v}×${Math.round(v / 1.6)} 픽셀로 거칠어졌어요! 확신도도 낮아져요.`);
        }
        function visSetThr(v) {
            VIS.thr = parseInt(v, 10) / 100;
            const l = lg('visThrLabel'); if (l) l.textContent = `${v}%`;
        }

        function visionUpdate() {
            if (!camOn || !camRenderer || !zumiCam) return;
            const cv = lg('camDetectCanvas'), holder = lg('zumiCamView');
            const W = holder.clientWidth, H = holder.clientHeight;
            if (!W || !H) return;
            if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
            const g = cv.getContext('2d');
            g.clearRect(0, 0, W, H);

            const camPos = new THREE.Vector3(); zumiCam.getWorldPosition(camPos);
            const mInv = zumiCam.matrixWorldInverse;
            const now = performance.now() / 1000;
            const resF = RES_FACTOR[camRes] !== undefined ? RES_FACTOR[camRes] : 1;
            const shown = [], hidden = [];
            const v = new THREE.Vector3(), cs = new THREE.Vector3();

            obstacles.forEach((o, id) => {
                if (o.det === false || !o.kind) return;
                const dxw = o.x - camPos.x, dzw = o.z - camPos.z, dist = Math.hypot(dxw, dzw);
                if (dist > 28 || dist < 0.5) return;
                const hx = o.type === 'b' ? o.hw : o.bw, hz = o.type === 'b' ? o.hd : o.bw, hgt = o.bh;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, ok = true;
                for (const sx of [-1, 1]) for (const sz of [-1, 1]) for (const yy of [0, hgt]) {
                    v.set(o.x + sx * hx, yy, o.z + sz * hz);
                    cs.copy(v).applyMatrix4(mInv);
                    if (cs.z > -0.25) { ok = false; }
                    v.project(zumiCam);
                    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x); minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
                }
                if (!ok) return;
                if (maxX < -1 || minX > 1 || maxY < -1 || minY > 1) return;
                const full = (maxX - minX) * (maxY - minY);
                const cx0 = Math.max(minX, -1), cx1 = Math.min(maxX, 1), cy0 = Math.max(minY, -1), cy1 = Math.min(maxY, 1);
                const clipFrac = full > 0 ? ((cx1 - cx0) * (cy1 - cy0)) / full : 0;
                if (clipFrac < 0.35) return;
                // 가려졌는지 확인
                const r = castRay(camPos.x, camPos.z, dxw / dist, dzw / dist, dist);
                if (r.o && r.o !== 'wall' && r.o !== o && r.d < dist - (hx + 0.6)) return;

                const hFrac = (maxY - minY) / 2, wFrac = (maxX - minX) / 2;
                const size = Math.max(hFrac, wFrac * 0.6);
                const cx = (minX + maxX) / 2;
                let conf = 0.30 + 0.62 * Math.pow(lclamp(size * 2.2, 0, 1), 0.6);
                conf -= 0.12 * cx * cx;
                conf += 0.05 * (lhash(id + Math.floor(now * 2.5)) * 2 - 1);
                conf *= resF * (0.6 + 0.4 * clipFrac);
                conf = lclamp(conf, 0.15, 0.99);
                let kind = o.kind, wrong = false;
                if (CONFUSE[o.kind] && lhash(id * 7.3) > 0.4 && conf < 0.66) { kind = CONFUSE[o.kind]; wrong = true; }
                const det = { id, kind, truth: o.kind, wrong, conf, dist,
                    x0: (cx0 + 1) / 2 * W, x1: (cx1 + 1) / 2 * W, y0: (1 - cy1) / 2 * H, y1: (1 - cy0) / 2 * H };
                (conf >= VIS.thr ? shown : hidden).push(det);
            });

            shown.sort((a, b) => b.conf - a.conf);
            const placed = [];
            shown.forEach(d => {
                const col = d.conf >= 0.8 ? '#4ade80' : d.conf >= 0.6 ? '#facc15' : '#fb923c';
                g.lineWidth = 2; g.strokeStyle = col;
                g.strokeRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
                let label = `${KIND[d.kind][1]} ${KIND[d.kind][0]} ${Math.round(d.conf * 100)}%`;
                if (VIS.truth) label += d.wrong ? ` ✗${KIND[d.truth][0]}` : ' ✓';
                g.font = 'bold 11px sans-serif';
                const tw = g.measureText(label).width + 8;
                const tx = lclamp(d.x0, 0, Math.max(0, W - tw));
                let ty = d.y0 > 18 ? d.y0 - 17 : d.y0 + 1;
                for (let k = 0; k < 8; k++) {
                    if (placed.some(r => tx < r.x + r.w && tx + tw > r.x && ty < r.y + 16 && ty + 16 > r.y)) ty += 17; else break;
                }
                placed.push({ x: tx, y: ty, w: tw });
                g.fillStyle = (VIS.truth && d.wrong) ? '#dc2626' : col;
                g.fillRect(tx, ty, tw, 16);
                g.fillStyle = (VIS.truth && d.wrong) ? '#fff' : '#0f172a';
                g.fillText(label, tx + 4, ty + 12);
            });
            VIS.dets = shown;
            VIS.hiddenCount = hidden.length;

            if (shown.some(d => d.conf >= 0.9 && !d.wrong)) completeMission('vision', 'conf');
            if (VIS.truth && shown.some(d => d.wrong)) completeMission('vision', 'wrong');
        }
        function visUi() {
            const l = lg('visList'); if (!l) return;
            const top = VIS.dets.slice(0, 6);
            l.innerHTML = top.length ? top.map(d => `<div class="flex justify-between"><span>${KIND[d.kind][1]} ${KIND[d.kind][0]}${VIS.truth && d.wrong ? ` <span class="text-rose-400">✗ ${KIND[d.truth][0]}</span>` : ''}</span><b class="${d.conf >= 0.8 ? 'text-emerald-300' : d.conf >= 0.6 ? 'text-amber-300' : 'text-orange-400'}">${Math.round(d.conf * 100)}%</b></div>`).join('') : '<span class="text-slate-500">카메라 앞으로 물체가 들어오면 알려줄게요.</span>';
            const h = lg('visHidden');
            if (h) h.textContent = VIS.hiddenCount ? `확신도가 낮아서 말하지 않은 물체: ${VIS.hiddenCount}개` : '';
        }

        // ============================================================
        //  3) 머신러닝 (데이터로 배우는 자율주행)
        // ============================================================
        const ML_ROWS = [1.8, 3.6, 5.4];          // 로봇 앞쪽 거리
        const ML_COLS = [3, 1.5, 0, -1.5, -3];    // 왼쪽(+) → 오른쪽(-)
        const ML_IN = 15, ML_H = 12, ML_OUT = 3;
        const ML = {
            rec: false, X: [], Y: [], counts: [0, 0, 0], aug: false,
            model: null, training: false, epoch: 0, maxEpoch: 50, losses: [], accs: [], bestAcc: 0,
            recT: 0, teacher: null, aiOn: false, aiTime: 0, aiLost: 0, aiBlocked: 0, lastF: new Array(15).fill(0),
            train: null, test: null, order: [], pos: 0, epochLoss: 0, epochN: 0, status: ''
        };
        let mlDots = null;

        function mlSamplePoints() {
            const p = zumiGroup.position, yaw = zumiGroup.rotation.y;
            const fx = -Math.sin(yaw), fz = -Math.cos(yaw), lx = -Math.cos(yaw), lz = Math.sin(yaw);
            const pts = [];
            for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) {
                pts.push({ x: p.x + fx * ML_ROWS[r] + lx * ML_COLS[c], z: p.z + fz * ML_ROWS[r] + lz * ML_COLS[c] });
            }
            return pts;
        }
        function mlFeatures() { return mlSamplePoints().map(q => isOnRoad(q.x, q.z, 0) ? 1 : 0); }
        function mlMirror(x) {
            const o = new Array(15);
            for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) o[r * 5 + c] = x[r * 5 + (4 - c)];
            return o;
        }
        function mlPush(f, label) {
            if (ML.X.length >= 3000) return;
            ML.X.push(f); ML.Y.push(label); ML.counts[label]++;
        }

        // ---- 아주 작은 신경망 (15 → 12 → 3) ----
        function mlNewModel() {
            const rnd = (s) => lgauss() * s;
            return {
                W1: Array.from({ length: ML_H }, () => Array.from({ length: ML_IN }, () => rnd(0.5))), b1: new Array(ML_H).fill(0),
                W2: Array.from({ length: ML_OUT }, () => Array.from({ length: ML_H }, () => rnd(0.5))), b2: new Array(ML_OUT).fill(0)
            };
        }
        function mlForward(m, x) {
            const h = new Array(ML_H);
            for (let j = 0; j < ML_H; j++) { let s = m.b1[j]; const w = m.W1[j]; for (let i = 0; i < ML_IN; i++) s += w[i] * x[i]; h[j] = Math.tanh(s); }
            const z = new Array(ML_OUT);
            let mx = -1e9;
            for (let k = 0; k < ML_OUT; k++) { let s = m.b2[k]; for (let j = 0; j < ML_H; j++) s += m.W2[k][j] * h[j]; z[k] = s; if (s > mx) mx = s; }
            let sum = 0; const p = z.map(v => { const e = Math.exp(v - mx); sum += e; return e; });
            return { h, p: p.map(v => v / sum) };
        }
        function mlStep(m, batch, lr) {
            const gW1 = Array.from({ length: ML_H }, () => new Array(ML_IN).fill(0)), gb1 = new Array(ML_H).fill(0);
            const gW2 = Array.from({ length: ML_OUT }, () => new Array(ML_H).fill(0)), gb2 = new Array(ML_OUT).fill(0);
            let loss = 0;
            for (const [x, y] of batch) {
                const { h, p } = mlForward(m, x);
                loss += -Math.log(p[y] + 1e-9);
                const dz2 = p.map((v, k) => v - (k === y ? 1 : 0));
                const dh = new Array(ML_H).fill(0);
                for (let k = 0; k < ML_OUT; k++) { gb2[k] += dz2[k]; for (let j = 0; j < ML_H; j++) { gW2[k][j] += dz2[k] * h[j]; dh[j] += m.W2[k][j] * dz2[k]; } }
                for (let j = 0; j < ML_H; j++) { const dz1 = dh[j] * (1 - h[j] * h[j]); gb1[j] += dz1; for (let i = 0; i < ML_IN; i++) gW1[j][i] += dz1 * x[i]; }
            }
            const s = lr / batch.length;
            for (let k = 0; k < ML_OUT; k++) { m.b2[k] -= s * gb2[k]; for (let j = 0; j < ML_H; j++) m.W2[k][j] -= s * gW2[k][j]; }
            for (let j = 0; j < ML_H; j++) { m.b1[j] -= s * gb1[j]; for (let i = 0; i < ML_IN; i++) m.W1[j][i] -= s * gW1[j][i]; }
            return loss / batch.length;
        }
        function mlShuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
        function mlBalancedAcc(m, set) {
            const ok = [0, 0, 0], tot = [0, 0, 0];
            for (const [x, y] of set) { tot[y]++; const p = mlForward(m, x).p; if (p.indexOf(Math.max(...p)) === y) ok[y]++; }
            const rs = tot.map((t, k) => t > 0 ? ok[k] / t : null).filter(v => v !== null);
            return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
        }

        function mlStartTraining() {
            if (ML.training) return;
            const n = ML.X.length;
            if (n < 30) { showSpeech('데이터가 너무 적어요! 30개 이상 모아 주세요.'); return false; }
            if (ML.counts.filter(c => c >= 5).length < 2) { showSpeech('한 가지 행동만 있어요! 좌회전·직진·우회전 데이터가 골고루 필요해요.'); return false; }
            stopAutopilot();
            ML.rec = false; mlRefreshButtons();
            const idx = mlShuffle(Array.from({ length: n }, (_, i) => i));
            const nTest = Math.max(6, Math.floor(n * 0.2));
            const test = idx.slice(0, nTest).map(i => [ML.X[i], ML.Y[i]]);
            let train = idx.slice(nTest).map(i => [ML.X[i], ML.Y[i]]);
            if (ML.aug) train = train.concat(train.map(([x, y]) => [mlMirror(x), 2 - y]));
            ML.train = train; ML.test = test;
            ML.model = mlNewModel();
            ML.training = true; ML.epoch = 0; ML.losses = []; ML.accs = []; ML.order = []; ML.pos = 0; ML.epochLoss = 0; ML.epochN = 0;
            ML.status = '학습 중... 🧠';
            return true;
        }
        function mlBuildEpoch() {
            const byClass = [[], [], []];
            ML.train.forEach(s => byClass[s[1]].push(s));
            const present = byClass.filter(c => c.length > 0);
            const target = Math.min(500, Math.max(...present.map(c => c.length)));
            const list = [];
            present.forEach(c => { for (let i = 0; i < target; i++) list.push(c[Math.floor(Math.random() * c.length)]); });
            ML.order = mlShuffle(list); ML.pos = 0; ML.epochLoss = 0; ML.epochN = 0;
        }
        function mlTrainTick(budgetMs) {
            const t0 = performance.now();
            while (ML.training && performance.now() - t0 < budgetMs) {
                if (ML.pos >= ML.order.length) {
                    if (ML.order.length > 0) {
                        ML.losses.push(ML.epochLoss / Math.max(1, ML.epochN));
                        ML.accs.push(mlBalancedAcc(ML.model, ML.test));
                        ML.epoch++;
                        ML.bestAcc = ML.accs[ML.accs.length - 1];
                        if (ML.epoch >= ML.maxEpoch) { mlFinishTraining(); break; }
                    }
                    mlBuildEpoch();
                }
                const batch = ML.order.slice(ML.pos, ML.pos + 16);
                ML.pos += 16;
                ML.epochLoss += mlStep(ML.model, batch, 0.25) * batch.length;
                ML.epochN += batch.length;
            }
        }
        function mlFinishTraining() {
            ML.training = false;
            const acc = ML.accs[ML.accs.length - 1] || 0;
            ML.status = `학습 끝! 정확도 ${Math.round(acc * 100)}% 🎉`;
            if (acc >= 0.5) completeMission('ml', 'train');
            else showSpeech('정확도가 아직 낮아요. 데이터를 더 다양하게 모으고 다시 학습해 보세요!');
            mlRefreshButtons();
        }

        // 학습 맵에서는 시작할 때 로봇이 길 방향을 바라보게 맞춰요
        function mlAlignToRoad() {
            if (!forestRoad || !zumiGroup) return;
            const pts = forestRoad.pts, n = pts.length - 1;
            if (!forestRoad.len) { let L = 0; for (let i = 0; i < n; i++) L += Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].z - pts[i].z); forestRoad.len = L; }
            const look = Math.max(3, Math.round(5.5 / (forestRoad.len / n)));
            const t = pts[look % n], p = zumiGroup.position;
            zumiGroup.rotation.y = Math.atan2(-(t.x - p.x), -(t.z - p.z));
        }

        // ---- 선생님(전문가) 시범 주행 ----
        function mlExpert() {
            if (!forestRoad) return null;
            const pts = forestRoad.pts, n = pts.length - 1;
            if (!forestRoad.len) { let L = 0; for (let i = 0; i < n; i++) L += Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].z - pts[i].z); forestRoad.len = L; }
            const p = zumiGroup.position;
            let bi = 0, bd = 1e12;
            for (let i = 0; i < n; i++) { const d = (pts[i].x - p.x) ** 2 + (pts[i].z - p.z) ** 2; if (d < bd) { bd = d; bi = i; } }
            const look = Math.max(3, Math.round(5.5 / (forestRoad.len / n)));
            const t = pts[(bi + look) % n];
            const yaw = zumiGroup.rotation.y;
            const fx = -Math.sin(yaw), fz = -Math.cos(yaw), lx = -Math.cos(yaw), lz = Math.sin(yaw);
            const dx = t.x - p.x, dz = t.z - p.z;
            const err = Math.atan2(dx * lx + dz * lz, dx * fx + dz * fz);
            return { err, turn: lclamp(err * 2.2, -1, 1) };
        }
        function mlTeacherPolicy(dt) {
            const T = ML.teacher;
            if (!T) return { move: 0, turn: 0 };
            const ex = mlExpert();
            if (!ex) { stopAutopilot('숲 맵의 흙길에서만 시범 주행을 할 수 있어요.'); return { move: 0, turn: 0 }; }
            T.t += dt; T.rec += dt;
            if (T.rec >= 1 / 12) {
                T.rec = 0;
                mlPush(mlFeatures(), ex.err > 0.1 ? 0 : ex.err < -0.1 ? 2 : 1);
            }
            // 가끔 일부러 삐끗해서 → 바로잡는 법도 배우게 함
            if (T.pert > 0) T.pert -= dt;
            else { T.next -= dt; if (T.next <= 0) { T.pert = 0.35 + Math.random() * 0.3; T.dir = Math.random() < 0.5 ? -1 : 1; T.next = 2 + Math.random() * 2.5; } }
            if (blockedNow) T.stuck += dt; else T.stuck = 0;
            if (T.t > 45 || T.stuck > 1) { stopAutopilot(T.t > 45 ? '🧑‍🏫 시범 주행 끝! 데이터가 모였어요.' : '시범 주행이 막혔어요.'); return { move: 0, turn: 0 }; }
            return { move: Math.min(1, 40 / driveSpeedCm), turn: T.pert > 0 ? T.dir : ex.turn };
        }
        function mlAIPolicy(dt) {
            if (!ML.model) return { move: 0, turn: 0 };
            const p = mlForward(ML.model, mlFeatures()).p;
            const turn = lclamp((p[0] - p[2]) * 1.8, -1, 1);
            const pos = zumiGroup.position;
            if (isOnRoad(pos.x, pos.z, 0.4)) { ML.aiTime += dt; ML.aiLost = 0; }
            else { ML.aiLost += dt; }
            if (blockedNow) ML.aiBlocked += dt; else ML.aiBlocked = 0;
            if (ML.aiLost > 1.2) { stopAutopilot('앗! AI가 길을 벗어났어요 😵 데이터를 더 모으거나 다르게 모아 보세요.'); return { move: 0, turn: 0 }; }
            if (ML.aiBlocked > 0.8) { stopAutopilot('AI가 장애물에 막혔어요.'); return { move: 0, turn: 0 }; }
            return { move: Math.min(1, 40 / driveSpeedCm), turn };
        }

        function mlToggleRec() {
            if (autopilot) stopAutopilot();
            ML.rec = !ML.rec;
            showSpeech(ML.rec ? '● 수집 시작! 방향키로 길을 따라 운전하세요. (좌·우 회전도 골고루!)' : '수집을 멈췄어요.');
            mlRefreshButtons();
        }
        function mlToggleTeacher() {
            if (ML.teacher) { stopAutopilot('시범 주행을 멈췄어요.'); return; }
            if (!forestRoad) { showSpeech('숲 맵의 흙길에서만 시범 주행을 할 수 있어요.'); return; }
            stopAutopilot(); ML.rec = false;
            ML.teacher = { t: 0, rec: 0, pert: 0, dir: 1, next: 2, stuck: 0 };
            autopilot = mlTeacherPolicy;
            showSpeech('🧑‍🏫 선생님이 시범 운전을 하며 데이터를 모아요! (약 45초, 방향키를 누르면 멈춰요)');
            mlRefreshButtons();
        }
        function mlClear() {
            ML.X = []; ML.Y = []; ML.counts = [0, 0, 0]; ML.model = null; ML.losses = []; ML.accs = []; ML.status = '데이터를 모두 지웠어요.';
            mlRefreshButtons(); mlRenderLoss(); mlUpdateUI();
        }
        function mlToggleAI() {
            if (!ML.model || ML.training) { showSpeech('먼저 AI를 학습시켜 주세요!'); return; }
            if (ML.aiOn) { stopAutopilot('AI 자율주행을 멈췄어요.'); return; }
            stopAutopilot(); ML.rec = false;
            ML.aiOn = true; ML.aiTime = 0; ML.aiLost = 0; ML.aiBlocked = 0;
            autopilot = mlAIPolicy;
            showSpeech('🚗 AI 자율주행 시작! 배운 대로 길을 따라가 볼까요?');
            mlRefreshButtons();
        }
        function mlRefreshButtons() {
            const r = lg('mlBtnRec'), t = lg('mlBtnTeacher'), a = lg('mlBtnAI'), tr = lg('mlBtnTrain');
            if (r) r.textContent = ML.rec ? '■ 수집 멈추기' : '● 내가 운전하며 수집';
            if (t) t.textContent = ML.teacher ? '■ 시범 멈추기' : '🧑‍🏫 선생님 시범 수집';
            if (tr) tr.textContent = ML.training ? '학습 중... 🧠' : '🧠 AI 학습시키기';
            if (a) {
                const ready = !!ML.model && !ML.training;
                a.textContent = ML.aiOn ? '■ AI 자율주행 멈추기' : (ready ? '🚗 AI 자율주행 시작' : '🚗 AI 자율주행 시작 (학습 후)');
                a.className = `w-full py-2 rounded-lg text-xs font-black border ${ready ? 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-300' : 'bg-emerald-600/40 text-emerald-100/60 border-emerald-500/30'}`;
            }
        }
        function ensureMlDots() {
            if (mlDots) return;
            const geo = new THREE.CircleGeometry(0.28, 14); geo.rotateX(-Math.PI / 2);
            mlDots = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 }), 15);
            mlDots.frustumCulled = false; mlDots.visible = false;
            mlDots.setColorAt(0, new THREE.Color(0x22c55e));
            scene.add(mlDots);
        }
        function mlUpdateDots(pts, f) {
            const d = new THREE.Object3D(), on = new THREE.Color(0x22c55e), off = new THREE.Color(0xef4444);
            pts.forEach((q, i) => { d.position.set(q.x, 0.08, q.z); d.updateMatrix(); mlDots.setMatrixAt(i, d.matrix); mlDots.setColorAt(i, f[i] ? on : off); });
            mlDots.instanceMatrix.needsUpdate = true; mlDots.instanceColor.needsUpdate = true;
        }
        function mlRenderLoss() {
            const c = lg('mlLoss'); if (!c) return;
            const g = c.getContext('2d'), W = c.width, H = c.height;
            g.clearRect(0, 0, W, H);
            g.strokeStyle = 'rgba(148,163,184,0.2)'; g.lineWidth = 1;
            for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(0, H * i / 4); g.lineTo(W, H * i / 4); g.stroke(); }
            const plot = (arr, max, col) => {
                if (arr.length < 2) return;
                g.strokeStyle = col; g.lineWidth = 2; g.beginPath();
                arr.forEach((v, i) => { const x = i / (ML.maxEpoch - 1) * W, y = H - 4 - lclamp(v / max, 0, 1) * (H - 8); i ? g.lineTo(x, y) : g.moveTo(x, y); });
                g.stroke();
            };
            plot(ML.losses, Math.max(1.2, ...ML.losses), '#f472b6');
            plot(ML.accs, 1, '#34d399');
            g.font = '10px sans-serif'; g.fillStyle = '#f472b6'; g.fillText('손실(틀린 정도) ↓', 6, 12);
            g.fillStyle = '#34d399'; g.fillText('정확도 ↑', W - 54, 12);
        }
        function mlUpdateUI() {
            const cells = lg('mlGrid');
            if (cells) {
                const f = ML.lastF;
                for (let r = 2; r >= 0; r--) for (let c = 0; c < 5; c++) {
                    const el = cells.children[(2 - r) * 5 + c];
                    if (el) el.className = `w-5 h-5 rounded-sm ${f[r * 5 + c] ? 'bg-emerald-500' : 'bg-rose-600'}`;
                }
            }
            const tot = ML.X.length, mx = Math.max(1, ...ML.counts);
            const t = lg('mlTotal'); if (t) t.textContent = tot;
            [['mlBarL', 0], ['mlBarS', 1], ['mlBarR', 2]].forEach(([id, k]) => {
                const b = lg(id), n = lg(id + 'n');
                if (b) b.style.width = (ML.counts[k] / mx * 100) + '%';
                if (n) n.textContent = ML.counts[k];
            });
            const s = lg('mlStatus');
            if (s) {
                if (ML.training) s.textContent = `학습 중... ${ML.epoch}/${ML.maxEpoch} 번째 · 손실 ${(ML.losses[ML.losses.length - 1] || 0).toFixed(3)} · 정확도 ${Math.round((ML.accs[ML.accs.length - 1] || 0) * 100)}%`;
                else if (ML.aiOn) s.textContent = `🚗 자율주행 중 · 길 위에서 ${ML.aiTime.toFixed(0)}초`;
                else if (ML.teacher) s.textContent = `🧑‍🏫 시범 주행 중 · ${ML.teacher.t.toFixed(0)}초`;
                else if (ML.rec) s.textContent = '● 데이터 수집 중... 길을 따라 운전해 보세요!';
                else s.textContent = ML.status || '데이터를 모은 뒤 학습시켜 보세요.';
            }
            mlRenderLoss();
        }
        function mlTick(dt) {
            const pts = mlSamplePoints(), f = pts.map(q => isOnRoad(q.x, q.z, 0) ? 1 : 0);
            ML.lastF = f;
            if (mlDots) mlUpdateDots(pts, f);

            if (ML.rec && !autopilot && Math.abs(driveVel) > 0.6) {
                ML.recT += dt;
                if (ML.recT >= 1 / 12) {
                    ML.recT = 0;
                    const l = keys.has('left'), r = keys.has('right');
                    mlPush(f, l && !r ? 0 : r && !l ? 2 : 1);
                }
            }
            if (ML.training) { mlTrainTick(7); if (!ML.training) { mlRefreshButtons(); } }
            if (ML.X.length >= 100) completeMission('ml', 'data');
            if (ML.aiOn && ML.aiTime >= 25) completeMission('ml', 'drive');
        }

        // ============================================================
        //  4) SLAM (지도 만들기 + 내 위치 찾기)
        // ============================================================
        const SLAM = {
            cell: 0.5, n: 188, lo: null, est: { x: 0, z: 0, yaw: 0 }, drift: true, match: true, active: false,
            rays: 72, maxR: 14, ranges: [], hits: [], trailT: [], trailE: [], trailTimer: 0, scanT: 0,
            travel: 0, total: 0, err: 0, areaPct: 0, occCount: 0, drawT: 0, off: null
        };
        let lidarPoints = null;

        function slamReset() {
            SLAM.lo = new Float32Array(SLAM.n * SLAM.n);
            const p = zumiGroup ? zumiGroup.position : { x: 0, z: 0 }, yaw = zumiGroup ? zumiGroup.rotation.y : 0;
            SLAM.est = { x: p.x, z: p.z, yaw };
            SLAM.trailT = []; SLAM.trailE = []; SLAM.travel = 0; SLAM.occCount = 0; SLAM.areaPct = 0; SLAM.err = 0;
        }
        function slamClearMap() { slamReset(); showSpeech('지도를 지웠어요. 처음부터 다시 그려 볼까요?'); }

        // 바퀴 센서(오도메트리)로 추정한 위치 갱신 — 오차를 켜면 점점 틀어져요
        function slamOdometry(travel, dyaw) {
            if (!SLAM.active || !SLAM.lo) return;
            let dy = dyaw, dl = travel;
            if (SLAM.drift) {
                dy = dyaw * 1.05 + travel * 0.008 + lgauss() * 0.003 * Math.sqrt(Math.abs(travel) + 1e-4);
                dl = travel * 1.02;
            }
            const e = SLAM.est;
            e.yaw += dy;
            e.x += -Math.sin(e.yaw) * dl;
            e.z += -Math.cos(e.yaw) * dl;
            SLAM.travel += Math.abs(travel);
            SLAM.total += Math.abs(travel);
        }
        const slamCellIdx = (x, z) => {
            const ix = Math.floor((x + 47) / SLAM.cell), iz = Math.floor((z + 47) / SLAM.cell);
            return (ix < 0 || iz < 0 || ix >= SLAM.n || iz >= SLAM.n) ? -1 : iz * SLAM.n + ix;
        };
        function slamScore(cx, cz, cyaw) {
            let s = 0;
            const dA = 2 * Math.PI / SLAM.rays, n = SLAM.n, lo = SLAM.lo;
            for (let i = 0; i < SLAM.rays; i++) {
                if (!SLAM.hits[i]) continue;
                const a = cyaw + i * dA;
                const idx = slamCellIdx(cx - Math.sin(a) * SLAM.ranges[i], cz - Math.cos(a) * SLAM.ranges[i]);
                if (idx < 0) continue;
                let v = lo[idx] * 0.6, nb = 0;
                if (idx % n > 0) nb += lo[idx - 1];
                if (idx % n < n - 1) nb += lo[idx + 1];
                if (idx >= n) nb += lo[idx - n];
                if (idx < n * (n - 1)) nb += lo[idx + n];
                s += lclamp(v + nb * 0.1, -1, 2);
            }
            return s;
        }
        function slamScan() {
            const p = zumiGroup.position, yaw = zumiGroup.rotation.y;
            const R = SLAM.rays, dA = 2 * Math.PI / R;
            let nHit = 0;
            for (let i = 0; i < R; i++) {
                const a = yaw + i * dA;
                const r = castRay(p.x, p.z, -Math.sin(a), -Math.cos(a), SLAM.maxR);
                const hit = r.d < SLAM.maxR - 0.01;
                SLAM.hits[i] = hit;
                SLAM.ranges[i] = hit ? Math.max(0.1, r.d + lgauss() * 0.04) : SLAM.maxR;
                if (hit) nHit++;
            }
            // 3D 라이다 점
            if (lidarPoints) {
                const pos = lidarPoints.geometry.attributes.position;
                for (let i = 0; i < R; i++) {
                    const a = yaw + i * dA, d = SLAM.hits[i] ? SLAM.ranges[i] : 0;
                    pos.setXYZ(i, p.x - Math.sin(a) * d, SLAM.hits[i] ? 0.75 : -50, p.z - Math.cos(a) * d);
                }
                pos.needsUpdate = true;
            }
            const e = SLAM.est;
            // 스캔 매칭: 새 스캔을 지금까지 그린 지도에 가장 잘 맞는 위치를 찾아 보정
            if (SLAM.match && SLAM.occCount >= 30 && nHit >= 10) {
                const search = (cx, cz, cy, sx, sy) => {
                    let best = { dx: 0, dz: 0, dy: 0 }, bestS = -1e9;
                    for (let iy = -2; iy <= 2; iy++) for (let ix = -2; ix <= 2; ix++) for (let iz = -2; iz <= 2; iz++) {
                        const dx = ix * sx, dz = iz * sx, dy = iy * sy;
                        const s = slamScore(cx + dx, cz + dz, cy + dy) - 0.15 * (Math.abs(dx) + Math.abs(dz)) - 1.5 * Math.abs(dy);
                        if (s > bestS) { bestS = s; best = { dx, dz, dy }; }
                    }
                    return best;
                };
                const b1 = search(e.x, e.z, e.yaw, 0.15, 0.02);                              // 거칠게
                const b2 = search(e.x + b1.dx, e.z + b1.dz, e.yaw + b1.dy, 0.05, 0.007);   // 정밀하게
                e.x += b1.dx + b2.dx; e.z += b1.dz + b2.dz; e.yaw += b1.dy + b2.dy;
            }
            // 지도 갱신 (추정 위치 기준!)
            for (let i = 0; i < R; i++) {
                const a = e.yaw + i * dA, dx = -Math.sin(a), dz = -Math.cos(a), rg = SLAM.ranges[i];
                for (let d = 0; d < rg - 0.6; d += 0.25) {
                    const idx = slamCellIdx(e.x + dx * d, e.z + dz * d);
                    if (idx >= 0) {
                        const old = SLAM.lo[idx];
                        SLAM.lo[idx] = Math.max(-4, old - 0.25);
                        if (old > 0.6 && SLAM.lo[idx] <= 0.6) SLAM.occCount--;
                    }
                }
                if (SLAM.hits[i]) {
                    const idx = slamCellIdx(e.x + dx * rg, e.z + dz * rg);
                    if (idx >= 0) {
                        const old = SLAM.lo[idx];
                        SLAM.lo[idx] = Math.min(4, old + 0.9);
                        if (old <= 0.6 && SLAM.lo[idx] > 0.6) SLAM.occCount++;
                    }
                }
            }
        }
        function slamTick(dt) {
            SLAM.scanT += dt;
            if (SLAM.scanT >= 0.1) { SLAM.scanT = 0; slamScan(); }
            const p = zumiGroup.position, e = SLAM.est;
            SLAM.err = Math.hypot(e.x - p.x, e.z - p.z);
            SLAM.trailTimer += dt;
            if (SLAM.trailTimer > 0.2) {
                SLAM.trailTimer = 0;
                SLAM.trailT.push([p.x, p.z]); SLAM.trailE.push([e.x, e.z]);
                if (SLAM.trailT.length > 500) { SLAM.trailT.shift(); SLAM.trailE.shift(); }
            }
            const errCm = SLAM.err / CM_TO_UNITS;
            if (SLAM.areaPct >= 10) completeMission('slam', 'area');
            if (SLAM.total / CM_TO_UNITS >= 500) completeMission('slam', 'dist');
            if (SLAM.drift && SLAM.match && SLAM.travel / CM_TO_UNITS >= 200 && errCm <= 15) completeMission('slam', 'fix');
        }
        function ensureLidarPoints() {
            if (lidarPoints) return;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SLAM.rays * 3).fill(-50), 3));
            lidarPoints = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xff4d6d, size: 0.14 }));
            lidarPoints.frustumCulled = false; lidarPoints.visible = false;
            scene.add(lidarPoints);
        }
        function slamDraw() {
            const c = lg('slamCanvas'); if (!c || !SLAM.lo) return;
            const n = SLAM.n;
            if (!SLAM.off) { SLAM.off = document.createElement('canvas'); SLAM.off.width = SLAM.off.height = n; }
            const og = SLAM.off.getContext('2d'), img = og.createImageData(n, n);
            let known = 0, occ = 0;
            for (let i = 0; i < n * n; i++) {
                const v = SLAM.lo[i], o = i * 4;
                let r = 15, g = 23, b = 42;
                if (v > 0.6) { r = 165; g = 243; b = 252; occ++; known++; }
                else if (v < -0.3) { r = 30; g = 64; b = 110; known++; }
                img.data[o] = r; img.data[o + 1] = g; img.data[o + 2] = b; img.data[o + 3] = 255;
            }
            SLAM.areaPct = known / (n * n) * 100;
            og.putImageData(img, 0, 0);
            const g = c.getContext('2d'), W = c.width, S = W / 94;
            g.imageSmoothingEnabled = false;
            g.drawImage(SLAM.off, 0, 0, W, W);
            const X = (x) => (x + 47) * S, Z = (z) => (z + 47) * S;
            const trail = (arr, col) => { if (arr.length < 2) return; g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath(); arr.forEach((q, i) => i ? g.lineTo(X(q[0]), Z(q[1])) : g.moveTo(X(q[0]), Z(q[1]))); g.stroke(); };
            trail(SLAM.trailT, 'rgba(56,189,248,0.9)');
            trail(SLAM.trailE, 'rgba(251,113,133,0.9)');
            const p = zumiGroup.position, yaw = zumiGroup.rotation.y, e = SLAM.est;
            g.fillStyle = '#38bdf8'; g.beginPath(); g.arc(X(p.x), Z(p.z), 4, 0, 7); g.fill();
            g.strokeStyle = '#38bdf8'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(p.x), Z(p.z)); g.lineTo(X(p.x - Math.sin(yaw) * 2.5), Z(p.z - Math.cos(yaw) * 2.5)); g.stroke();
            g.fillStyle = '#fb7185'; g.beginPath(); g.arc(X(e.x), Z(e.z), 4, 0, 7); g.fill();
            g.strokeStyle = '#fb7185'; g.beginPath(); g.moveTo(X(e.x), Z(e.z)); g.lineTo(X(e.x - Math.sin(e.yaw) * 2.5), Z(e.z - Math.cos(e.yaw) * 2.5)); g.stroke();
        }
        function slamUi() {
            slamDraw();
            const a = lg('slamErr'), b = lg('slamArea'), d = lg('slamDist');
            const errCm = SLAM.err / CM_TO_UNITS;
            if (a) { a.textContent = `${Math.round(errCm)}cm`; a.className = 'text-base font-black ' + (errCm < 15 ? 'text-emerald-300' : errCm < 40 ? 'text-amber-300' : 'text-rose-300'); }
            if (b) b.textContent = `${SLAM.areaPct.toFixed(0)}%`;
            if (d) d.textContent = `${Math.round(SLAM.travel / CM_TO_UNITS)}cm`;
        }

        // ============================================================
        //  학습 모드 메인 루프
        // ============================================================
        function learnUpdate(dt) {
            if (mode !== 'learn' || !learnModule || !zumiGroup) return;
            if (blockedNow && !prevBlocked) learnCollisions++;
            prevBlocked = blockedNow;

            if (autopilot === exploreAutopilot && learnModule !== 'sensor') readFrontSensors();
            if (learnModule === 'sensor') sensorTick(dt);
            else if (learnModule === 'ml') mlTick(dt);
            else if (learnModule === 'slam') slamTick(dt);

            learnUiT += dt;
            const period = learnModule === 'slam' ? 0.2 : 0.12;
            if (learnUiT >= period) {
                learnUiT = 0;
                if (learnModule === 'sensor') sensorUi();
                else if (learnModule === 'vision') visUi();
                else if (learnModule === 'ml') mlUpdateUI();
                else if (learnModule === 'slam') slamUi();
            }
        }


        // ===== 주미 AI 카메라 (PiP) =====
        let zumiCam = null, camRenderer = null, camOn = true;

        function initZumiCam() {
            const holder = document.getElementById('zumiCamView');
            camRenderer = new THREE.WebGLRenderer({ antialias: true });
            camRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
            camRenderer.domElement.style.cssText = 'display:block;width:100%;height:100%';
            holder.appendChild(camRenderer.domElement);
            resizeZumiCam();
        }

        function resizeZumiCam() {
            if (!camRenderer) return;
            const holder = document.getElementById('zumiCamView');
            const w = holder.clientWidth, h = holder.clientHeight;
            if (!w || !h) return;
            if (camRes > 0) {
                camRenderer.setPixelRatio(1);
                camRenderer.setSize(camRes, Math.max(1, Math.round(camRes * h / w)), false);
                camRenderer.domElement.style.imageRendering = 'pixelated';
            } else {
                camRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
                camRenderer.setSize(w, h, false);
                camRenderer.domElement.style.imageRendering = 'auto';
            }
            zumiCam.aspect = w / h;
            zumiCam.updateProjectionMatrix();
        }

        function toggleZumiCam() {
            camOn = !camOn;
            setTimeout(() => { if (typeof onWindowResize === 'function' && renderer) onWindowResize(); }, 0);
            document.getElementById('zumiCamPanel').classList.toggle('hidden', !camOn);
            const btn = document.getElementById('btn-cam');
            const label = document.getElementById('btn-cam-label');
            if (camOn) {
                btn.className = 'px-3 py-1.5 rounded-xl bg-sky-600/80 hover:bg-sky-500 text-sky-50 transition font-bold text-xs flex items-center gap-1.5 border border-sky-400/60';
                label.textContent = '주미 카메라 ON';
                resizeZumiCam();
            } else {
                btn.className = 'px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 transition font-bold text-xs flex items-center gap-1.5 border border-slate-600';
                label.textContent = '주미 카메라 OFF';
            }
        }

        function showCamCard(cardInfo) {
            document.getElementById('camCardTitle').textContent = cardInfo.title;
            document.getElementById('camCardIcon').innerHTML = `<i class="fa-solid ${cardInfo.icon}"></i>`;
            document.getElementById('camCardBody').className = `w-20 h-28 rounded-xl border-2 border-white shadow-xl flex flex-col items-center justify-between p-2 text-white bg-gradient-to-b ${cardInfo.color}`;
            const p = document.getElementById('camCardPreview');
            p.classList.remove('opacity-0', 'scale-75');
            p.classList.add('opacity-100', 'scale-100');
        }
        function hideCamCard() {
            const p = document.getElementById('camCardPreview');
            p.classList.add('opacity-0', 'scale-75');
            p.classList.remove('opacity-100', 'scale-100');
        }
        function camFlash() {
            const f = document.getElementById('zumiCamFlash');
            f.classList.remove('opacity-0'); f.classList.add('opacity-80');
            setTimeout(() => { f.classList.remove('opacity-80'); f.classList.add('opacity-0'); }, 130);
        }

        function animate() {
            requestAnimationFrame(animate);

            const nowT = performance.now();
            const dt = Math.min((nowT - lastFrameTime) / 1000, 0.05);
            lastFrameTime = nowT;
            updateDrive(dt);
            learnUpdate(dt);

            if (zumiGroup) {
                // 로봇이 움직인 만큼 카메라도 같이 이동
                const dx = zumiGroup.position.x - lastFollowX;
                const dz = zumiGroup.position.z - lastFollowZ;
                if (dx !== 0 || dz !== 0) {
                    camera.position.x += dx;
                    camera.position.z += dz;
                    controls.target.x += dx;
                    controls.target.z += dz;
                    lastFollowX = zumiGroup.position.x;
                    lastFollowZ = zumiGroup.position.z;
                }
                // 하늘 / 태양(그림자)도 로봇을 따라다님
                if (skyDome) skyDome.position.set(zumiGroup.position.x, 0, zumiGroup.position.z);
                if (sunLight) {
                    sunLight.position.set(zumiGroup.position.x + 10, 20, zumiGroup.position.z + 15);
                    sunLight.target.position.set(zumiGroup.position.x, 0, zumiGroup.position.z);
                }
            }
            if (cloudsGroup) cloudsGroup.rotation.y += dt * 0.004;

            controls.update();

            if (!isExecuting && !driveBusy && zumiGroup) {
                zumiGroup.position.y = Math.sin(Date.now() * 0.004) * 0.012;
            }

            // 눈 깜빡임
            if (currentEyeState === 'normal' && nowT > nextBlinkAt) {
                updateEyeDisplay('blink');
                setTimeout(() => { if (currentEyeState === 'blink') updateEyeDisplay('normal'); }, 130);
                nextBlinkAt = nowT + 2500 + Math.random() * 2500;
            }

            renderer.render(scene, camera);

            // 주미 AI 카메라 화면
            if (camOn && camRenderer && zumiCam) {
                camRenderer.render(scene, zumiCam);
                if (mode === 'learn' && learnModule === 'vision') visionUpdate();
            }
        }

        window.onload = () => {
            initThree();
            initDriveControls();
        };
    </script>
</body>

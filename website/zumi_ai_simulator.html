    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        let mode = 'lab';
        let currentTheme = 'default';
        let commandQueue = [];
        let isExecuting = false;
        let sequenceRunning = false;
        let currentEyeState = 'normal';
        let nextBlinkAt = 0;
        let lastFollowX = 0, lastFollowZ = 0;
        let pendingCommandType = null;

        // ThreeJS Globals
        let scene, camera, renderer, controls;
        let zumiGroup, wheelLeft, wheelRight, eyeCanvas, eyeTexture, eyeContext;
        let gridHelper, groundMesh;
        let envObjectsGroup = new THREE.Group();

        // 1cm = 0.2 units
        const CM_TO_UNITS = 0.2; 
        const WHEEL_RADIUS = 0.4;
        const WHEEL_TRACK = 0.84; // 바퀴 중심의 좌우 거리

        const CARD_META = {
            run: { id: 1, title: '실행하기', color: 'from-emerald-500 to-green-600', icon: 'fa-play' },
            forward: { id: 2, title: '전진하기', color: 'from-pink-500 to-rose-600', icon: 'fa-arrow-up', defaultVal: 10, unit: 'cm', label: '몇 cm 전진하시겠습니까?' },
            backward: { id: 3, title: '후진하기', color: 'from-sky-400 to-blue-600', icon: 'fa-arrow-down', defaultVal: 10, unit: 'cm', label: '몇 cm 후진하시겠습니까?' },
            turnLeft: { id: 4, title: '왼쪽 회전', color: 'from-indigo-600 to-slate-800', icon: 'fa-rotate-left', defaultVal: 90, unit: '도', label: '몇 도 좌회전하시겠습니까?' },
            turnRight: { id: 5, title: '오른쪽 회전', color: 'from-teal-500 to-emerald-700', icon: 'fa-rotate-right', defaultVal: 90, unit: '도', label: '몇 도 우회전하시겠습니까?' },
            wait: { id: 6, title: '기다리기', color: 'from-amber-500 to-orange-600', icon: 'fa-hourglass-half', defaultVal: 1, unit: '초', label: '몇 초 동안 기다리시겠습니까?' },
            delete: { id: 7, title: '삭제하기', color: 'from-purple-600 to-indigo-800', icon: 'fa-trash-can' }
        };

        // --- 1. THREE.JS SCENE SETUP ---
        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1d);
            scene.fog = new THREE.FogExp2(0x0a0f1d, 0.012);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(1.2, 5.2, -8.3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, window.matchMedia('(max-width: 767px)').matches ? 1.5 : 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(0, 0.75, 0);
            controls.update();

            const ambient = new THREE.AmbientLight(0xffffff, 0.42);
            scene.add(ambient);
            const hemi = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 0.4);
            scene.add(hemi);
            const fill = new THREE.DirectionalLight(0xbfdbfe, 0.3);
            fill.position.set(-8, 6, -12);
            scene.add(fill);

            const sun = new THREE.DirectionalLight(0xffffff, 0.9);
            sun.position.set(10, 20, 15);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            sun.shadow.bias = -0.0002;
            sun.shadow.camera.left = -24; sun.shadow.camera.right = 24;
            sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24;
            sun.shadow.camera.near = 1; sun.shadow.camera.far = 90;
            sun.shadow.camera.updateProjectionMatrix();
            scene.add(sun);
            scene.add(sun.target);
            sunLight = sun;

            scene.add(envObjectsGroup);

            createGround();

            zumiGroup = createDetailedZumiRobot();
            scene.add(zumiGroup);
            createSkyDome();
            initZumiCam();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('orientationchange', () => setTimeout(onWindowResize, 250));
            if (window.ResizeObserver) new ResizeObserver(() => onWindowResize()).observe(document.getElementById('canvas-container'));
            animate();
        }

        function createGround() {
            const groundGeo = new THREE.PlaneGeometry(600, 600);
            const groundMat = new THREE.MeshStandardMaterial({ 
                color: 0x111827, 
                roughness: 0.8, 
                metalness: 0.2 
            });
            groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            gridHelper = new THREE.GridHelper(100, 100, 0x38bdf8, 0x1e293b);
            gridHelper.position.y = 0.005;
            scene.add(gridHelper);
        }

        
        // ===== 둥근 모서리 박스 (라운드 처리된 플라스틱 느낌) =====
        function roundedBoxGeo(w, h, d, r) {
            const b = Math.max(0.004, Math.min(r * 0.55, d * 0.25, w * 0.25, h * 0.25));
            const iw = w - 2 * b, ih = h - 2 * b;
            const ir = Math.max(r - b, 0.002);
            const x = -iw / 2, y = -ih / 2;
            const sh = new THREE.Shape();
            sh.moveTo(x + ir, y);
            sh.lineTo(x + iw - ir, y);
            sh.absarc(x + iw - ir, y + ir, ir, -Math.PI / 2, 0, false);
            sh.lineTo(x + iw, y + ih - ir);
            sh.absarc(x + iw - ir, y + ih - ir, ir, 0, Math.PI / 2, false);
            sh.lineTo(x + ir, y + ih);
            sh.absarc(x + ir, y + ih - ir, ir, Math.PI / 2, Math.PI, false);
            sh.lineTo(x, y + ir);
            sh.absarc(x + ir, y + ir, ir, Math.PI, Math.PI * 1.5, false);
            const depth = Math.max(0.001, d - 2 * b);
            const g = new THREE.ExtrudeGeometry(sh, {
                depth: depth, bevelEnabled: true, bevelThickness: b, bevelSize: b,
                bevelSegments: 4, curveSegments: 10
            });
            g.translate(0, 0, -depth / 2);
            return g;
        }

        // ===== 바퀴 휠 텍스처 (검정 + 회색 스포크) =====
        function makeWheelTexture() {
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const g = c.getContext('2d');
            const C = 128;
            g.fillStyle = '#14171b';
            g.beginPath(); g.arc(C, C, 128, 0, Math.PI * 2); g.fill();

            g.strokeStyle = '#6b7280'; g.lineWidth = 6;
            g.beginPath(); g.arc(C, C, 118, 0, Math.PI * 2); g.stroke();

            for (let i = 0; i < 5; i++) {
                g.save();
                g.translate(C, C);
                g.rotate((i * 72 * Math.PI) / 180);
                g.fillStyle = '#4b525c';
                g.beginPath();
                g.moveTo(-12, -20);
                g.lineTo(-30, -108);
                g.quadraticCurveTo(0, -120, 30, -108);
                g.lineTo(12, -20);
                g.closePath();
                g.fill();
                g.strokeStyle = '#7b838e'; g.lineWidth = 3;
                g.stroke();
                g.restore();
            }
            g.fillStyle = '#9aa1ab';
            g.beginPath(); g.arc(C, C, 28, 0, Math.PI * 2); g.fill();
            g.fillStyle = '#e2e5ea';
            g.beginPath(); g.arc(C, C, 11, 0, Math.PI * 2); g.fill();
            const tex = new THREE.CanvasTexture(c);
            tex.anisotropy = 4;
            return tex;
        }

        function createDetailedZumiRobot() {
            const zumi = new THREE.Group();

            // ----- 재질 (사진의 하늘색 / 흰색 / 검정 / 빨강) -----
            const blueMat  = new THREE.MeshPhysicalMaterial({ color: 0x2f9be8, roughness: 0.28, metalness: 0.0, clearcoat: 0.9, clearcoatRoughness: 0.15 });
            const whiteMat = new THREE.MeshPhysicalMaterial({ color: 0xf3f6fb, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3 });
            const blackMat = new THREE.MeshPhysicalMaterial({ color: 0x15181d, roughness: 0.35, clearcoat: 0.6 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x1d2228, roughness: 0.12, metalness: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.05 });
            const redMat   = new THREE.MeshStandardMaterial({ color: 0xc8303c, roughness: 0.35, metalness: 0.1 });
            const grayMat  = new THREE.MeshStandardMaterial({ color: 0x8d949c, roughness: 0.5 });
            const rubberMat = new THREE.MeshStandardMaterial({ color: 0x101214, roughness: 0.95 });

            const add = (geo, mat, x, y, z, cast = true) => {
                const m = new THREE.Mesh(geo, mat);
                m.position.set(x, y, z);
                m.castShadow = cast;
                m.receiveShadow = true;
                zumi.add(m);
                return m;
            };

            // ----- 흰색 하단 베이스 -----
            add(roundedBoxGeo(1.3, 0.46, 1.78, 0.09), whiteMat, 0, 0.35, -0.02);

            // ----- 빨간 띠 (옆면/뒷면) -----
            add(roundedBoxGeo(1.32, 0.045, 1.6, 0.03), redMat, 0, 0.585, 0.07, false);
            // 앞쪽 회색 띠
            add(roundedBoxGeo(1.31, 0.04, 0.2, 0.02), grayMat, 0, 0.585, -0.82, false);

            // ----- 파란 상단 바디 -----
            add(roundedBoxGeo(1.26, 0.86, 1.62, 0.14), blueMat, 0, 1.01, 0.06);

            // 지붕 단차
            const roofSlab = roundedBoxGeo(1.0, 1.0, 0.07, 0.04);
            roofSlab.rotateX(Math.PI / 2);
            add(roofSlab, blueMat, 0, 1.465, 0.3, false);

            // 스피커 무늬
            for (let i = 0; i < 3; i++) {
                add(new THREE.BoxGeometry(0.16 - i * 0.03, 0.006, 0.012), new THREE.MeshStandardMaterial({ color: 0x1a73b8 }),
                    0, 1.447, -0.55 + i * 0.035, false);
            }

            // ----- 손잡이(롤바) 2개 -----
            [-0.44, 0.44].forEach(x => {
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(x, 1.40, -0.58),
                    new THREE.Vector3(x, 1.56, -0.52),
                    new THREE.Vector3(x, 1.61, -0.3),
                    new THREE.Vector3(x, 1.61, 0.38),
                    new THREE.Vector3(x, 1.56, 0.6),
                    new THREE.Vector3(x, 1.40, 0.66)
                ]);
                const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.04, 10, false), blackMat);
                tube.castShadow = true;
                zumi.add(tube);
            });

            // ----- 옆면 창문 (큰 창 + 작은 창) -----
            const bigWinGeo = roundedBoxGeo(0.7, 0.42, 0.04, 0.05); bigWinGeo.rotateY(Math.PI / 2);
            const smallWinGeo = roundedBoxGeo(0.3, 0.42, 0.04, 0.05); smallWinGeo.rotateY(Math.PI / 2);
            [-1, 1].forEach(sd => {
                add(bigWinGeo, glassMat, sd * 0.63, 1.1, -0.2, false);
                add(smallWinGeo, glassMat, sd * 0.63, 1.1, 0.5, false);
                // 옆 작은 핀
                const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.09, 10), blueMat);
                pin.rotation.z = Math.PI / 2;
                pin.position.set(sd * 0.66, 0.98, -0.66);
                zumi.add(pin);
            });

            // ----- 뒷면 큰 창 -----
            add(roundedBoxGeo(0.86, 0.5, 0.04, 0.06), glassMat, 0, 1.07, 0.87, false);

            // ----- 앞면: 얼굴 화면 -----
            add(roundedBoxGeo(0.94, 0.5, 0.05, 0.06), blackMat, 0, 1.13, -0.745, false);

            eyeCanvas = document.createElement('canvas');
            eyeCanvas.width = 512;
            eyeCanvas.height = 256;
            eyeContext = eyeCanvas.getContext('2d');
            eyeTexture = new THREE.CanvasTexture(eyeCanvas);
            updateEyeDisplay('normal');

            const screenMesh = new THREE.Mesh(
                new THREE.PlaneGeometry(0.84, 0.42),
                new THREE.MeshBasicMaterial({ map: eyeTexture })
            );
            screenMesh.rotation.y = Math.PI; // 앞(-z)을 바라보게
            screenMesh.position.set(0, 1.13, -0.773);
            zumi.add(screenMesh);

            // ----- 앞면: 카메라 + 통풍구 그릴 -----
            add(roundedBoxGeo(0.94, 0.22, 0.06, 0.04), new THREE.MeshStandardMaterial({ color: 0x050607, roughness: 0.6 }), 0, 0.74, -0.755, false);

            const slatMat = new THREE.MeshStandardMaterial({ color: 0x2c3138, roughness: 0.5 });
            [-1, 1].forEach(sd => {
                for (let i = 0; i < 4; i++) {
                    add(new THREE.BoxGeometry(0.05, 0.15, 0.03), slatMat, sd * (0.2 + i * 0.07), 0.74, -0.785, false);
                }
            });
            // 카메라 렌즈
            const lensHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.05, 24), blackMat);
            lensHousing.rotation.x = Math.PI / 2;
            lensHousing.position.set(0, 0.74, -0.785);
            zumi.add(lensHousing);
            const lens = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.06, 0.02, 24),
                new THREE.MeshStandardMaterial({ color: 0x1b1033, emissive: 0x5b2a9e, emissiveIntensity: 0.55, metalness: 0.9, roughness: 0.1 })
            );
            lens.rotation.x = Math.PI / 2;
            lens.position.set(0, 0.74, -0.81);
            zumi.add(lens);

            // ----- 앞 베이스의 4색 버튼 (빨/파 | 초/노) -----
            const btnColors = [0xe5322d, 0x2a62d9, 0x1faa4b, 0xf5c518];
            const btnX = [-0.5, -0.34, 0.34, 0.5];
            btnX.forEach((x, i) => {
                const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.02, 20), grayMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.set(x, 0.3, -0.905);
                zumi.add(ring);
                const dome = new THREE.Mesh(
                    new THREE.SphereGeometry(0.048, 18, 12),
                    new THREE.MeshStandardMaterial({ color: btnColors[i], roughness: 0.25, emissive: btnColors[i], emissiveIntensity: 0.25 })
                );
                dome.scale.set(1, 1, 0.55);
                dome.position.set(x, 0.3, -0.92);
                zumi.add(dome);
            });

            // ----- 바퀴 덮개(파란 펜더) -----
            const fenderGeo = roundedBoxGeo(0.95, 0.6, 0.12, 0.14);
            fenderGeo.rotateY(Math.PI / 2);
            [-1, 1].forEach(sd => add(fenderGeo, blueMat, sd * 0.71, 0.5, 0.2, true));

            // ----- 바퀴 -----
            const wheelTex = makeWheelTexture();
            const rimMat = new THREE.MeshStandardMaterial({ map: wheelTex, roughness: 0.45, metalness: 0.35 });
            const makeWheel = (side) => {
                const g = new THREE.Group();
                const tire = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_RADIUS, WHEEL_RADIUS, 0.14, 48), rubberMat);
                tire.rotation.z = Math.PI / 2;
                tire.castShadow = true;
                g.add(tire);
                // 타이어 트레드 홈
                for (let i = 0; i < 28; i++) {
                    const a = (i / 28) * Math.PI * 2;
                    const t = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.03, 0.035), new THREE.MeshStandardMaterial({ color: 0x2a2e33, roughness: 1 }));
                    t.position.set(0, Math.cos(a) * (WHEEL_RADIUS + 0.004), Math.sin(a) * (WHEEL_RADIUS + 0.004));
                    t.rotation.x = -a;
                    g.add(t);
                }
                const rim = new THREE.Mesh(new THREE.CircleGeometry(WHEEL_RADIUS * 0.88, 48), rimMat);
                rim.rotation.y = side * Math.PI / 2;
                rim.position.x = side * 0.073;
                g.add(rim);
                g.position.set(side * WHEEL_TRACK, WHEEL_RADIUS, 0.2);
                return g;
            };
            wheelLeft = makeWheel(-1);
            wheelRight = makeWheel(1);
            zumi.add(wheelLeft, wheelRight);

            // ----- 앞쪽 보조 바퀴(캐스터) -----
            add(new THREE.SphereGeometry(0.06, 16, 12), blackMat, 0, 0.07, -0.66, false);

            // ----- 주미 AI 카메라 (렌즈 위치에서 앞(-z)을 바라봄) -----
            zumiCam = new THREE.PerspectiveCamera(75, 16 / 10, 0.08, 1000);
            zumiCam.position.set(0, 0.74, -0.84);
            zumiCam.rotation.x = -0.1;
            zumi.add(zumiCam);

            zumi.position.set(0, 0, 0);
            return zumi;
        }

        function updateEyeDisplay(state) {
            currentEyeState = state;
            const c = eyeContext;

            // 유리 느낌의 짙은 회색 화면
            c.save();
            c.shadowBlur = 0;
            const bg = c.createLinearGradient(0, 0, 512, 256);
            bg.addColorStop(0, '#3a4048');
            bg.addColorStop(1, '#1b1f25');
            c.fillStyle = bg;
            c.fillRect(0, 0, 512, 256);
            c.restore();

            c.save();
            c.shadowColor = '#22d3ee';
            c.shadowBlur = 24;
            const eg = c.createLinearGradient(0, 60, 0, 200);
            eg.addColorStop(0, '#a5f3ff');
            eg.addColorStop(1, '#22c5e8');
            c.fillStyle = eg;

            if (state === 'normal') {
                roundRect(c, 172 - 19, 128 - 56, 38, 112, 19);
                roundRect(c, 340 - 19, 128 - 56, 38, 112, 19);
            } else if (state === 'blink') {
                roundRect(c, 172 - 19, 123, 38, 10, 5);
                roundRect(c, 340 - 19, 123, 38, 10, 5);
            } else if (state === 'happy') {
                c.lineWidth = 22;
                c.strokeStyle = '#67e8f9';
                c.lineCap = 'round';
                c.beginPath(); c.arc(172, 150, 42, Math.PI, 0, false); c.stroke();
                c.beginPath(); c.arc(340, 150, 42, Math.PI, 0, false); c.stroke();
            } else if (state === 'scan') {
                c.fillStyle = '#22c55e';
                c.shadowColor = '#22c55e';
                c.fillRect(60, 36, 392, 184);
                c.fillStyle = '#1b1f25';
                c.shadowBlur = 0;
                c.fillRect(78, 54, 356, 148);
                c.fillStyle = '#22c55e';
                c.fillRect(206, 78, 100, 100);
                c.fillStyle = '#1b1f25';
                c.fillRect(226, 98, 60, 60);
            }
            c.restore();

            // 유리 반사광
            c.save();
            c.fillStyle = 'rgba(255,255,255,0.07)';
            c.beginPath();
            c.moveTo(0, 0); c.lineTo(230, 0); c.lineTo(90, 256); c.lineTo(0, 256);
            c.closePath(); c.fill();
            c.restore();

            if (eyeTexture) eyeTexture.needsUpdate = true;
        }

function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // --- 2. ENVIRONMENT THEMES & ROADS ---
        
        // 장애물 / 도로 정보 (충돌 판정 & 배치 판정에 사용)
        let obstacles = [];     // {type:'c', x, z, r}  |  {type:'b', x, z, hw, hd}
        let cityRoads = [];     // {cx, cz, w, d}  (축 정렬 사각형)
        let forestRoad = null;  // {pts:[Vector3...], half}

        function clearEnv() {
            while (envObjectsGroup.children.length > 0) {
                envObjectsGroup.remove(envObjectsGroup.children[0]);
            }
            obstacles = [];
            cityRoads = [];
            forestRoad = null;
            cloudsGroup = null;
        }

        function distToSeg(px, pz, a, b) {
            const abx = b.x - a.x, abz = b.z - a.z;
            const len2 = abx * abx + abz * abz;
            let t = len2 === 0 ? 0 : ((px - a.x) * abx + (pz - a.z) * abz) / len2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (a.x + abx * t), pz - (a.z + abz * t));
        }

        // (x, z) 점이 도로 위(또는 margin 이내)에 있는가?
        function isOnRoad(x, z, margin) {
            for (const r of cityRoads) {
                if (Math.abs(x - r.cx) < r.w / 2 + margin && Math.abs(z - r.cz) < r.d / 2 + margin) return true;
            }
            if (forestRoad) {
                const p = forestRoad.pts;
                for (let i = 0; i < p.length - 1; i++) {
                    if (distToSeg(x, z, p[i], p[i + 1]) < forestRoad.half + margin) return true;
                }
            }
            return false;
        }

        // 사각형(건물)이 도로와 겹치는가?
        function boxOverlapsRoad(x, z, hw, hd, margin) {
            for (const r of cityRoads) {
                if (Math.abs(x - r.cx) < hw + r.w / 2 + margin && Math.abs(z - r.cz) < hd + r.d / 2 + margin) return true;
            }
            return false;
        }

        function circleHitsObstacle(cx, cz, cr, o) {
            if (o.type === 'c') return Math.hypot(cx - o.x, cz - o.z) < cr + o.r;
            const px = Math.max(o.x - o.hw, Math.min(cx, o.x + o.hw));
            const pz = Math.max(o.z - o.hd, Math.min(cz, o.z + o.hd));
            return Math.hypot(cx - px, cz - pz) < cr;
        }

        function hitsAnyObstacle(x, z, r) {
            return obstacles.some(o => circleHitsObstacle(x, z, r, o));
        }

        // ===================== 공통 헬퍼 =====================
        function flatMat(color, layer, rough = 0.9) {
            return new THREE.MeshStandardMaterial({
                color, roughness: rough,
                polygonOffset: true, polygonOffsetFactor: -layer, polygonOffsetUnits: -layer
            });
        }

        // 같은 위치의 꼭짓점은 같은 값으로 흔들리는 해시 지터 (갈라짐 방지)
        function hash3(x, y, z, k) {
            const n = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + k * 11.13) * 43758.5453;
            return (n - Math.floor(n)) - 0.5;
        }
        function jitterGeometry(geo, amount) {
            const p = geo.attributes.position;
            for (let i = 0; i < p.count; i++) {
                const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
                p.setXYZ(i, x + hash3(x, y, z, 1) * amount, y + hash3(x, y, z, 2) * amount, z + hash3(x, y, z, 3) * amount);
            }
            geo.computeVertexNormals();
            return geo;
        }

        function makeInstanced(geo, mat, count, fn) {
            const im = new THREE.InstancedMesh(geo, mat, count);
            const d = new THREE.Object3D();
            for (let i = 0; i < count; i++) {
                d.position.set(0, 0, 0); d.rotation.set(0, 0, 0); d.scale.set(1, 1, 1);
                fn(d, i, im);
                d.updateMatrix();
                im.setMatrixAt(i, d.matrix);
            }
            im.instanceMatrix.needsUpdate = true;
            if (im.instanceColor) im.instanceColor.needsUpdate = true;
            return im;
        }

        // ===================== 하늘 / 구름 =====================
        let skyDome = null, cloudsGroup = null, sunLight = null;

        function createSkyDome() {
            const mat = new THREE.ShaderMaterial({
                side: THREE.BackSide, depthWrite: false, fog: false,
                uniforms: { top: { value: new THREE.Color(0x3b9be6) }, bottom: { value: new THREE.Color(0xd5efff) } },
                vertexShader: 'varying float vH; void main(){ vH = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
                fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying float vH; void main(){ float t = smoothstep(0.0, 0.55, vH); gl_FragColor = vec4(mix(bottom, top, t), 1.0); }'
            });
            skyDome = new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), mat);
            skyDome.visible = false;
            skyDome.renderOrder = -1;
            scene.add(skyDome);
        }

        function applySky(topHex, bottomHex) {
            skyDome.material.uniforms.top.value.setHex(topHex);
            skyDome.material.uniforms.bottom.value.setHex(bottomHex);
            skyDome.visible = true;
            scene.background.setHex(bottomHex);
            scene.fog.color.setHex(bottomHex);
        }

        function buildClouds() {
            cloudsGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, emissive: 0xffffff, emissiveIntensity: 0.5, flatShading: true, fog: false });
            for (let i = 0; i < 10; i++) {
                const cloud = new THREE.Group();
                const parts = 4 + Math.floor(Math.random() * 3);
                for (let k = 0; k < parts; k++) {
                    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(3 + Math.random() * 3, 1), mat);
                    m.position.set((k - parts / 2) * 4 + (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 1.5, (Math.random() - 0.5) * 3);
                    m.scale.y = 0.6;
                    cloud.add(m);
                }
                const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
                cloud.position.set(Math.cos(a) * d, 32 + Math.random() * 16, Math.sin(a) * d);
                cloud.rotation.y = Math.random() * Math.PI;
                cloudsGroup.add(cloud);
            }
            envObjectsGroup.add(cloudsGroup);
        }

        // ===================== 테마 전환 =====================
        function changeTheme(themeName) {
            currentTheme = themeName;

            const randomRoadBtn = document.getElementById('btn-random-road');

            ['default', 'city', 'forest'].forEach(t => {
                const btn = document.getElementById(`btn-theme-${t}`);
                if (t === themeName) {
                    btn.className = "px-3 py-1 rounded-lg bg-sky-500 text-white transition shadow font-bold";
                } else {
                    btn.className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition";
                }
            });

            clearEnv();

            if (themeName === 'default') {
                skyDome.visible = false;
                scene.background.setHex(0x0a0f1d);
                scene.fog.color.setHex(0x0a0f1d);
                groundMesh.material.color.setHex(0x111827);
                gridHelper.visible = true;
                randomRoadBtn.classList.add('hidden');
            } else if (themeName === 'city') {
                applySky(0x3b9be6, 0xd5efff);
                groundMesh.material.color.setHex(0x4b5563);
                gridHelper.visible = false;
                randomRoadBtn.classList.remove('hidden');
                buildCityMap(false);
            } else if (themeName === 'forest') {
                applySky(0x56b4ee, 0xe4fad2);
                groundMesh.material.color.setHex(0x357f33);
                gridHelper.visible = false;
                randomRoadBtn.classList.remove('hidden');
                buildForestMap(false);
            }
            afterEnvRebuild();
        }

        // 맵이 새로 만들어지면 조종 모드에서는 시작 위치로 되돌림 (장애물과 겹치는 것 방지)
        function afterEnvRebuild() {
            if ((mode === 'drive' || mode === 'learn') && !isExecuting && !sequenceRunning) placeAtOrigin();
            if (typeof learnOnMapChange === 'function') learnOnMapChange();
        }

        // ===================== 도시 =====================
        const facadeCache = {};
        function getFacadeMat(hex) {
            if (facadeCache[hex]) return facadeCache[hex];
            const c = document.createElement('canvas');
            c.width = c.height = 256;
            const g = c.getContext('2d');
            g.fillStyle = '#' + hex.toString(16).padStart(6, '0');
            g.fillRect(0, 0, 256, 256);
            g.fillStyle = 'rgba(0,0,0,0.14)';
            for (let r = 0; r < 4; r++) g.fillRect(0, r * 64 + 58, 256, 6);
            for (let cx = 0; cx < 4; cx++) {
                for (let cy = 0; cy < 4; cy++) {
                    const x = cx * 64 + 12, y = cy * 64 + 10, w = 40, h = 38;
                    const lit = Math.random() < 0.3;
                    const grad = g.createLinearGradient(x, y, x + w, y + h);
                    if (lit) { grad.addColorStop(0, '#fff3b0'); grad.addColorStop(1, '#f7c948'); }
                    else { grad.addColorStop(0, '#6a9ac6'); grad.addColorStop(1, '#1e3a5f'); }
                    g.fillStyle = grad;
                    g.fillRect(x, y, w, h);
                    g.strokeStyle = 'rgba(255,255,255,0.5)';
                    g.lineWidth = 2;
                    g.strokeRect(x, y, w, h);
                    g.fillStyle = 'rgba(255,255,255,0.22)';
                    g.fillRect(x + 3, y + 3, 10, h - 6);
                }
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 4;
            const mats = {
                side: new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5, metalness: 0.08 }),
                plain: new THREE.MeshStandardMaterial({ color: hex, roughness: 0.6 })
            };
            facadeCache[hex] = mats;
            return mats;
        }

        // 자기 자신을 제외한 다른 도로 위인가?
        function offOtherRoads(x, z, own, margin) {
            for (const r of cityRoads) {
                if (r === own) continue;
                if (Math.abs(x - r.cx) < r.w / 2 + margin && Math.abs(z - r.cz) < r.d / 2 + margin) return false;
            }
            return true;
        }

        function makeLamp(x, z, dirX, dirZ) {
            const g = new THREE.Group();
            const metal = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.5, metalness: 0.5 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 4.6, 8), metal);
            pole.position.y = 2.3; pole.castShadow = true;
            const arm = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.08), metal);
            arm.position.set(0.55, 4.55, 0);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.26), new THREE.MeshStandardMaterial({ color: 0xe5e7eb }));
            head.position.set(1.05, 4.5, 0);
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.18), new THREE.MeshBasicMaterial({ color: 0xfff1a8 }));
            bulb.position.set(1.05, 4.43, 0);
            g.add(pole, arm, head, bulb);
            g.rotation.y = Math.atan2(-dirZ, dirX);
            g.position.set(x, 0, z);
            envObjectsGroup.add(g);
            obstacles.push({ type: 'c', x, z, r: 0.3, kind: 'lamp', bw: 0.5, bh: 4.7 });
        }

        function makeStreetTree(x, z) {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 2.0, 8), new THREE.MeshStandardMaterial({ color: 0x78350f }));
            trunk.position.y = 1.0; trunk.castShadow = true;
            const col = new THREE.Color().setHSL(0.27 + Math.random() * 0.07, 0.55, 0.32 + Math.random() * 0.08);
            const crown = new THREE.Mesh(jitterGeometry(new THREE.IcosahedronGeometry(0.95, 1), 0.2), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8, flatShading: true }));
            crown.position.y = 2.85; crown.castShadow = true;
            g.add(trunk, crown);
            g.position.set(x, 0, z);
            envObjectsGroup.add(g);
            obstacles.push({ type: 'c', x, z, r: 0.35, kind: 'streettree', bw: 0.95, bh: 3.8 });
        }

        function makeTrafficLight(x, z) {
            const g = new THREE.Group();
            const metal = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.5, metalness: 0.4 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 4.2, 8), metal);
            pole.position.y = 2.1; pole.castShadow = true;
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.0, 0.3), metal);
            box.position.y = 4.0;
            g.add(pole, box);
            const lights = [[0xff2d2d, 4.3], [0x6b5b00, 4.0], [0x22ff66, 3.7]];
            lights.forEach(([c, y]) => {
                const s = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshBasicMaterial({ color: c }));
                s.position.set(0, y, 0.17);
                g.add(s);
            });
            g.rotation.y = Math.atan2(-x, -z);   // 교차로 중심을 바라보게
            g.position.set(x, 0, z);
            envObjectsGroup.add(g);
            obstacles.push({ type: 'c', x, z, r: 0.3, kind: 'trafficlight', bw: 0.3, bh: 4.6 });
        }

        function buildCityMap(random = false) {
            clearEnv();

            const roadMat = flatMat(0x1f2937, 2, 0.95);
            const sidewalkMat = flatMat(0xb8c0cc, 1, 0.85);
            const yellowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
            const whiteMat = new THREE.MeshBasicMaterial({ color: 0xf1f5f9, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });

            const addRoad = (cx, cz, w, d, y) => {
                const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), roadMat);
                m.rotation.x = -Math.PI / 2;
                m.position.set(cx, y, cz);
                m.receiveShadow = true;
                envObjectsGroup.add(m);
                cityRoads.push({ cx, cz, w, d });
            };

            // 기본 도로
            addRoad(0, 0, 6, 80, 0.010);
            addRoad(0, 0, 80, 6, 0.010);
            addRoad(15, 0, 4, 50, 0.010);
            addRoad(0, 15, 50, 4, 0.010);

            // 랜덤 도로
            if (random) {
                const n = 3 + Math.floor(Math.random() * 3);
                for (let i = 0; i < n; i++) {
                    const vertical = Math.random() < 0.5;
                    const w = 3 + Math.random() * 1.5;
                    const len = 25 + Math.random() * 25;
                    const off = (Math.random() - 0.5) * 56;
                    const along = (Math.random() - 0.5) * 24;
                    const y = 0.012 + i * 0.0006;
                    if (vertical) addRoad(off, along, w, len, y);
                    else addRoad(along, off, len, w, y);
                }
            }

            // 인도 (도로 양옆). 도로보다 낮은 층이라 교차로에서는 도로에 가려짐
            const SW = 1.3;
            cityRoads.forEach(r => {
                const vertical = r.d >= r.w;
                [-1, 1].forEach(sd => {
                    const m = new THREE.Mesh(
                        new THREE.PlaneGeometry(vertical ? SW : r.w, vertical ? r.d : SW), sidewalkMat);
                    m.rotation.x = -Math.PI / 2;
                    m.position.set(
                        vertical ? r.cx + sd * (r.w / 2 + SW / 2) : r.cx,
                        0.006,
                        vertical ? r.cz : r.cz + sd * (r.d / 2 + SW / 2));
                    m.receiveShadow = true;
                    envObjectsGroup.add(m);
                });
            });

            // 중앙선 점선 (교차로 부분은 자동으로 건너뜀)
            const dashV = new THREE.PlaneGeometry(0.28, 1.8); dashV.rotateX(-Math.PI / 2);
            const dashH = new THREE.PlaneGeometry(1.8, 0.28); dashH.rotateX(-Math.PI / 2);
            cityRoads.forEach((r, i) => {
                const vertical = r.d >= r.w;
                const len = vertical ? r.d : r.w;
                for (let t = -len / 2 + 2; t < len / 2 - 2; t += 4) {
                    const x = vertical ? r.cx : r.cx + t;
                    const z = vertical ? r.cz + t : r.cz;
                    if (i < 2 && Math.hypot(x, z) < 9) continue;
                    if (!offOtherRoads(x, z, r, 0.8)) continue;
                    const dash = new THREE.Mesh(vertical ? dashV : dashH, i < 2 ? yellowMat : whiteMat);
                    dash.position.set(x, 0.022, z);
                    envObjectsGroup.add(dash);
                }
            });

            // 메인 교차로 횡단보도
            const stripeV = new THREE.PlaneGeometry(0.5, 1.6); stripeV.rotateX(-Math.PI / 2);
            const stripeH = new THREE.PlaneGeometry(1.6, 0.5); stripeH.rotateX(-Math.PI / 2);
            [-1, 1].forEach(sd => {
                for (let k = -3; k <= 2; k++) {
                    const a = new THREE.Mesh(stripeV, whiteMat);   // 세로 도로를 가로지르는 줄무늬
                    a.position.set(-2.25 + (k + 3) * 0.9, 0.022, sd * 4.7);
                    envObjectsGroup.add(a);
                    const b = new THREE.Mesh(stripeH, whiteMat);   // 가로 도로를 가로지르는 줄무늬
                    b.position.set(sd * 4.7, 0.022, -2.25 + (k + 3) * 0.9);
                    envObjectsGroup.add(b);
                }
            });

            // 건물
            const palette = [0x64748b, 0x7c8aa0, 0x8a6f5a, 0x94a3b8, 0x5b7c99, 0xa8836a];
            const awningColors = [0xdc2626, 0xea580c, 0x0d9488, 0x7c3aed, 0x2563eb];
            let placed = 0, tries = 0;
            while (placed < 22 && tries < 900) {
                tries++;
                const h = 6 + Math.random() * 14;
                const w = 4 + Math.random() * 3;
                const d = 4 + Math.random() * 3;
                const x = (Math.random() - 0.5) * 78;
                const z = (Math.random() - 0.5) * 78;
                const hw = w / 2, hd = d / 2;

                if (Math.hypot(x, z) < 9) continue;
                if (Math.abs(x) + hw > 45 || Math.abs(z) + hd > 45) continue;
                if (boxOverlapsRoad(x, z, hw, hd, 2.2)) continue;
                if (obstacles.some(o => o.type === 'b' && Math.abs(x - o.x) < hw + o.hw + 1 && Math.abs(z - o.z) < hd + o.hd + 1)) continue;

                const wallHex = palette[Math.floor(Math.random() * palette.length)];
                const fm = getFacadeMat(wallHex);
                const roofMat = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.9 });

                const geo = new THREE.BoxGeometry(w, h, d);
                const uv = geo.attributes.uv;
                for (let i = 0; i < uv.count; i++) {
                    const face = Math.floor(i / 4);
                    let su = 1, sv = 1;
                    if (face < 2) { su = d / 5; sv = h / 5; }
                    else if (face >= 4) { su = w / 5; sv = h / 5; }
                    uv.setXY(i, uv.getX(i) * su, uv.getY(i) * sv);
                }
                const building = new THREE.Mesh(geo, [fm.side, fm.side, roofMat, roofMat, fm.side, fm.side]);
                building.position.set(x, h / 2, z);
                building.castShadow = true;
                building.receiveShadow = true;
                envObjectsGroup.add(building);

                // 옥상 디테일
                let topY = h;
                const detailMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.6, metalness: 0.3 });
                if (h > 12) {
                    const tier = new THREE.Mesh(new THREE.BoxGeometry(w * 0.62, 2.2, d * 0.62), fm.plain);
                    tier.position.set(x, h + 1.1, z);
                    tier.castShadow = true;
                    envObjectsGroup.add(tier);
                    topY = h + 2.2;
                } else {
                    const n = 1 + Math.floor(Math.random() * 3);
                    for (let k = 0; k < n; k++) {
                        const ac = new THREE.Mesh(new THREE.BoxGeometry(0.8 + Math.random() * 0.5, 0.5, 0.8 + Math.random() * 0.3), detailMat);
                        ac.position.set(x + (Math.random() - 0.5) * (w - 1.6), h + 0.25, z + (Math.random() - 0.5) * (d - 1.6));
                        ac.castShadow = true;
                        envObjectsGroup.add(ac);
                    }
                }
                if (h > 9) {
                    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 3, 6), detailMat);
                    ant.position.set(x + hw * 0.4, topY + 1.5, z - hd * 0.4);
                    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
                    lamp.position.set(x + hw * 0.4, topY + 3.05, z - hd * 0.4);
                    envObjectsGroup.add(ant, lamp);
                }

                // 1층 출입문 + 차양 (도로 쪽 면)
                const awnMat = new THREE.MeshStandardMaterial({ color: awningColors[Math.floor(Math.random() * awningColors.length)], roughness: 0.7 });
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.4 });
                if (Math.abs(x) > Math.abs(z)) {
                    const sx = -Math.sign(x);
                    const door = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 1.2), doorMat);
                    door.position.set(x + sx * (hw + 0.03), 0.9, z);
                    const awn = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.12, 2.2), awnMat);
                    awn.position.set(x + sx * (hw + 0.3), 2.05, z);
                    envObjectsGroup.add(door, awn);
                } else {
                    const sz = -Math.sign(z);
                    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.1), doorMat);
                    door.position.set(x, 0.9, z + sz * (hd + 0.03));
                    const awn = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.7), awnMat);
                    awn.position.set(x, 2.05, z + sz * (hd + 0.3));
                    envObjectsGroup.add(door, awn);
                }

                obstacles.push({ type: 'b', x, z, hw, hd, kind: 'building', bh: h });
                placed++;
            }

            // 가로등 + 가로수 (인도 위, 도로 / 건물과 겹치지 않는 곳만)
            cityRoads.slice(0, 4).forEach(r => {
                const vertical = r.d >= r.w;
                const len = vertical ? r.d : r.w;
                [-1, 1].forEach((sd, si) => {
                    for (let t = -len / 2 + 5 + si * 5; t < len / 2 - 5; t += 10) {
                        // 가로등: 인도 안쪽 가장자리
                        const lx = vertical ? r.cx + sd * (r.w / 2 + 0.45) : r.cx + t;
                        const lz = vertical ? r.cz + t : r.cz + sd * (r.d / 2 + 0.45);
                        if (offOtherRoads(lx, lz, r, 0.6) && !hitsAnyObstacle(lx, lz, 0.8)) {
                            makeLamp(lx, lz, vertical ? -sd : 0, vertical ? 0 : -sd);
                        }
                        // 가로수: 인도 바깥쪽, 가로등 사이
                        const tt = t + 5;
                        const tx = vertical ? r.cx + sd * (r.w / 2 + 0.95) : r.cx + tt;
                        const tz = vertical ? r.cz + tt : r.cz + sd * (r.d / 2 + 0.95);
                        if (tt < len / 2 - 3 && offOtherRoads(tx, tz, r, 0.9) && !hitsAnyObstacle(tx, tz, 1.0)) {
                            makeStreetTree(tx, tz);
                        }
                    }
                });
            });

            // 메인 교차로 신호등
            [[3.9, 3.9], [-3.9, 3.9], [3.9, -3.9], [-3.9, -3.9]].forEach(([x, z]) => {
                if (!isOnRoad(x, z, 0.6) && !hitsAnyObstacle(x, z, 0.5)) makeTrafficLight(x, z);
            });

            // 먼 배경: 도시 스카이라인 (도달할 수 없는 바깥쪽)
            const skylineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
            const count = 46;
            const skyline = makeInstanced(new THREE.BoxGeometry(1, 1, 1), skylineMat, count, (o, i, im) => {
                const a = Math.random() * Math.PI * 2, dist = 62 + Math.random() * 45;
                const hh = 14 + Math.random() * 40, ww = 7 + Math.random() * 7;
                o.position.set(Math.cos(a) * dist, hh / 2, Math.sin(a) * dist);
                o.scale.set(ww, hh, ww * (0.8 + Math.random() * 0.5));
                o.rotation.y = Math.random() * Math.PI;
                im.setColorAt(i, new THREE.Color().setHSL(0.58 + Math.random() * 0.05, 0.18, 0.5 + Math.random() * 0.2));
            });
            envObjectsGroup.add(skyline);

            buildClouds();
        }

        // ===================== 숲 =====================
        // 시작점(0,0)을 지나는 랜덤 닫힌 흙길
        function makeRandomForestLoop() {
            const ang = Math.random() * Math.PI * 2;
            const dist = 10 + Math.random() * 5;
            const cx = Math.cos(ang) * dist, cz = Math.sin(ang) * dist;
            const startAngle = Math.atan2(0 - cz, 0 - cx);
            const n = 6 + Math.floor(Math.random() * 3);
            const pts = [new THREE.Vector3(0, 0.01, 0)];
            for (let i = 1; i < n; i++) {
                const a = startAngle + (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
                const r = dist * (0.7 + Math.random() * 0.45);
                pts.push(new THREE.Vector3(cx + Math.cos(a) * r, 0.01, cz + Math.sin(a) * r));
            }
            return pts;
        }

        // 길 리본 메시 (한 번에 부드럽게 그려지는 흙길)
        function makeRibbon(pts, half, y, mat, offset = 0) {
            const n = pts.length - 1;   // 닫힌 곡선: 마지막 점 = 첫 점
            const pos = [], nor = [], idx = [];
            for (let i = 0; i < n; i++) {
                const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
                let tx = b.x - a.x, tz = b.z - a.z;
                const l = Math.hypot(tx, tz) || 1;
                tx /= l; tz /= l;
                const nx = -tz, nz = tx;
                const cx = p.x + nx * offset, cz = p.z + nz * offset;
                pos.push(cx + nx * half, y, cz + nz * half, cx - nx * half, y, cz - nz * half);
                nor.push(0, 1, 0, 0, 1, 0);
            }
            const pushUp = (p, q, r) => {
                // (q-p) x (r-p) 의 y 성분이 + 이면 위를 향함
                const ux = pos[q * 3] - pos[p * 3], uz = pos[q * 3 + 2] - pos[p * 3 + 2];
                const vx = pos[r * 3] - pos[p * 3], vz = pos[r * 3 + 2] - pos[p * 3 + 2];
                if (uz * vx - ux * vz >= 0) idx.push(p, q, r); else idx.push(p, r, q);
            };
            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                const a = 2 * i, b = 2 * i + 1, c = 2 * j, d = 2 * j + 1;
                pushUp(a, c, b);
                pushUp(b, c, d);
            }
            const g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
            g.setIndex(idx);
            const m = new THREE.Mesh(g, mat);
            m.receiveShadow = true;
            return m;
        }

        function buildForestMap(random = false) {
            clearEnv();
            const ROAD_HALF = 2.25;

            const ctrl = random ? makeRandomForestLoop() : [
                new THREE.Vector3(0, 0.01, 0),
                new THREE.Vector3(12, 0.01, -10),
                new THREE.Vector3(20, 0.01, 5),
                new THREE.Vector3(5, 0.01, 22),
                new THREE.Vector3(-15, 0.01, 15),
                new THREE.Vector3(-18, 0.01, -12),
                new THREE.Vector3(-5, 0.01, -20)
            ];
            const curve = new THREE.CatmullRomCurve3(ctrl, true);
            const points = curve.getPoints(140);
            forestRoad = { pts: points, half: ROAD_HALF };

            // 흙길: 가장자리 + 본체 + 바퀴 자국
            envObjectsGroup.add(
                makeRibbon(points, ROAD_HALF + 0.4, 0.012, flatMat(0x7d5629, 1.5, 1)),
                makeRibbon(points, ROAD_HALF, 0.014, flatMat(0xb07a3a, 2, 0.95)),
                makeRibbon(points, 0.22, 0.016, flatMat(0x94662e, 2.5, 1), 0.9),
                makeRibbon(points, 0.22, 0.016, flatMat(0x94662e, 2.5, 1), -0.9)
            );

            // 잔디 색 변화 패치
            const patchColors = [0x347c30, 0x2c6e2d, 0x3f8a37, 0x4a9640, 0x275f29];
            for (let i = 0; i < 28; i++) {
                const patch = new THREE.Mesh(new THREE.CircleGeometry(3 + Math.random() * 6, 24), flatMat(patchColors[i % patchColors.length], 1 + (i % 3) * 0.1, 1));
                patch.rotation.x = -Math.PI / 2;
                patch.position.set((Math.random() - 0.5) * 90, 0.004 + (i % 5) * 0.0004, (Math.random() - 0.5) * 90);
                patch.receiveShadow = true;
                envObjectsGroup.add(patch);
            }

            // ---- 연못 ----
            {
                const R = 2.6 + Math.random() * 1.0;
                for (let tries = 0; tries < 300; tries++) {
                    const x = (Math.random() - 0.5) * 64, z = (Math.random() - 0.5) * 64;
                    if (Math.hypot(x, z) < 10) continue;
                    if (isOnRoad(x, z, R + 1.6)) continue;
                    const water = new THREE.Mesh(new THREE.CircleGeometry(R, 40),
                        new THREE.MeshStandardMaterial({ color: 0x2a9fd6, roughness: 0.08, metalness: 0.4, transparent: true, opacity: 0.92, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
                    water.rotation.x = -Math.PI / 2; water.position.set(x, 0.02, z);
                    const mud = new THREE.Mesh(new THREE.RingGeometry(R - 0.05, R + 0.55, 40), flatMat(0x6b4a2b, 1.8, 1));
                    mud.rotation.x = -Math.PI / 2; mud.position.set(x, 0.018, z);
                    envObjectsGroup.add(mud, water);
                    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x78808c, roughness: 0.9, flatShading: true });
                    const reedMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.8 });
                    for (let k = 0; k < 14; k++) {
                        const a = (k / 14) * Math.PI * 2 + Math.random() * 0.2;
                        const sx = x + Math.cos(a) * (R + 0.3), sz = z + Math.sin(a) * (R + 0.3);
                        if (k % 3 === 0) {
                            const reed = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 1.1 + Math.random() * 0.5, 5), reedMat);
                            reed.position.set(sx, 0.55, sz); reed.rotation.z = (Math.random() - 0.5) * 0.3;
                            const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 6), new THREE.MeshStandardMaterial({ color: 0x5b3a1a }));
                            tip.position.set(sx, 1.2, sz);
                            envObjectsGroup.add(reed, tip);
                        } else {
                            const st = new THREE.Mesh(jitterGeometry(new THREE.DodecahedronGeometry(0.2 + Math.random() * 0.2, 0), 0.08), stoneMat);
                            st.position.set(sx, 0.12, sz); st.castShadow = true;
                            envObjectsGroup.add(st);
                        }
                    }
                    const padMat = new THREE.MeshStandardMaterial({ color: 0x3f9e3a, roughness: 0.8 });
                    for (let k = 0; k < 6; k++) {
                        const a = Math.random() * Math.PI * 2, rr = Math.random() * (R - 0.6);
                        const pad = new THREE.Mesh(new THREE.CircleGeometry(0.22 + Math.random() * 0.12, 10), padMat);
                        pad.rotation.x = -Math.PI / 2; pad.position.set(x + Math.cos(a) * rr, 0.03, z + Math.sin(a) * rr);
                        envObjectsGroup.add(pad);
                    }
                    obstacles.push({ type: 'c', x, z, r: R + 0.5, kind: 'pond', bw: R, bh: 0.15 });
                    break;
                }
            }

            // ---- 나무 (소나무 / 참나무 / 자작나무) ----
            const pineMats = [0x14532d, 0x166534, 0x1a6b3a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true }));
            const oakMats = [0x3f8f2f, 0x4d9c33, 0x357a2a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true }));
            const birchMats = [0x8bc34a, 0x9ccc45].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true }));
            const barkMat = new THREE.MeshStandardMaterial({ color: 0x6b3f1d, roughness: 1 });
            const birchBark = new THREE.MeshStandardMaterial({ color: 0xeceff1, roughness: 0.9 });
            const pick = arr => arr[Math.floor(Math.random() * arr.length)];

            function buildTree(type, s) {
                const g = new THREE.Group();
                const add = (m) => { m.castShadow = true; g.add(m); return m; };
                let canopyR;
                if (type === 'pine') {
                    const trunk = add(new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.38 * s, 2.4 * s, 8), barkMat));
                    trunk.position.y = 1.2 * s;
                    const m = pick(pineMats);
                    [[2.0, 1.7, 2.2], [3.2, 1.35, 2.0], [4.3, 0.95, 1.8]].forEach(([by, r, hh]) => {
                        const cone = add(new THREE.Mesh(jitterGeometry(new THREE.ConeGeometry(r * s, hh * s, 9), 0.12 * s), m));
                        cone.position.y = (by + hh / 2) * s;
                    });
                    canopyR = 1.7 * s;
                } else if (type === 'oak') {
                    const trunk = add(new THREE.Mesh(new THREE.CylinderGeometry(0.25 * s, 0.42 * s, 2.3 * s, 8), barkMat));
                    trunk.position.y = 1.15 * s;
                    const m = pick(oakMats);
                    [[0, 3.1, 0, 1.15], [0.7, 3.4, 0.2, 0.95], [-0.6, 3.5, -0.3, 1.0], [0.1, 4.0, 0.1, 0.9]].forEach(([ox, oy, oz, r]) => {
                        const blob = add(new THREE.Mesh(jitterGeometry(new THREE.IcosahedronGeometry(r * s, 1), 0.3 * s), m));
                        blob.position.set(ox * s, oy * s, oz * s);
                    });
                    canopyR = 1.8 * s;
                } else {
                    const trunk = add(new THREE.Mesh(new THREE.CylinderGeometry(0.13 * s, 0.2 * s, 3.2 * s, 8), birchBark));
                    trunk.position.y = 1.6 * s;
                    for (let k = 0; k < 4; k++) {
                        const band = new THREE.Mesh(new THREE.BoxGeometry(0.2 * s, 0.05, 0.08), new THREE.MeshStandardMaterial({ color: 0x263238 }));
                        band.position.set(0.1 * s, (0.7 + k * 0.6) * s, 0.08 * s); band.rotation.y = k;
                        g.add(band);
                    }
                    const m = pick(birchMats);
                    [[0, 3.6, 0, 0.9], [0.5, 3.3, 0.2, 0.7], [-0.45, 3.5, -0.2, 0.75]].forEach(([ox, oy, oz, r]) => {
                        const blob = add(new THREE.Mesh(jitterGeometry(new THREE.IcosahedronGeometry(r * s, 1), 0.25 * s), m));
                        blob.position.set(ox * s, oy * s, oz * s);
                    });
                    canopyR = 1.4 * s;
                }
                return { g, canopyR };
            }

            let placed = 0, tries = 0;
            while (placed < 46 && tries < 1000) {
                tries++;
                const x = (Math.random() - 0.5) * 68, z = (Math.random() - 0.5) * 68;
                if (Math.hypot(x, z) < 6) continue;
                const s = 1.0 + Math.random() * 0.4;
                const roll = Math.random();
                const type = roll < 0.5 ? 'pine' : (roll < 0.8 ? 'oak' : 'birch');
                const canopyGuess = (type === 'pine' ? 1.7 : type === 'oak' ? 1.8 : 1.4) * s;
                if (isOnRoad(x, z, canopyGuess + 0.3)) continue;      // 잎까지 도로 밖
                if (hitsAnyObstacle(x, z, 1.2 * s)) continue;
                const t = buildTree(type, s);
                t.g.position.set(x, 0, z);
                t.g.rotation.y = Math.random() * Math.PI * 2;
                envObjectsGroup.add(t.g);
                obstacles.push({ type: 'c', x, z, r: 0.45 * s, kind: 'tree', bw: canopyGuess, bh: 5.6 * s });
                placed++;
            }

            // ---- 덤불 ----
            const bushMats = [0x2f7d32, 0x3a8f3a, 0x4a9d3f].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, flatShading: true }));
            placed = 0; tries = 0;
            while (placed < 32 && tries < 800) {
                tries++;
                const x = (Math.random() - 0.5) * 70, z = (Math.random() - 0.5) * 70;
                if (Math.hypot(x, z) < 5) continue;
                if (isOnRoad(x, z, 0.9 + 0.3)) continue;
                if (hitsAnyObstacle(x, z, 0.6)) continue;
                const bush = new THREE.Group();
                const m = pick(bushMats);
                for (let k = 0; k < 3; k++) {
                    const b = new THREE.Mesh(jitterGeometry(new THREE.IcosahedronGeometry(0.4 + Math.random() * 0.2, 1), 0.15), m);
                    b.position.set((Math.random() - 0.5) * 0.6, 0.35 + Math.random() * 0.1, (Math.random() - 0.5) * 0.6);
                    b.castShadow = true;
                    bush.add(b);
                }
                bush.position.set(x, 0, z);
                envObjectsGroup.add(bush);
                obstacles.push({ type: 'c', x, z, r: 0.75, kind: 'bush', bw: 0.8, bh: 0.95 });
                placed++;
            }

            // ---- 쓰러진 통나무 ----
            const logMat = new THREE.MeshStandardMaterial({ color: 0x7a4a24, roughness: 1 });
            const logEnd = new THREE.MeshStandardMaterial({ color: 0xd6a566, roughness: 0.9 });
            placed = 0; tries = 0;
            while (placed < 5 && tries < 400) {
                tries++;
                const x = (Math.random() - 0.5) * 64, z = (Math.random() - 0.5) * 64;
                if (Math.hypot(x, z) < 8) continue;
                const yaw = Math.random() * Math.PI;
                const dx = Math.cos(yaw), dz = Math.sin(yaw);
                const circles = [-0.9, 0, 0.9].map(t => ({ x: x + dx * t, z: z + dz * t }));
                if (circles.some(c => isOnRoad(c.x, c.z, 1.0) || hitsAnyObstacle(c.x, c.z, 0.45))) continue;
                const log = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 2.3, 10), [logMat, logEnd, logEnd]);
                log.rotation.z = Math.PI / 2;
                const lg = new THREE.Group();
                lg.add(log); log.castShadow = true;
                lg.position.set(x, 0.25, z);
                lg.rotation.y = -yaw;
                envObjectsGroup.add(lg);
                circles.forEach((c, ci) => obstacles.push({ type: 'c', x: c.x, z: c.z, r: 0.4, kind: 'log', bw: 1.2, bh: 0.55, det: ci === 1 }));
                placed++;
            }

            // ---- 바위 (찌그러진 모양 + 주변 자갈) ----
            const rockMats = [0x6b7280, 0x78808c, 0x5b6370].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, flatShading: true }));
            placed = 0; tries = 0;
            while (placed < 16 && tries < 700) {
                tries++;
                const rSize = 0.45 + Math.random() * 0.85;
                const x = (Math.random() - 0.5) * 62, z = (Math.random() - 0.5) * 62;
                if (Math.hypot(x, z) < 5) continue;
                if (isOnRoad(x, z, rSize + 0.9)) continue;
                if (hitsAnyObstacle(x, z, rSize + 0.3)) continue;
                const m = pick(rockMats);
                const rock = new THREE.Mesh(jitterGeometry(new THREE.DodecahedronGeometry(rSize, 0), rSize * 0.45), m);
                rock.scale.set(1, 0.65 + Math.random() * 0.3, 0.85 + Math.random() * 0.3);
                rock.position.set(x, rSize * 0.45, z);
                rock.rotation.y = Math.random() * Math.PI;
                rock.castShadow = true; rock.receiveShadow = true;
                envObjectsGroup.add(rock);
                for (let k = 0; k < 4; k++) {
                    const a = Math.random() * Math.PI * 2, rr = rSize + 0.15 + Math.random() * 0.3;
                    const pr = 0.07 + Math.random() * 0.1;
                    const peb = new THREE.Mesh(jitterGeometry(new THREE.DodecahedronGeometry(pr, 0), pr * 0.4), m);
                    peb.position.set(x + Math.cos(a) * rr, pr * 0.5, z + Math.sin(a) * rr);
                    envObjectsGroup.add(peb);
                }
                obstacles.push({ type: 'c', x, z, r: rSize * 1.05, kind: 'rock', bw: rSize, bh: rSize * 0.9 });
                placed++;
            }

            // ---- 풀 (인스턴싱) ----
            const tuftPos = [];
            for (let i = 0, t = 0; i < 420 && t < 2000; t++) {
                const x = (Math.random() - 0.5) * 92, z = (Math.random() - 0.5) * 92;
                if (isOnRoad(x, z, 0.5)) continue;
                tuftPos.push([x, z]); i++;
            }
            const bladeGeo = new THREE.ConeGeometry(0.07, 0.42, 4); bladeGeo.translate(0, 0.21, 0);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, flatShading: true });
            for (let k = 0; k < 3; k++) {
                envObjectsGroup.add(makeInstanced(bladeGeo, bladeMat, tuftPos.length, (o, i, im) => {
                    const [x, z] = tuftPos[i];
                    o.position.set(x + (Math.random() - 0.5) * 0.18, 0, z + (Math.random() - 0.5) * 0.18);
                    o.rotation.set((Math.random() - 0.5) * 0.7, Math.random() * 6.28, (Math.random() - 0.5) * 0.7);
                    const sc = 0.7 + Math.random() * 0.8;
                    o.scale.set(sc, sc, sc);
                    im.setColorAt(i, new THREE.Color().setHSL(0.25 + Math.random() * 0.08, 0.6, 0.28 + Math.random() * 0.14));
                }));
            }

            // ---- 들꽃 (인스턴싱) ----
            const flowerCols = [0xf9a8d4, 0xfde047, 0xffffff, 0xc084fc, 0xfb7185];
            const flowerPos = [];
            for (let i = 0, t = 0; i < 140 && t < 1000; t++) {
                const x = (Math.random() - 0.5) * 80, z = (Math.random() - 0.5) * 80;
                if (isOnRoad(x, z, 0.6)) continue;
                flowerPos.push([x, z]); i++;
            }
            envObjectsGroup.add(makeInstanced(new THREE.SphereGeometry(0.09, 6, 5), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 }), flowerPos.length, (o, i, im) => {
                o.position.set(flowerPos[i][0], 0.32, flowerPos[i][1]);
                im.setColorAt(i, new THREE.Color(flowerCols[Math.floor(Math.random() * flowerCols.length)]));
            }));
            envObjectsGroup.add(makeInstanced(new THREE.CylinderGeometry(0.012, 0.012, 0.32, 4), new THREE.MeshStandardMaterial({ color: 0x3f7d20 }), flowerPos.length, (o, i) => {
                o.position.set(flowerPos[i][0], 0.16, flowerPos[i][1]);
            }));

            // ---- 먼 배경: 숲 띠 + 언덕 ----
            const farPos = [];
            for (let i = 0; i < 170; i++) {
                const a = Math.random() * Math.PI * 2, d = 52 + Math.random() * 45;
                farPos.push({ x: Math.cos(a) * d, z: Math.sin(a) * d, sc: 0.8 + Math.random() * 0.9 });
            }
            envObjectsGroup.add(makeInstanced(new THREE.CylinderGeometry(0.4, 0.6, 3, 6), barkMat, farPos.length, (o, i) => {
                o.position.set(farPos[i].x, 1.5, farPos[i].z);
            }));
            envObjectsGroup.add(makeInstanced(new THREE.ConeGeometry(2.4, 9, 7), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, flatShading: true }), farPos.length, (o, i, im) => {
                const p = farPos[i];
                o.position.set(p.x, 3 + 4.5 * p.sc, p.z);
                o.scale.set(p.sc, p.sc, p.sc);
                im.setColorAt(i, new THREE.Color().setHSL(0.3 + Math.random() * 0.06, 0.5, 0.2 + Math.random() * 0.1));
            }));
            const hillMat = new THREE.MeshStandardMaterial({ color: 0x4f9a45, roughness: 1 });
            for (let i = 0; i < 9; i++) {
                const a = (i / 9) * Math.PI * 2 + Math.random() * 0.4, d = 120 + Math.random() * 40;
                const hill = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 10, 0, Math.PI * 2, 0, Math.PI / 2), hillMat);
                const R = 25 + Math.random() * 20;
                hill.scale.set(R, 8 + Math.random() * 10, R);
                hill.position.set(Math.cos(a) * d, 0, Math.sin(a) * d);
                envObjectsGroup.add(hill);
            }

            buildClouds();
        }

function generateRandomRoads() {
            if (currentTheme === 'default') return;

            if (currentTheme === 'city') {
                buildCityMap(true);
                showSpeech('도시 맵의 랜덤 도로가 새롭게 생성되었습니다!');
            } else if (currentTheme === 'forest') {
                buildForestMap(true);
                showSpeech('숲속 맵의 랜덤 흙길이 새롭게 생성되었습니다!');
            }
            afterEnvRebuild();
        }

        // --- 3. MODES & USER INTERACTION ---
        function selectMode(selectedMode) {
            mode = selectedMode;

        function openLandingModal() {

        function handleCardClick(type) {
            if (isExecuting || sequenceRunning) return;

            if (mode === 'lab') {
                if (type === 'run') {
                    showSpeech('실행하기 카드는 [심화 코딩] 모드에서 동작합니다.');
                    return;
                }
                if (type === 'delete') {
                    resetPosition();
                    return;
                }

                const cardInfo = CARD_META[type];
                triggerCameraScan(cardInfo, () => {
                    executeSingleActionAsync(type, cardInfo.defaultVal);
                });

            } else {
                if (type === 'run') {
                    runAdvancedSequence();
                    return;
                }
                if (type === 'delete') {
                    deleteLastCommand();
                    return;
                }

                openParamModal(type);
            }

            updateEyeDisplay('scan');

        function confirmParamModal() {
            if (!pendingCommandType) return;

            // ★ 버그 수정: closeParamModal()이 pendingCommandType을 null로 만들기 때문에
            //   값을 먼저 지역 변수에 저장해 둬야 합니다. (0.5초 뒤 콜백에서 null이 저장되던 문제)
            const type = pendingCommandType;
            const meta = CARD_META[type];

            let val = parseInt(document.getElementById('paramValueInput').value, 10);
            if (!Number.isFinite(val) || val <= 0) val = meta.defaultVal;
            val = Math.min(val, 500);

            closeParamModal();

            triggerCameraScan(meta, () => {
                commandQueue.push({
                    id: Date.now(),
                    type: type,
                    value: val,
                    meta: meta
                });
                renderSequenceQueue();
                showSpeech(`'${meta.title} (${val}${meta.unit})' 명령어 추가 완료!`);
            });
        }

        // --- 6. ROBUST SEQUENTIAL ANIMATION ENGINE (FIXED) ---
        function executeSingleActionAsync(type, value) {
            return new Promise((resolve) => {
                const known = ['forward', 'backward', 'turnLeft', 'turnRight', 'wait'];
                if (!known.includes(type)) {
                    console.warn('알 수 없는 명령어:', type);
                    resolve();
                    return;
                }

                isExecuting = true;
                zumiGroup.position.y = 0;

                const duration = Math.max(600, Math.min(value * 35, 3000));
                const startTime = performance.now();

                const startPos = zumiGroup.position.clone();
                const startRotY = zumiGroup.rotation.y;
                const startWheelL = wheelLeft.rotation.x;
                const startWheelR = wheelRight.rotation.x;

                if (type === 'forward') showSpeech(`주미 AI 전진 중... (${value}cm)`);
                else if (type === 'backward') showSpeech(`주미 AI 후진 중... (${value}cm)`);
                else if (type === 'turnLeft') showSpeech(`주미 AI 좌회전 중... (${value}도)`);
                else if (type === 'turnRight') showSpeech(`주미 AI 우회전 중... (${value}도)`);
                else if (type === 'wait') {
                    showSpeech(`주미 AI 대기 중... (${value}초)`);
                    setTimeout(() => {
                        isExecuting = false;
                        resolve();
                    }, value * 1000);
                    return;
                }

                function stepAnimation(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                    if (type === 'forward' || type === 'backward') {
                        const dirSign = type === 'forward' ? -1 : 1;      // 앞쪽은 -z
                        const currentDist = value * CM_TO_UNITS * ease;
                        const dirVec = new THREE.Vector3(0, 0, dirSign).applyAxisAngle(new THREE.Vector3(0, 1, 0), startRotY);

                        zumiGroup.position.copy(startPos).addScaledVector(dirVec, currentDist);

                        // 바퀴 굴러가는 방향: 전진이면 윗부분이 앞(-z)으로 → x축 음의 회전
                        const travel = (type === 'forward' ? 1 : -1) * currentDist;
                        wheelLeft.rotation.x = startWheelL - travel / WHEEL_RADIUS;
                        wheelRight.rotation.x = startWheelR - travel / WHEEL_RADIUS;

                    } else if (type === 'turnLeft' || type === 'turnRight') {
                        const sign = type === 'turnLeft' ? 1 : -1;
                        const rad = (value * Math.PI / 180) * ease;
                        zumiGroup.rotation.y = startRotY + sign * rad;
                        zumiGroup.rotation.z = sign * Math.sin(ease * Math.PI) * 0.05;

                        // 제자리 회전: 양쪽 바퀴가 서로 반대로 굴러감
                        const arc = rad * WHEEL_TRACK;
                        wheelLeft.rotation.x = startWheelL + sign * arc / WHEEL_RADIUS;
                        wheelRight.rotation.x = startWheelR - sign * arc / WHEEL_RADIUS;
                    }

                    if (progress < 1) {
                        requestAnimationFrame(stepAnimation);
                    } else {
                        zumiGroup.rotation.z = 0;
                        isExecuting = false;
                        resolve();
                    }
                }

                requestAnimationFrame(stepAnimation);
            });
        }

        async function runAdvancedSequence() {
            if (commandQueue.length === 0) {
                showSpeech('실행할 명령어가 없습니다. 카드를 먼저 추가하세요!');
                return;
            }
            if (isExecuting || sequenceRunning) return;

            sequenceRunning = true;
            showSpeech('심화 코딩 순차 실행 시작!');

            try {
                for (let i = 0; i < commandQueue.length; i++) {
                    for (let j = 0; j < commandQueue.length; j++) {
                        const block = document.getElementById(`seq-block-${j}`);
                        if (block) block.classList.remove('active-execution-block');
                    }

                    const activeBlock = document.getElementById(`seq-block-${i}`);
                    if (activeBlock) {
                        activeBlock.classList.add('active-execution-block');
                        activeBlock.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }

                    const cmd = commandQueue[i];
                    await executeSingleActionAsync(cmd.type, cmd.value);
                    await new Promise(r => setTimeout(r, 200));
                }

                updateEyeDisplay('happy');
                setTimeout(() => updateEyeDisplay('normal'), 1500);
                showSpeech('모든 코딩 명령어 실행이 완료되었습니다! 🎉');
            } finally {
                for (let j = 0; j < commandQueue.length; j++) {
                    const block = document.getElementById(`seq-block-${j}`);
                    if (block) block.classList.remove('active-execution-block');
                }
                isExecuting = false;
                sequenceRunning = false;
            }
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            const cw = container.clientWidth, ch = container.clientHeight;
            if (!cw || !ch) return;
            camera.aspect = cw / ch;
            // 휴대폰 세로 화면: 학습 시트가 아래 절반을 가리므로 로봇이 위쪽에 보이게 화면 중심을 위로 옮김
            const lp = document.getElementById('learnPanel');
            const sheetOpen = document.body.classList.contains('learn-open') && lp && !lp.classList.contains('collapsed') && !lp.classList.contains('learn-hidden');
            if (sheetOpen && window.matchMedia('(max-width: 767px) and (min-height: 521px)').matches) camera.setViewOffset(cw, ch, (typeof learnModule !== 'undefined' && learnModule === 'vision' && camOn) ? Math.round(cw * 0.24) : 0, Math.round(ch * 0.22), cw, ch);
            else camera.clearViewOffset();

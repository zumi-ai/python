<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>주미 AI (Zumi AI) 카드코딩 3D 시뮬레이터</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
        }
        
        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Marker Pattern inside Card */
        .aruco-marker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background-color: black;
            padding: 3px;
            border: 2px solid white;
            border-radius: 2px;
        }
        .aruco-cell {
            aspect-ratio: 1;
            background-color: white;
        }
        .aruco-cell.b { background-color: black; }

        /* Card Hover Animations */
        .coding-card {
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .coding-card:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 14px 24px -6px rgba(0, 0, 0, 0.35);
        }
        .coding-card:active {
            transform: translateY(-2px) scale(0.97);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.8);
        }

        /* Sequence Block Pulse Glow */
        .active-execution-block {
            box-shadow: 0 0 18px 4px #f59e0b !important;
            transform: scale(1.08) translateY(-2px) !important;
            border-color: #fbbf24 !important;
        }

        /* Drive mode buttons */
        .drive-btn {
            width: 56px; height: 56px; border-radius: 14px;
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(148, 163, 184, 0.35);
            color: #e2e8f0; font-size: 20px;
            touch-action: none; transition: all 0.08s;
        }
        .drive-btn:hover { border-color: #34d399; }
        .drive-btn.active {
            background: #10b981; color: #022c22; border-color: #6ee7b7;
            transform: scale(0.93); box-shadow: 0 0 16px rgba(16, 185, 129, 0.6);
        }

        /* Zumi camera overlay */
        .cam-scanlines { background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 3px); }
        .cam-vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.5) 100%); }
        .cam-bracket { position: absolute; width: 16px; height: 16px; border-color: rgba(125, 211, 252, 0.9); }

        /* ===================== 모바일 / 반응형 ===================== */
        body { height: 100vh; height: 100dvh; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; }
        #canvas-container { touch-action: none; }
        button { touch-action: manipulation; -webkit-touch-callout: none; }
        header { padding-top: env(safe-area-inset-top); }
        footer { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
        #speechBubble { width: max-content; max-width: 88vw; z-index: 40; }
        .cam-large { width: min(30rem, 42vw) !important; }
        .drive-presets button { white-space: nowrap; font-size: 10px; padding-left: 0.1rem; padding-right: 0.1rem; }

        /* 세로 휴대폰: 학습 패널은 아래에서 올라오는 시트, 카메라는 오른쪽 위 작은 창 */
        @media (max-width: 767px) and (min-height: 521px) {
            #learnPanel { left: 0.5rem !important; right: 0.5rem !important; top: auto !important; bottom: 0.5rem !important; width: auto !important; max-width: none !important; height: 50% !important; }
            #learnPanel.collapsed { height: auto !important; }
            #zumiCamPanel { top: 0.5rem !important; right: 0.5rem !important; transform: none !important; width: 9.5rem !important; }
            #zumiCamPanel.cam-large { width: 12.5rem !important; }
            #drivePanel { min-height: 0 !important; }
            .drive-btn { width: 52px; height: 52px; }
            #cardPalette .coding-card { width: 6.5rem !important; }
        }

        /* 가로 휴대폰(높이가 낮은 화면): 조작 버튼을 3D 화면 위에 겹쳐서 화면을 최대한 넓게 */
        @media (max-height: 520px) {
            header > div:first-child { padding: 0.25rem 0.5rem !important; }
            #advancedSequenceRibbon { min-height: 0 !important; padding: 0.25rem 0.5rem !important; }
            footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; border: 0 !important; background: linear-gradient(to top, rgba(2,6,23,0.9), rgba(2,6,23,0)) !important; padding: 0 0.5rem max(0.25rem, env(safe-area-inset-bottom)); pointer-events: none; box-shadow: none !important; }
            footer > * { pointer-events: auto; }
            #cardPalette .coding-card { width: 4.6rem !important; height: 5.2rem !important; padding: 0.35rem !important; }
            #cardPalette .coding-card .self-center, #cardPalette .coding-card .text-center > div { display: none; }
            #drivePanel { min-height: 0 !important; max-width: none !important; flex-direction: row-reverse !important; justify-content: flex-start !important; gap: 0.75rem !important; }
            #drivePanel .flex-1 { max-width: 15rem !important; background: rgba(15,23,42,0.78); padding: 0.4rem 0.6rem; border-radius: 0.75rem; }
            .drive-presets, .drive-hint { display: none !important; }
            .drive-btn { width: 46px; height: 46px; }
            #cardPalette .coding-card span.w-5 { display: none; }
            #cardPalette .coding-card > div:first-child { justify-content: center; }
            #cardPalette .coding-card span { white-space: nowrap; }
            #landingModal > div { padding: 0.75rem !important; }
            #landingModal .grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 0.5rem !important; }
            #landingModal .group { display: block !important; padding: 0.6rem !important; }
            #landingModal .group > div:first-child { margin-bottom: 0.35rem !important; width: 2.25rem; height: 2.25rem; font-size: 1rem; }
            #landingModal h1 { font-size: 1.1rem !important; margin-bottom: 0.4rem !important; }
            #landingModal .inline-flex, #landingModal .relative.z-10 > p { display: none; }
            #learnPanel { top: 0.4rem !important; bottom: 0.4rem !important; left: 0.4rem !important; width: 17rem !important; }
            #zumiCamPanel { right: 0.4rem !important; top: 0.4rem !important; transform: none !important; width: 10rem !important; }
            #zumiCamPanel.cam-large { width: 18rem !important; }
        }

        /* ===================== 모바일 보강 패치 ===================== */
        /* 터치 기기: hover 확대가 눌린 채로 남아 카드가 잘리거나 어긋나는 문제 방지 */
        @media (hover: none) {
            .coding-card:hover { transform: none; box-shadow: none; }
            .coding-card:active { transform: scale(0.96); }
            .drive-btn:hover { border-color: rgba(148, 163, 184, 0.35); }
        }
        /* 학습 패널 안 버튼: 글자가 길어도 한 줄로 늘어지지 않게 줄바꿈 + 일정한 높이 */
        #learnBody button, #learnBody label { word-break: keep-all; line-height: 1.25; }
        #learnBody .grid-cols-2 > button { min-height: 2.5rem; padding-left: 0.25rem; padding-right: 0.25rem; font-size: 11px; }
        #learnBody button[onclick^="learnAnswer"] { min-height: 2.5rem; }
        /* 조종 버튼을 누르는 동안 학습 패널을 반투명으로 비워 로봇이 보이게 */
        body.driving-now #learnPanel { opacity: 0.3; pointer-events: none; }
        #learnPanel { transition: opacity 0.15s; }
        /* 숫자 입력 창: 키보드가 올라와 화면이 좁아져도 스크롤로 버튼에 닿을 수 있게 */
        #paramModal { overflow-y: auto; align-items: flex-start !important; padding: 0.5rem 0; -webkit-overflow-scrolling: touch; }
        #paramModal > div { margin-top: auto !important; margin-bottom: auto !important; }
        #paramModal button, #paramModal input { min-height: 44px; }

        @media (max-width: 767px) and (min-height: 521px) {
            #learnPanel { height: 60% !important; }
            #learnPanel.collapsed { height: auto !important; }
            #learnCollapseBtn { width: 2.25rem !important; height: 2.25rem !important; font-size: 14px !important; }
            #learnPanel > div:first-child { cursor: pointer; }
        }
        @media (max-height: 520px) {
            /* 가로 휴대폰: 패널을 좁히고(왼쪽 36%), 접으면 제목줄만 남게 */
            #learnPanel { width: min(15rem, 36vw) !important; }
            #learnPanel.collapsed { bottom: auto !important; height: auto !important; width: auto !important; min-width: 10.5rem; }
            #learnCollapseBtn { width: 2rem !important; height: 2rem !important; font-size: 14px !important; }
            #learnPanel > div:first-child { cursor: pointer; }
            #zumiCamPanel.cam-large { width: min(14rem, 34vw) !important; }
            #zumiCamPanel { width: min(10rem, 28vw) !important; }
            /* 입력 창 압축 */
            #paramModal > div { max-width: 26rem; }
            #paramModal > div > div { padding: 0.75rem !important; }
            #paramModal #paramValueInput { font-size: 1.5rem; padding-top: 0.25rem; padding-bottom: 0.25rem; }
            #paramModal h4 { font-size: 1rem; }
            #paramModal p { margin-bottom: 0.5rem !important; }
            #paramModal .mb-5 { margin-bottom: 0.5rem !important; }
        }

        /* ===== 조이스틱 / 학습창 개선 ===== */
        #joystick { display: none; position: relative; width: 132px; height: 132px; flex-shrink: 0; border-radius: 9999px;
            background: radial-gradient(circle, rgba(30,41,59,0.95) 55%, rgba(51,65,85,0.7) 100%);
            border: 3px solid rgba(148,163,184,0.45); touch-action: none; }
        #joystick.on { border-color: #34d399; box-shadow: 0 0 18px rgba(16,185,129,0.45); }
        #joyKnob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 9999px;
            background: linear-gradient(to bottom, #6ee7b7, #10b981); box-shadow: 0 4px 10px rgba(0,0,0,0.5); pointer-events: none; }
        #joystick .joy-mark { position: absolute; color: rgba(226,232,240,0.45); font-size: 11px; pointer-events: none; }
        @media (pointer: coarse) { #dpadGrid { display: none !important; } #joystick { display: block; } }
        #learnPanel.learn-hidden { display: none !important; }
        #learnFab { position: absolute; left: 0.5rem; bottom: 0.5rem; z-index: 35; }
        @media (max-width: 767px), (max-height: 520px) {
            #learnTabs { padding: 0.25rem 0.5rem !important; gap: 0.25rem !important; }
            #learnTabs button { flex-direction: row !important; justify-content: center; padding: 0.3rem 0 !important; gap: 0.25rem !important; font-size: 10px !important; }
            #learnTabs button i { font-size: 11px !important; }
            #learnBody { padding: 0.5rem !important; }
        }
        @media (max-height: 520px) { #joystick { width: 112px; height: 112px; } #joyKnob { width: 50px; height: 50px; margin: -25px 0 0 -25px; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 w-full overflow-hidden flex flex-col justify-between">

    <!-- 1. MODE SELECTION MODAL -->
    <div id="landingModal" class="fixed inset-0 z-50 flex overflow-y-auto bg-slate-950/85 backdrop-blur-md p-3 sm:p-4 transition-opacity duration-300">
        <div class="bg-slate-900 rounded-3xl max-w-5xl w-full p-4 sm:p-8 m-auto shadow-2xl border border-slate-700/80 text-center relative overflow-hidden">
            <div class="absolute -top-12 -left-12 w-44 h-44 bg-sky-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-12 -right-12 w-44 h-44 bg-indigo-500/20 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <div class="inline-flex items-center justify-center w-14 h-14 sm:w-20 sm:h-20 bg-sky-500/10 text-sky-400 rounded-2xl mb-3 sm:mb-4 border border-sky-500/20 shadow-inner">
                    <i class="fa-solid fa-robot text-3xl sm:text-4xl"></i>
                </div>
                <h1 class="text-xl sm:text-3xl font-extrabold text-white mb-2">주미 AI (Zumi AI) 시뮬레이터</h1>
                <p class="text-slate-400 text-xs sm:text-sm mb-4 sm:mb-8 max-w-md mx-auto">카드를 직접 스캔하여 정교한 3D 주미 AI 로봇을 자유롭게 조정해보세요!</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-4">
                    <button onclick="selectMode('lab')" class="group flex sm:block items-center gap-3 sm:gap-0 p-3 sm:p-6 rounded-2xl bg-slate-800/80 hover:bg-sky-600 border border-slate-700 hover:border-sky-400 text-left transition-all duration-300 shadow-lg hover:-translate-y-1">
                        <div class="w-12 h-12 rounded-xl bg-sky-500 text-white group-hover:bg-white group-hover:text-sky-600 flex items-center justify-center text-xl font-bold mb-0 sm:mb-3 flex-shrink-0 transition-colors">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <div class="min-w-0"><h3 class="text-base sm:text-xl font-bold text-white mb-0.5 sm:mb-1">카드 실험실</h3>
                        <p class="text-xs text-slate-400 group-hover:text-sky-100 leading-relaxed">
                            카드를 클릭하면 주미 AI가 카드를 즉시 카메라로 인식하여 바로 실행합니다.
                        </p></div>
                    </button>

                    <button onclick="selectMode('advanced')" class="group flex sm:block items-center gap-3 sm:gap-0 p-3 sm:p-6 rounded-2xl bg-slate-800/80 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-400 text-left transition-all duration-300 shadow-lg hover:-translate-y-1">
                        <div class="w-12 h-12 rounded-xl bg-indigo-500 text-white group-hover:bg-white group-hover:text-indigo-600 flex items-center justify-center text-xl font-bold mb-0 sm:mb-3 flex-shrink-0 transition-colors">
                            <i class="fa-solid fa-code"></i>
                        </div>
                        <div class="min-w-0"><h3 class="text-base sm:text-xl font-bold text-white mb-0.5 sm:mb-1">심화 코딩</h3>
                        <p class="text-xs text-slate-400 group-hover:text-indigo-100 leading-relaxed">
                            원하는 값(거리/각도)을 설정하여 타임라인에 순차적으로 코딩을 쌓은 뒤 한 번에 실행합니다.
                        </p></div>
                    </button>

                    <button onclick="selectMode('drive')" class="group flex sm:block items-center gap-3 sm:gap-0 p-3 sm:p-6 rounded-2xl bg-slate-800/80 hover:bg-emerald-600 border border-slate-700 hover:border-emerald-400 text-left transition-all duration-300 shadow-lg hover:-translate-y-1">
                        <div class="w-12 h-12 rounded-xl bg-emerald-500 text-white group-hover:bg-white group-hover:text-emerald-600 flex items-center justify-center text-xl font-bold mb-0 sm:mb-3 flex-shrink-0 transition-colors">
                            <i class="fa-solid fa-gamepad"></i>
                        </div>
                        <div class="min-w-0"><h3 class="text-base sm:text-xl font-bold text-white mb-0.5 sm:mb-1">조종 모드</h3>
                        <p class="text-xs text-slate-400 group-hover:text-emerald-100 leading-relaxed">
                            방향키와 속도 조절로 주미 AI를 직접 운전합니다. 나무·돌·건물은 통과할 수 없어요!
                        </p></div>
                    </button>

                    <button onclick="selectMode('learn')" class="group flex sm:block items-center gap-3 sm:gap-0 p-3 sm:p-6 rounded-2xl bg-slate-800/80 hover:bg-fuchsia-600 border border-slate-700 hover:border-fuchsia-400 text-left transition-all duration-300 shadow-lg hover:-translate-y-1">
                        <div class="w-12 h-12 rounded-xl bg-fuchsia-500 text-white group-hover:bg-white group-hover:text-fuchsia-600 flex items-center justify-center text-xl font-bold mb-0 sm:mb-3 flex-shrink-0 transition-colors">
                            <i class="fa-solid fa-brain"></i>
                        </div>
                        <div class="min-w-0"><h3 class="text-base sm:text-xl font-bold text-white mb-0.5 sm:mb-1">AI 학습 모드</h3>
                        <p class="text-xs text-slate-400 group-hover:text-fuchsia-100 leading-relaxed">
                            센서 · 물체 인식 · 머신러닝 · SLAM! 자율주행 AI의 원리를 직접 체험하며 배워요.
                        </p></div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. TOP 2-TIER HEADER BAR -->
    <header class="relative z-20 glass-panel flex flex-col shadow-2xl border-b border-slate-800">
        <div class="px-3 sm:px-6 py-2 sm:py-2.5 flex flex-wrap items-center justify-between gap-x-2 gap-y-1.5 border-b border-slate-800/80">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 text-white flex items-center justify-center font-black text-lg shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div>
                    <h2 class="font-extrabold text-white text-base leading-tight flex items-center gap-2">
                        <span class="hidden sm:inline">주미 AI 카드코딩</span>
                        <span id="currentModeBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">
                            카드 실험실
                        </span>
                    </h2>
                </div>
            </div>

            <!-- Theme & System Buttons -->
            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                <div class="flex bg-slate-900 p-1 rounded-xl text-xs font-semibold gap-1 border border-slate-800">
                    <button onclick="changeTheme('default')" id="btn-theme-default" class="px-3 py-1 rounded-lg bg-sky-500 text-white transition shadow">
                        <i class="fa-solid fa-border-all sm:mr-1"></i><span class="hidden sm:inline">격자</span>
                    </button>
                    <button onclick="changeTheme('city')" id="btn-theme-city" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">
                        <i class="fa-solid fa-city sm:mr-1"></i><span class="hidden sm:inline">도시</span>
                    </button>
                    <button onclick="changeTheme('forest')" id="btn-theme-forest" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">
                        <i class="fa-solid fa-tree sm:mr-1"></i><span class="hidden sm:inline">숲</span>
                    </button>
                </div>

                <button onclick="toggleZumiCam()" id="btn-cam" title="주미 카메라 켜기/끄기" aria-label="주미 카메라" class="px-3 py-1.5 rounded-xl bg-sky-600/80 hover:bg-sky-500 text-sky-50 transition font-bold text-xs flex items-center gap-1.5 border border-sky-400/60">
                    <i class="fa-solid fa-video"></i><span id="btn-cam-label" class="hidden md:inline">주미 카메라 ON</span>
                </button>
                <button onclick="generateRandomRoads()" id="btn-random-road" title="랜덤 도로 생성" aria-label="랜덤 도로 생성" class="px-3 py-1.5 rounded-xl bg-amber-600/80 hover:bg-amber-500 text-amber-100 transition font-bold text-xs flex items-center gap-1.5 border border-amber-500/50 hidden">
                    <i class="fa-solid fa-shuffle"></i>
                    <span class="hidden md:inline">랜덤 도로 생성</span>
                </button>

                <button onclick="resetPosition()" title="위치 리셋" aria-label="위치 리셋" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition font-bold text-xs flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-rotate-left text-sky-400"></i>
                    <span class="hidden md:inline">위치 리셋</span>
                </button>

                <button onclick="openLandingModal()" title="모드 변경" aria-label="모드 변경" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition font-bold text-xs flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-arrow-right-arrow-left text-indigo-400"></i>
                    <span class="hidden md:inline">모드 변경</span>
                </button>
            </div>
        </div>

        <!-- Tier 2: Timeline Ribbon -->
        <div id="advancedSequenceRibbon" class="hidden px-3 sm:px-6 py-2 sm:py-2.5 bg-slate-950/90 flex flex-wrap sm:flex-nowrap items-center gap-2 sm:gap-4 sm:min-h-[68px]">
            <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs font-bold text-slate-400 flex items-center gap-1">

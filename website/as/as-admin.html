
<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AS 관리 · 로보링크 직원용</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F5F9FF;--card:#fff;--ink:#14213D;--ink2:#46526E;--ink3:#8792AB;--line:#DCE6F5;--brand:#3F7BFF;--brand2:#40C8FF;--navy:#12255C;--ok:#12A36B;--warn:#B25E09;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0D1322;--card:#151C30;--ink:#F2F5FC;--ink2:#B8C1D8;--ink3:#7F8AA6;--line:#26314F;--ok:#3DD598;--warn:#F0A04B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:600 14px inherit;color:inherit;text-decoration:none;cursor:pointer}
.pill:hover{border-color:var(--brand)}
h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;line-height:1.25;margin:10px 0 8px;font-weight:900}
.lead{color:var(--ink2);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 6px 24px rgba(30,60,140,.07)}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.f{margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:800 16px inherit;padding:13px 22px;border-radius:999px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.err{color:#D14666;font-weight:600;margin:12px 0 0;min-height:1em}


.wrap{max-width:900px}
details.new{margin-bottom:18px}summary{cursor:pointer;font-weight:800;padding:14px 18px;list-style:none}
details.new .card{border-radius:0 0 var(--r) var(--r);border-top:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font:600 14px inherit;color:var(--ink2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.bar input{flex:1;min-width:180px;padding:9px 14px;border-radius:999px}
.item{margin-bottom:12px}.item .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--brand) 16%,var(--card));color:var(--brand)}
.tag.shipped{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.tag.arrived{background:color-mix(in srgb,var(--warn) 16%,var(--card));color:var(--warn)}
.sub{font-size:13.5px;color:var(--ink3);margin:2px 0 10px}
.ed{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.ed .row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
@media(max-width:620px){.ed .row3{grid-template-columns:1fr}}
.ok{color:var(--ok);font-weight:700;font-size:14px;margin-left:10px}
#login{max-width:380px;margin:12vh auto 0}
.logo{display:block}.logo img{height:26px;width:auto;display:block}.lg{text-align:center;margin-bottom:22px}.lg img{height:34px;width:auto}.pi{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--c);background:#fff;object-fit:contain;flex:none;display:block}
.pi.x{background:var(--c)}
.head{display:flex;gap:12px;align-items:flex-start}.head .tx{flex:1;min-width:0}
.pn{font-weight:800;font-size:17px;color:var(--t)}.pn span{color:var(--ink)}
.acts{display:flex;gap:6px;flex:none}.mini{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font:600 13px inherit;color:var(--ink2);cursor:pointer}
.mini.del{color:#D14666}.mini:hover{border-color:var(--brand)}.mini.del:hover{border-color:#D14666}
.edit{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}.edit[hidden]{display:none}
@media(prefers-color-scheme:dark){.pn span{color:var(--ink)}}

<div id="list"></div></section></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyRimwNWY8Va6pseElQTV3US4VSve-2ACf_k9cCBoJbfUEQ-OczGmSh56Pj9dqlnyI/exec'; // ← 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요. 비어 있으면 이 브라우저에서만 동작하는 체험 모드예요.
const STEPS=[['received','접수 완료','신청 내용을 확인했어요'],['arrived','제품 도착','제품이 로보링크에 도착했어요'],['repairing','AS 진행 중','점검·수리를 진행하고 있어요'],['shipped','발송 완료','수리를 마치고 발송했어요']];
const CARRIERS=['CJ대한통운','우체국택배','한진택배','롯데택배','로젠택배'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fPhone=p=>{const d=String(p||'').replace(/\D/g,'');return d.length==11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d.length==10?(d.startsWith('02')?d.replace(/(\d{2})(\d{4})(\d{4})/,'$1-$2-$3'):d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3')):d;};
async function api(b){
  if(!API_URL)return{ok:false,error:'서버 주소(API_URL)가 설정되지 않았어요.'};
  try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json();}
  catch(e){return{ok:false,error:'서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.'};}
}
const fmt=iso=>{const d=new Date(iso);return isNaN(d)?'':d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const trackUrl=(c,t)=>'https://search.naver.com/search.naver?query='+encodeURIComponent(c+' '+t);

const B='https://robolink.co.kr/img/renewal26/';
const PROD={'코드론 EDU':{img:B+'cde.png',c:'#D14666',t:'#D14666'},'주미 AI':{img:B+'zumiAI.png',c:'#0089DD',t:'#0089DD'},'코드론 미니':{img:B+'cdm.png',c:'#FFD100',t:'#B38F00'},'주미':{img:B+'zumi1.png',c:'#5ABEB6',t:'#2E9A91'},'코드론 II':{img:B+'cd2.png',c:'#ED7D31',t:'#ED7D31'},'코드론 프로·라이트':{img:B+'cd1.png',c:'#AFABAB',t:'#8A8686'}};
const PRODUCTS=Object.keys(PROD);
const pv=n=>PROD[n]||{img:'',c:'#8792AB',t:'#8792AB'};
$('#n_prod').innerHTML=PRODUCTS.map(p=>`<option>${p}</option>`).join('');
let code=sessionStorage.getItem('rl-staff')||'',items=[],flt='all';
async function enter(c){
  const r=await api({action:'login',code:c});
  if(!r.ok){$('#lerr').textContent=r.error;sessionStorage.removeItem('rl-staff');return;}
  code=c;sessionStorage.setItem('rl-staff',c);$('#who').textContent=r.name+' 님';
  $('#login').hidden=true;$('#app').hidden=false;load();
}
async function load(){const r=await api({action:'list',code});if(r.ok){items=r.items;draw();}else{$('#list').innerHTML=`<p class="err">${esc(r.error)}</p>`;}}
function draw(){
  const q=$('#q').value.trim().toLowerCase(),lab=Object.fromEntries(STEPS.map(s=>[s[0],s[1]]));
  $('#chips').innerHTML=[['all','전체',items.length]].concat(STEPS.map(s=>[s[0],s[1],items.filter(o=>o.status===s[0]).length])).map(c=>`<button class="chip" data-f="${c[0]}" aria-pressed="${flt===c[0]}">${c[1]} ${c[2]}</button>`).join('');
  const L=items.filter(o=>(flt==='all'||o.status===flt)&&(!q||(o.name+o.id+o.phone+(o.email||"")+o.product).toLowerCase().includes(q)));
  $('#list').innerHTML=L.length?L.map(o=>{const p=pv(o.product);return `<div class="card item" data-id="${esc(o.id)}" style="--c:${p.c};--t:${p.t}"><div class="head">${p.img?`<img class="pi" src="${p.img}" alt="" loading="lazy" onerror="this.className='pi x';this.removeAttribute('src')">`:'<span class="pi x"></span>'}
  <div class="tx"><div class="pn">${esc(o.product)} · <span>${esc(o.name)}</span> <span class="tag ${o.status}" style="margin-left:6px">${lab[o.status]}</span></div>
  <div class="sub" style="margin-bottom:0">${[esc(o.id),fPhone(o.phone),esc(o.email)].filter(Boolean).join(' · ')}<br>접수 ${fmt(o.created)} · 업데이트 ${fmt(o.updated)}${o.symptom?'<br>증상: '+esc(o.symptom):''}</div></div>
  <div class="acts"><button class="mini ed-b">수정</button><button class="mini del">삭제</button></div></div>
  <div class="edit" hidden><div class="row"><div class="f"><label>고객 이름</label><input class="e_name" value="${esc(o.name)}"></div><div class="f"><label>연락처</label><input class="e_phone" value="${esc(fPhone(o.phone))}"></div></div>
  <div class="f"><label>이메일 (선택)</label><input class="e_mail" value="${esc(o.email)}"></div>
  <div class="row"><div class="f"><label>제품</label><select class="e_prod">${PRODUCTS.map(x=>`<option ${x===o.product?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <div class="f"><label>증상</label><textarea class="e_sym" rows="2">${esc(o.symptom)}</textarea></div>
  <button class="btn es" style="padding:10px 20px;font-size:15px">수정 저장</button> <button class="btn ghost ec" style="padding:10px 20px;font-size:15px">취소</button><span class="err e_err" style="display:inline;margin-left:10px"></span></div>
  <div class="ed"><div class="row3"><div><label>상태</label><select class="s">${STEPS.map(s=>`<option value="${s[0]}" ${s[0]===o.status?'selected':''}>${s[1]}</option>`).join('')}</select></div>
  <div class="sh"><label>택배사</label><select class="c">${CARRIERS.map(c=>`<option ${c===o.carrier?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="sh"><label>송장번호</label><input class="t" inputmode="numeric" value="${esc(o.tracking)}"></div></div>
  <div class="f" style="margin-top:10px"><label>고객 안내 메시지 (고객에게 보여요)</label><input class="m" value="${esc(o.note)}" placeholder="예: 모터 교체 후 비행 테스트 중이에요."></div>
  <button class="btn sv" style="padding:10px 20px;font-size:15px">저장</button><span class="ok" hidden>저장됐어요</span><span class="err" style="display:inline;margin-left:10px"></span></div></div>`}).join(''):'<p class="lead">표시할 접수 내역이 없어요.</p>';
  document.querySelectorAll('.item').forEach(sync);
}
function sync(el){const s=el.querySelector('.s').value;el.querySelectorAll('.sh').forEach(x=>x.style.display=s==='shipped'?'':'none');}
$('#list').addEventListener('change',e=>{if(e.target.classList.contains('s'))sync(e.target.closest('.item'));});
$('#list').addEventListener('click',async e=>{
  const card=e.target.closest('.item');if(!card)return;
  if(e.target.closest('.ed-b')){const x=card.querySelector('.edit');x.hidden=!x.hidden;return;}
  if(e.target.closest('.ec')){card.querySelector('.edit').hidden=true;return;}
  if(e.target.closest('.del')){
    if(!confirm(card.dataset.id+' 접수 내역을 삭제할까요?\n삭제하면 되돌릴 수 없어요.'))return;
    const r=await api({action:'delete',code,id:card.dataset.id});if(r.ok)await load();else alert(r.error);return;}
  if(e.target.closest('.es')){
    const g=k=>card.querySelector('.'+k).value.trim(),er=card.querySelector('.e_err');er.textContent='';
    const r=await api({action:'edit',code,id:card.dataset.id,name:g('e_name'),phone:g('e_phone'),email:g('e_mail'),product:g('e_prod'),symptom:g('e_sym')});
    if(r.ok)await load();else er.textContent=r.error;return;}
  const b=e.target.closest('.sv');if(!b)return;const el=b.closest('.item'),st=el.querySelector('.s').value;
  const ok=el.querySelector('.ok'),er=el.querySelector('.err');ok.hidden=true;er.textContent='';b.disabled=true;
  const r=await api({action:'update',code,id:el.dataset.id,status:st,carrier:st==='shipped'?el.querySelector('.c').value:'',tracking:st==='shipped'?el.querySelector('.t').value.trim():'',note:el.querySelector('.m').value.trim()});
  b.disabled=false;
  if(r.ok){ok.hidden=false;const keep=document.querySelector('.item[data-id="'+el.dataset.id+'"]');await load();}else er.textContent=r.error;
});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){flt=b.dataset.f;draw();}});
$('#q').addEventListener('input',draw);
$('#n_go').onclick=async()=>{
  const r=await api({action:'create',code,name:$('#n_name').value.trim(),phone:$('#n_phone').value,email:$('#n_mail').value.trim(),product:$('#n_prod').value,symptom:$('#n_sym').value.trim(),status:$('#n_st').value});
  if(!r.ok){$('#n_err').textContent=r.error;return;}
  $('#n_err').innerHTML='<span style="color:var(--ok)">접수번호 <b>'+esc(r.id)+'</b> 등록 완료. 고객에게 이 번호를 안내해 주세요.</span>';
  ['n_name','n_phone','n_mail','n_sym'].forEach(k=>$('#'+k).value='');load();
};
$('#in').onclick=()=>enter($('#code').value.trim());
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')enter(e.target.value.trim());});
$('#out').onclick=()=>{sessionStorage.removeItem('rl-staff');location.reload();};
if(code)enter(code);
</script></body></html>

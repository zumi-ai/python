<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AS 진행 현황 · 로보링크</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F5F9FF;--card:#fff;--ink:#14213D;--ink2:#46526E;--ink3:#8792AB;--line:#DCE6F5;--brand:#3F7BFF;--brand2:#40C8FF;--navy:#12255C;--ok:#12A36B;--warn:#B25E09;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0D1322;--card:#151C30;--ink:#F2F5FC;--ink2:#B8C1D8;--ink3:#7F8AA6;--line:#26314F;--ok:#3DD598;--warn:#F0A04B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:600 14px inherit;color:inherit;text-decoration:none;cursor:pointer}
.pill:hover{border-color:var(--brand)}
h1{font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;line-height:1.25;margin:10px 0 8px;font-weight:900}
.lead{color:var(--ink2);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 6px 24px rgba(30,60,140,.07)}
label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
.f{margin-bottom:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font:800 16px inherit;padding:13px 22px;border-radius:999px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.err{color:#D14666;font-weight:600;margin:12px 0 0;min-height:1em}
.demo{background:#FFF4D6;color:#5A4300;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}

.steps{list-style:none;margin:20px 0 0;padding:0}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:20px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--brand)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink3)}
.done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.now .dot{background:var(--card);border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 20%,transparent)}
.steps b{display:block;font-size:16px}.steps span{font-size:13.5px;color:var(--ink3)}
.todo b{color:var(--ink3)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink2);margin:6px 0 0}
.ship{margin-top:18px;background:color-mix(in srgb,var(--ok) 10%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line));border-radius:14px;padding:16px}
.ship .no{font-size:22px;font-weight:900;letter-spacing:.02em;margin:2px 0 10px;word-break:break-all}
.ship a,.ship button{margin-right:6px}
.note{margin-top:18px;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14.5px;white-space:pre-wrap}
#res{margin-top:18px}
.logo{display:block}.logo img{height:26px;width:auto;display:block}.lg{text-align:center;margin-bottom:22px}.lg img{height:34px;width:auto}</style></head><body><div class="wrap">

<h1>내 AS, 지금 어디까지 왔나요?</h1>
<p class="lead">AS 접수 후 안내받은 접수번호와 연락처 뒤 4자리를 입력하면 진행 상태를 볼 수 있어요.</p>
<div class="demo" id="demo" hidden>체험 모드예요. 이 브라우저에서만 저장되며, 실제 서비스 전에 as-status.html과 as-admin.html의 API_URL을 설정해 주세요.</div>
<div class="card"><div class="row">
<div class="f"><label for="id">접수번호</label><input id="id" placeholder="AS-261104-001" autocomplete="off"></div>
<div class="f"><label for="p4">연락처 뒤 4자리</label><input id="p4" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off"></div></div>
<button class="btn" id="go">현황 조회하기</button><p class="err" id="err" role="alert"></p></div>
<div id="res" aria-live="polite"></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyRimwNWY8Va6pseElQTV3US4VSve-2ACf_k9cCBoJbfUEQ-OczGmSh56Pj9dqlnyI/exec'; // ← 앱스 스크립트 웹 앱 URL을 여기에 붙여넣으세요. 비어 있으면 이 브라우저에서만 동작하는 체험 모드예요.
const STEPS=[['received','접수 완료','신청 내용을 확인했어요'],['arrived','제품 도착','제품이 로보링크에 도착했어요'],['repairing','AS 진행 중','점검·수리를 진행하고 있어요'],['shipped','발송 완료','수리를 마치고 발송했어요']];
const CARRIERS=['CJ대한통운','우체국택배','한진택배','롯데택배','로젠택배'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function demo(q){
  const K='rl-as-demo';let L=JSON.parse(localStorage.getItem(K)||'[]');const save=()=>localStorage.setItem(K,JSON.stringify(L));
  if(q.action==='lookup'){const r=L.find(o=>o.id.toUpperCase()===String(q.id).trim().toUpperCase()&&o.phone.slice(-4)===String(q.phone4));return r?{ok:true,item:r}:{ok:false,error:'일치하는 접수 내역이 없어요.'};}
  if(q.code!=='demo')return{ok:false,error:'코드가 올바르지 않아요. (체험 모드 코드: demo)'};
  if(q.action==='login')return{ok:true,name:'체험'};
  if(q.action==='list')return{ok:true,items:[...L].reverse()};
  const now=new Date().toISOString();
  if(q.action==='create'){const d=now.slice(2,10).replace(/-/g,''),n=L.filter(o=>o.id.startsWith('AS-'+d)).length+1,id='AS-'+d+'-'+String(n).padStart(3,'0'),phone=String(q.phone).replace(/\D/g,'');
    if(!q.name||phone.length<4||!q.product)return{ok:false,error:'이름, 연락처, 제품은 필수예요.'};
    L.push({id,name:q.name,phone,product:q.product,symptom:q.symptom||'',status:q.status||'received',carrier:'',tracking:'',note:q.note||'',created:now,updated:now});save();return{ok:true,id};}
  if(q.action==='update'){const r=L.find(o=>o.id===q.id);if(!r)return{ok:false,error:'접수번호를 찾을 수 없어요.'};
    if(q.status==='shipped'&&(!q.carrier||!q.tracking))return{ok:false,error:'발송 완료는 택배사와 송장번호가 필요해요.'};
    Object.assign(r,{status:q.status,carrier:q.carrier||'',tracking:q.tracking||'',note:q.note||'',updated:now});save();return{ok:true};}
  return{ok:false,error:'알 수 없는 요청이에요.'};
}
async function api(b){
  if(!API_URL)return demo(b);
  try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});return await r.json();}
  catch(e){return{ok:false,error:'서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.'};}
}
const fmt=iso=>{const d=new Date(iso);return isNaN(d)?'':d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const trackUrl=(c,t)=>'https://search.naver.com/search.naver?query='+encodeURIComponent(c+' '+t);

if(!API_URL)$('#demo').hidden=false;
const qs=new URLSearchParams(location.search);if(qs.get('id'))$('#id').value=qs.get('id');
async function look(){
  const b=$('#go');$('#err').textContent='';$('#res').innerHTML='';
  const id=$('#id').value.trim(),p4=$('#p4').value.trim();
  if(!id||p4.length!==4){$('#err').textContent='접수번호와 연락처 뒤 4자리를 모두 입력해 주세요.';return;}
  b.disabled=true;b.textContent='조회 중…';
  const r=await api({action:'lookup',id,phone4:p4});
  b.disabled=false;b.textContent='현황 조회하기';
  if(!r.ok){$('#err').textContent=r.error;return;}
  const o=r.item,cur=STEPS.findIndex(s=>s[0]===o.status);
  const li=STEPS.map((s,i)=>`<li class="${i<cur||(i===cur&&cur===3)?'done':i===cur?'now':'todo'}"><div class="dot">${i<cur||(i===cur&&cur===3)?'✓':i+1}</div><div><b>${s[1]}</b><span>${s[2]}</span></div></li>`).join('');
  const ship=o.status==='shipped'&&o.tracking?`<div class="ship"><label>${esc(o.carrier)} 송장번호</label><div class="no">${esc(o.tracking)}</div><a class="pill" href="${trackUrl(o.carrier,o.tracking)}" target="_blank" rel="noopener">배송 조회</a><button class="pill" id="cp">번호 복사</button></div>`:'';
  $('#res').innerHTML=`<div class="card"><b style="font-size:18px">${esc(o.product)}</b>
  <div class="meta"><span>접수번호 ${esc(o.id)}</span><span>접수일 ${fmt(o.created)}</span><span>최근 업데이트 ${fmt(o.updated)}</span></div>
  <ol class="steps">${li}</ol>${ship}${o.note?`<div class="note">${esc(o.note)}</div>`:''}</div>`;
  const cp=$('#cp');if(cp)cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(o.tracking):Promise.reject()).then(()=>cp.textContent='✔ 복사됨',()=>prompt('송장번호',o.tracking));};
}
$('#go').onclick=look;['id','p4'].forEach(k=>$('#'+k).addEventListener('keydown',e=>{if(e.key==='Enter')look();}));
if(qs.get('id')&&qs.get('p4')){$('#p4').value=qs.get('p4');look();}
</script></body></html>

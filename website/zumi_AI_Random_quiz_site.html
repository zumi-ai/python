<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zumi AI와 함께하는 인공지능 탐험 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A00E0;
            --primary-light: #8E2DE2;
            --secondary: #FF6B6B;
            --success: #2ECC71;
            --danger: #E74C3C;
            --background: #F4F7FC;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
            --text-muted: #7F8C8D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            padding: 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .container {
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .screen.active {
            display: block;
        }

        /* 정답용 녹색 숨쉬기 애니메이션 */
        @keyframes glowPulseGreen {
            0%, 100% { opacity: 1; color: #2ECC71; filter: drop-shadow(0 0 8px rgba(46,204,113,0.8)); }
            50% { opacity: 0.3; color: #2ECC71; filter: drop-shadow(0 0 1px rgba(46,204,113,0)); }
        }

        /* 오답용 빨간색 숨쉬기 애니메이션 */
        @keyframes glowPulseRed {
            0%, 100% { opacity: 1; color: #E74C3C; filter: drop-shadow(0 0 8px rgba(231,76,60,0.8)); }
            50% { opacity: 0.3; color: #E74C3C; filter: drop-shadow(0 0 1px rgba(231,76,60,0)); }
        }

        .zumi-eyes.glow-green {
            animation: glowPulseGreen 1.5s infinite ease-in-out;
        }

        .zumi-eyes.glow-red {
            animation: glowPulseRed 1.5s infinite ease-in-out;
        }

        .zumi-avatar {
            width: 120px;
            height: 120px;
            background: #0176CE;
            border-radius: 20px;
            margin: 0 auto 20px;
            position: relative;
            border: 4px solid #005697;
            box-shadow: 0 8px 0 #004070;
        }

        .zumi-screen {
            width: 90px;
            height: 60px;
            background: #1A252F;
            border-radius: 10px;
            margin: 15px auto;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .zumi-eyes {
            display: flex;
            gap: 15px;
            transition: 0.3s;
            font-size: 24px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 2px;
            user-select: none;
        }

        .zumi-eyes.normal::before, .zumi-eyes.normal::after {
            content: '';
            width: 14px;
            height: 22px;
            background: #FFFFFF;
            border-radius: 6px;
            animation: blink 2.5s infinite;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            55% { transform: scaleY(0.1); }
        }

        .bubble {
            background: #E8F0FE;
            border-radius: 15px;
            padding: 15px 20px;
            position: relative;
            margin-bottom: 30px;
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 500;
            text-align: center;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #E8F0FE transparent;
            display: block;
            width: 0;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            border: 2px solid #E2E8F0;
            border-radius: 14px;
            background: #FFF;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            text-align: left;
        }

        .btn:hover {
            border-color: var(--primary-light);
            background: #F8F6FF;
            transform: translateY(-2px);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-center {
            text-align: center;
            background: linear-gradient(to right, var(--primary), var(--primary-light));
            color: white;
            border: none;
            font-size: 1.1rem;
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.3);
        }

        .btn-center:hover {
            background: linear-gradient(to right, var(--primary-light), var(--primary));
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(142, 45, 226, 0.4);
        }

        .btn-success {
            text-align: center;
            background: var(--success);
            color: white;
            border: none;
        }
        .btn-success:hover {
            background: #27ae60;
            color: white;
        }

        .btn-link {
            text-align: center;
            background: #EBF5FF;
            color: #0076CE;
            border: 2px dashed #0076CE;
        }
        .btn-link:hover {
            background: #D4E9FF;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #F0F4F8;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .progress-box { color: var(--primary); background: #EEEBFF; padding: 6px 12px; border-radius: 20px; }
        .score-box { display: flex; gap: 10px; }
        .score-tag { padding: 4px 10px; border-radius: 8px; color: white; font-size: 0.85rem; }
        .score-tag.correct { background-color: var(--success); }
        .score-tag.wrong { background-color: var(--danger); }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #EDF2F7;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #8E2DE2, #4A00E0);
            transition: width 0.3s ease;
        }

        .explanation-card {
            display: none;
            background: #F8FAFC;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #E2E8F0;
            text-align: left;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .explanation-card.show {
            display: block;
        }

        .feedback-title {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .feedback-title.correct { color: var(--success); }
        .feedback-title.wrong { color: var(--danger); }

        .explanation-text {
            font-size: 1.15rem; 
            line-height: 1.6;
            color: #334155;     
            margin-bottom: 18px;
        }

        .explanation-img-box {
            width: 100%;
            max-height: 180px;
            background: #E2E8F0;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #CBD5E1;
        }

        .explanation-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; }
        .result-score { font-size: 3rem; font-weight: 900; color: var(--primary); margin-bottom: 20px; }

        .btn-home-link {
            display: block !important;
            width: 100%;
            padding: 16px;
            background-color: #FFFFFF;
            color: #4A00E0;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 18px;       
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); 
            transition: all 0.2s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-home-link:hover {
            background-color: #F8F6FF; 
            transform: translateY(-3px); 
            box-shadow: 0 12px 30px rgba(142, 45, 226, 0.15);
        }
    </style>
</head>

                <button id="action-link-btn" class="btn btn-link" onclick="window.open('https://zumi.co.kr', '_blank')">💡 관련 정보 공식 사이트에서 알아보기 🔍</button>
                <button id="action-next-btn" class="btn btn-success" onclick="nextQuestion()">다음 문제로 이동 ➡️</button>
            </div>
        </div>

        <div id="screen-result" class="screen">
            <h2 class="result-title">탐험 완료!</h2>
            <div class="result-score" id="result-score">0 / 5 점</div>
            <div class="bubble" id="result-comment" style="margin-bottom: 25px;">
                결과 코멘트 자리
            </div>
            <div id="result-actions"></div>
        </div>
    </div>

    let selectedQuestions = [];
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;

    const zumiEyes = document.getElementById('zumiEyes');

    function changeZumiExpression(mood) {
        zumiEyes.innerHTML = ''; 
        zumiEyes.className = 'zumi-eyes'; 
        zumiEyes.style.transform = '';   
        zumiEyes.style.color = '';       

        if (mood === 'normal') {
            zumiEyes.classList.add('normal'); 
        } else if (mood === 'happy') {
            zumiEyes.innerText = '^ ^'; 
            zumiEyes.classList.add('glow-green'); 
        } else if (mood === 'sad') {
            zumiEyes.innerText = 'X X'; 
            zumiEyes.classList.add('glow-red'); 
        }
    }

    function switchScreen(fromId, toId) {
        document.getElementById(fromId).classList.remove('active');
        document.getElementById(toId).classList.add('active');
    }

    function startQuiz() {
        let allQuestions = [...questionBank];
        allQuestions.sort(() => Math.random() - 0.5);
        // [수정] 10개 추출에서 5개 추출로 슬라이스 수치 조절
        selectedQuestions = allQuestions.slice(0, 5);
        
        currentQuestionIndex = 0;
        correctCount = 0;
        wrongCount = 0;
        
        document.getElementById('screen-result').classList.remove('active'); 
        document.getElementById('explanation-card').classList.remove('show'); 
        
        updateScoreBoard();
        switchScreen('screen-intro', 'screen-quiz');
        showQuestion();
    }

    function updateScoreBoard() {
        document.getElementById('count-correct').innerText = correctCount;
        document.getElementById('count-wrong').innerText = wrongCount;
        // [수정] 진행도 텍스트의 총 문제 수 분모를 5로 수정
        document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / 5`;
        
        // [수정] 프로그레스 바 비율 연산 분모를 5로 수정
        const progressPercent = (currentQuestionIndex / 5) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;
    }

    function showQuestion() {
        changeZumiExpression('normal');
        
        const expCard = document.getElementById('explanation-card');
        expCard.classList.remove('show');

        const currentQ = selectedQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = `Q${currentQuestionIndex + 1}. ${currentQ.q}`;
        
        const optionsDiv = document.getElementById('quiz-options');
        optionsDiv.innerHTML = ''; 

        currentQ.a.forEach((option, idx) => {
            const button = document.createElement('button');
            button.className = 'btn';
            button.innerText = `${idx + 1}. ${option}`;
            button.onclick = () => checkAnswer(idx);
            optionsDiv.appendChild(button);
        });

        updateScoreBoard();
    }

    function checkAnswer(selectedIndex) {
        const currentQ = selectedQuestions[currentQuestionIndex];
        const optionsButtons = document.getElementById('quiz-options').children;
        const expCard = document.getElementById('explanation-card');
        const fbTitle = document.getElementById('feedback-title');
        const fbText = document.getElementById('explanation-text');
        const fbImg = document.getElementById('explanation-img');

        for (let btn of optionsButtons) {
            btn.disabled = true;
        }

        fbImg.src = currentQ.img;

        if (selectedIndex === currentQ.c) {
            correctCount++;
            fbTitle.innerText = "🎉 정답입니다!";
            fbTitle.className = "feedback-title correct";
            optionsButtons[selectedIndex].style.background = "#E8F8F5";
            optionsButtons[selectedIndex].style.borderColor = "var(--success)";
            changeZumiExpression('happy'); 
        } else {
            wrongCount++;
            fbTitle.innerText = `❌ 아쉽습니다. (정답은 ${currentQ.c + 1}번)`;
            fbTitle.className = "feedback-title wrong";
            optionsButtons[selectedIndex].style.background = "#FCE4D6";
            optionsButtons[selectedIndex].style.borderColor = "var(--danger)";
            
            optionsButtons[currentQ.c].style.background = "#E8F8F5";
            optionsButtons[currentQ.c].style.borderColor = "var(--success)";
            changeZumiExpression('sad'); 
        }

        fbText.innerText = currentQ.exp;
        expCard.classList.add('show');
        
        expCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function nextQuestion() {
        currentQuestionIndex++;
        // [수정] 10문제에서 5문제 한계치 체크로 조건 수정
        if (currentQuestionIndex < 5) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        switchScreen('screen-quiz', 'screen-result');
        document.getElementById('progress-bar').style.width = '100%';
        // [수정] 결과 점수 표기 분모 5로 수정
        document.getElementById('result-score').innerText = `${correctCount} / 5 문제 정답`;
        
        const resultComment = document.getElementById('result-comment');
        const resultActions = document.getElementById('result-actions');
        
        resultActions.innerHTML = ''; 

        const contactInfo = `
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #A5C2F1; font-size: 1.05rem; color: #475569; line-height: 1.7; text-align: center;">
                <strong style="font-size: 1.15rem; color: #1E293B;">📞 관련 문의 및 상담</strong><br>
                로보링크<br>
                02-554-8862<br>
                contact@robolink.co.kr
            </div>
        `;

        // [수정] 점수 구간별 대응 로직 변경 (5개 만점 / 3개 이하 / 3개 미만)
        if (correctCount === 5) {
            // 5문제 중 5개 다 맞췄을 때
            changeZumiExpression('happy');
            resultComment.innerHTML = `🏆 <b> 주미 AI 완벽 마스터!</b>🎉<br>
5문제를 모두 맞히셨습니다!<br><br>
주미 AI와 자율주행, AI에 대해 잘 알고 계시네요.<br>
하지만 직접 주미 AI를 제어한다면, <br>더 다양한 프로젝트에 도전 할 수 있습니다! ${contactInfo}`;
        } else if (correctCount >= 3) {
            // 5문제 중 3개 이상 4개 이하일 때 (즉, 3개 이하 조건의 상위 조건 충족)
            changeZumiExpression('happy');
            resultComment.innerHTML = `😎 <b>우수한 센스를 가지셨네요!</b> <br> 
주미 AI와 인공지능 기술의 개념을 잘 이해하고 있습니다.<br>
하지만, 주미 AI와 함께 더 많은 교육 커리큘럼을 만나보실 수 있습니다! ${contactInfo}`;
        } else {
            // 3개 미만(못) 맞췄을 때 (0개~2개)
            changeZumiExpression('sad');
            resultComment.innerHTML = `🥺 <b>주미 AI와 더 친해져 볼까요?</b> 
<br> 주미 AI를 직접 손으로 만지고 조종해보면 <br> 인공지능 원리를 훨씬 쉽고 재미있게 학습 할 수 있습니다! <br> 주미 AI와 함께 새로운 도전을 시작해 보세요! ${contactInfo}`;
        }
        
        const buyBtn = document.createElement('button');
        buyBtn.className = 'btn btn-center';
        buyBtn.style.background = 'linear-gradient(to right, #FF416C, #FF4B2B)'; 
        buyBtn.style.boxShadow = '0 5px 15px rgba(255, 65, 108, 0.3)';
        buyBtn.innerText = '🛒 주미 AI 구매하러 가기 (로보링크샵) 👉';
        buyBtn.onclick = () => {
            window.open('https://roboshop.co.kr/product/detail.html?product_no=887&cate_no=1&display_group=2', '_blank');
        };
        resultActions.appendChild(buyBtn);

        const retryBtn = document.createElement('button');
        retryBtn.className = 'btn';
        retryBtn.style.textAlign = 'center';
        retryBtn.style.marginTop = '10px';
        retryBtn.style.fontWeight = '700';
        retryBtn.style.borderColor = 'var(--primary)';
        retryBtn.style.color = 'var(--primary)';
        retryBtn.innerText = '퀴즈 다시 도전하기 🔄';
        retryBtn.onclick = () => {
            startQuiz();
        };
        resultActions.appendChild(retryBtn);
    }
</script>
